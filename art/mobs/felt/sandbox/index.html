<meta charset="utf-8">
<title>필멸자 몬스터 샌드박스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* one-screen field toy: canvas fills the frame, mob picker on top, pattern buttons + stick float over it. single dark-field look in every theme */
:root{--ground:#26301f;--ink:#f2ece0;--muted:#b9b2a4;--panel:rgba(14,12,16,.62);--line:rgba(242,236,224,.38);--on:#c9a24a;--warn:#e0533e;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:var(--f-ui)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#top{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--on);border-color:var(--on);color:#1a140a;font-weight:700}
.chip:focus-visible,.pb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#info{width:100%;font-size:12px;color:var(--muted);text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.5}
#info b{color:var(--ink)}
#pads{display:flex;flex-wrap:wrap;gap:6px;width:100%}
#act{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,auto);gap:8px;align-items:end;justify-items:end}
#skbar{grid-column:1/3;display:grid;grid-template-columns:repeat(4,52px);gap:6px;padding:6px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
#skbar .sk{position:relative;height:52px;border-radius:9px;border:1px solid var(--line);background:rgba(20,24,34,.85);color:var(--ink);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3px;box-sizing:border-box;cursor:pointer;overflow:hidden}
#skbar .sk canvas{position:absolute;left:50%;top:5px;transform:translateX(-50%);width:26px;height:26px;image-rendering:pixelated}
#skbar .sk .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.65) var(--p,0%),transparent 0);pointer-events:none}
#skbar .sk .n{position:absolute;left:4px;top:2px;color:#ffe08a}
#skbar .sk.ready{border-color:#ffe08a}
.pb.big{width:74px;height:74px;border-radius:50%;font-weight:700;font-size:14px;padding:0}
.pb.mid{width:58px;height:58px;border-radius:50%;font-size:12px;padding:0;justify-self:center}
.pb{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 9px;font:inherit;font-size:12px;line-height:1.2;cursor:pointer;text-align:center}
.pb small{display:block;color:var(--muted);font-size:10px}
.pb.on{border-color:var(--on);box-shadow:inset 0 0 0 1px var(--on)}
#roll{background:rgba(201,162,74,.28);border-color:var(--on);font-weight:700}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;background:rgba(0,0,0,.28);border:1px solid var(--line)}
#knob{position:absolute;left:36px;top:36px;width:44px;height:44px;border-radius:50%;background:rgba(242,236,224,.5)}
#keys{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.7;text-align:center;pointer-events:none}
@media (hover:hover) and (pointer:fine){#stick,#bAtk,#roll,#bJump,#bRun{display:none}}
@media (max-width:520px){.pb{padding:5px 6px;font-size:11px}#stick{width:100px;height:100px}#knob{left:28px;top:28px}#skbar{grid-template-columns:repeat(2,52px)}}
</style>

  for(const s of S.shots){g.save();g.translate(Math.round(s.x),Math.round(s.y));g.rotate(Math.atan2(s.vy,s.vx));g.imageSmoothingEnabled=false;(SHOT[s.kind]||SHOT.needle)(g,s);g.restore();}
  g.textAlign='center';g.font='bold 7px "Gowun Dodum",sans-serif';for(const f of S.fx){g.fillStyle=f.col;g.globalAlpha=Math.max(0,1-f.t/.8);g.fillText(f.text,f.x,f.y-f.t*14);g.globalAlpha=1;}
  g.setTransform(1,0,0,1,0,0);if(FLASH>0){g.fillStyle=`rgba(255,255,255,${FLASH*.06})`;g.fillRect(0,0,cv.width,cv.height);}skUI();
  document.getElementById('info').innerHTML=`<b>${d.name}</b> <span style="opacity:.7">${AREA[d.area]}</span> · ${S.auto?'자동 (게임과 같은 AI)':'수동'} · 지금: ${m.st==='idle'?(m.moving?'이동':'대기'):m.st==='melee'?'근접':m.st==='atk'?AIN[d.ai]:'8방향 투사체'} · 몹 HP <b>${Math.max(0,Math.round(m.hp))}</b>/${d.hp} · 처치 <b>${S.kills}</b> · 주인공 HP <b>${hero.hp}</b>/${hero.maxHp}${hero.dead?' (사망 · 곧 부활)':''} · 맞은 횟수 <b>${S.hits}</b>${hero.slow>0?' · <b style="color:#9fd">둔화</b>':''}`;}
function draw47(g,m,d){const J=d.J;g.fillStyle='rgba(0,0,0,.32)';g.beginPath();g.ellipse(m.x,m.y,d.r+2,(d.r*.45+1),0,0,TAU);g.fill();

function heroAnim(h){const d=h.dir,side=h.face>0?'right':'left',A=HA.anims,dd=d==='s'?(h.face<0?'downl':'down'):d==='n'?(h.face<0?'upl':'up'):d;
  if(h.dead)return 'death_'+side;

  if(h.air)return h.jr&&(d==='right'||d==='left')?'rjump_'+d:'jump_'+dd;

  if(h.roll)return 'dash_'+(d==='s'?'down':d==='n'?'up':d);
  const n=(h.moving?(h.run?'run_':'walk_'):'idle_')+d;return A[n]?n:(h.moving?'walk_':'idle_')+side;}
function drawHero(){const g=ctx,h=hero,HSH=sheetsH();if(!HA||!HSH.length||!HSH.every(im=>im&&im.complete)){drawDummy();return;}

  for(;k<fr.length-1;k++){t-=fr[k][2];if(t<0)break;}const [sh,ci]=fr[k],c=HA.cells[sh][ci];h.cell=[sh,ci];
  const shd=Math.max(.35,1-h.z/20);g.fillStyle=`rgba(0,0,0,${.32*shd})`;g.beginPath();g.ellipse(h.x,h.y,6*shd,2.6*shd,0,0,TAU);g.fill();
  g.save();g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  for(const gh of GH){const q=HA.cells[gh.c[0]][gh.c[1]];g.globalAlpha=.55*(1-gh.t/12);g.filter='brightness(.75) sepia(1) hue-rotate(165deg) saturate(4)';   // afterimage (game roll trail look)
    g.drawImage(HSH[gh.c[0]],q[0],q[1],q[2],q[3],gh.x-q[4]*HS,gh.y-q[5]*HS,q[2]*HS,q[3]*HS);}
  g.globalAlpha=1;g.filter=h.white>0?'brightness(0) invert(1)':'none';g.drawImage(HSH[sh],c[0],c[1],c[2],c[3],h.x-c[4]*HS,h.y-h.z-c[5]*HS,c[2]*HS,c[3]*HS);g.restore();
  if(showHB){g.save();g.scale(HS,HS);g.strokeStyle='rgba(120,200,255,.9)';g.lineWidth=1/HS;g.beginPath();g.ellipse(U(h.x),U(h.y),16,16/1.4,0,0,7);g.stroke();
    if(h.sl){const Sl=h.sl,C=COMBO[Sl.n],dv=Sl.dir,on=Sl.t>=SLASH[Sl.n].hit&&Sl.t<SLASH[Sl.n].hit+4;hb(U(h.x)+dv[0]*HB_FWD,U(h.y-h.z)-44+dv[1]*HB_FWD,dv,C.r,C.arc+(dv[0]&&dv[1]?30:0),on?'rgba(255,230,80,.45)':'rgba(255,230,80,.15)');}
    if(!S.mob.dead){const[bx,by,pr]=mobBody();g.strokeStyle='rgba(255,80,80,.9)';g.beginPath();g.arc(bx,by,pr,0,7);g.stroke();}g.restore();}}
function hb(cx,cy,dir,r,arc,col){const a0=Math.atan2(dir[1],dir[0]),h=arc/2*Math.PI/180;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0-h,a0+h);ctx.closePath();ctx.fill();}
