<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클로드 회사</title>
<link rel="icon" href="/ui/icon.png">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/ui/icon.png" alt=""><b>클로드 회사</b></div>
  <div class="summary" id="summary"></div>
  <div class="actions">
    <button class="btn ghost" id="btnFolder" title="AI협력팀이 그록 폴더를 확인해서 보고해요">폴더 확인</button>
    <button class="btn" id="btnHire">＋ 직원 뽑기</button>
    <button class="btn ghost" id="btnRules">허락 목록</button>
    <button class="btn ghost" id="btnSettings">설정</button>
    <button class="btn danger" id="btnStopAll">모두 멈춤</button>
  </div>
</header>

<div id="banners"></div>

<main class="board">
  <section class="left">
    <div class="sec-title">직원 <span id="empCount" class="muted"></span></div>
    <div id="emps" class="emps"></div>
    <form id="orderBox" class="order">
      <div class="order-row">
        <label>받는 사람</label>
        <select id="orderTo"></select>
      </div>
      <textarea id="orderText" rows="4" placeholder="할 일을 적어 주세요. (Ctrl+Enter 로 보내기)&#10;예) 몹 점검 표 다시 뽑아서 보고해"></textarea>
      <div class="order-row end">
        <span class="muted small">직원끼리는 알아서 말을 주고받아요.</span>
        <button class="btn" type="submit">일 시키기</button>
      </div>
    </form>
  </section>

  <section class="right">
    <div class="sec-title">
      보고함
      <div class="tabs" id="tabs">
        <button data-f="boss" class="on">사장님께 <i id="cBoss"></i></button>
        <button data-f="team">직원끼리</button>
        <button data-f="grok">그록 터널 <i id="cGrok"></i></button>
        <button data-f="unread">안 읽음 <i id="cUnread"></i></button>
        <button data-f="media">영상·그림</button>
        <button data-f="error">문제</button>
        <button data-f="all">전체</button>
      </div>
      <select id="filterEmp" class="small-select"><option value="">모든 직원</option></select>
      <button class="link" id="btnReadAll">모두 읽음</button>
    </div>
    <div id="reports" class="reports"></div>
  </section>
</main>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<script src="/ui/app.js"></script>
</body>
</html>
