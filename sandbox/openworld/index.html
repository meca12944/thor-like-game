<meta charset="utf-8">
<title>세미 오픈월드 시험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* one-screen field toy: canvas fills the frame, touch controls float over it. single dark-field look in every theme */
:root{--bg:#2c3a26;--fg:#ffffff;--btn:rgba(0,0,0,.35);--btn-line:rgba(255,255,255,.55);--on:rgba(255,200,60,.55);--info:#9fe8ff;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif;color:var(--fg)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));top:calc(6px + env(safe-area-inset-top,0px));font-size:13px;text-shadow:0 1px 2px #000;pointer-events:none;max-width:calc(100% - 140px)}
#aim{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));top:calc(26px + env(safe-area-inset-top,0px));color:var(--info);font:bold 13px sans-serif;text-shadow:0 1px 2px #000;pointer-events:none}
.btn{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--btn);border:2px solid var(--btn-line);color:var(--fg);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn.on{background:var(--on)}
.small{width:48px;height:48px;font-size:11px}
.pc{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));font:12px system-ui;background:var(--btn);border:1px solid var(--btn-line);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
.pc:focus-visible,.btn:focus-visible{outline:2px solid #ffd27a}
#stick{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.4)}
#knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55)}
#keys{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);padding:14px 18px;border-radius:10px;font-size:14px;line-height:1.7;text-align:center;pointer-events:none}
#keys.off{display:none}
@media (hover:hover) and (pointer:fine){#stick,.btn{display:none}}
@media not ((hover:hover) and (pointer:fine)){.pc{display:none}}
</style>

<canvas id="c"></canvas>
<div id="hud" style="top:auto;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);opacity:.8;font-size:11px;white-space:nowrap">이동 WASD · 공격 J · 대시 K · 달리기 L · E 조사/비석 · M 지도 · F5 저장</div>
<div id="aim" style="display:none"></div>
<button class="pc" id="pReset" type="button" style="top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px))">처음부터</button>
<div id="keys"><b>화면 한 번 클릭 → 키보드 조작</b><br>이스8처럼 로딩 없이 이어진 「시작의 숲」 (6구역)<br>비석(E) = 회복 · 저장 · 순간이동 등록 · 지도(M)에서 숫자키로 순간이동<br>전투 밖이면 어디서나 저장(F5) · 새 구역에 처음 들어가면 자동 저장<br>챔피언 2마리 → 봉인된 문 · 북쪽에서만 여는 지름길 2곳<br>쓰러지면 J = 전투 직전부터 다시 / T = 마지막 비석</div>
<div id="stick"><div id="knob"></div></div>
<div class="btn" id="bAtk" style="right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:76px;height:76px">공격</div>
<div class="btn" id="bDash" style="right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px))">대시</div>
<div class="btn" id="bRun" style="right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px))">달리기</div>
<div class="btn" id="bJump" style="right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px))">점프</div>
<div class="btn" id="bCast" style="right:calc(100px + env(safe-area-inset-right,0px));bottom:calc(180px + env(safe-area-inset-bottom,0px))">스킬</div>
<div class="btn small" id="bHB" style="right:calc(16px + env(safe-area-inset-right,0px));top:calc(120px + env(safe-area-inset-top,0px))">지도</div>
<div class="btn small" id="bUD" style="right:calc(128px + env(safe-area-inset-right,0px));top:calc(120px + env(safe-area-inset-top,0px))">조사</div>
<div class="btn small" id="bReset" style="right:calc(72px + env(safe-area-inset-right,0px));top:calc(120px + env(safe-area-inset-top,0px))">저장</div>
<script>
// Hero sandbox, all-thrust 3-hit (handoff/claude/hero_thrust3_v1) with Linette-style 8-direction trails.
// Art: → ← side, ↘ ↙ ↗ ↖ diagonal. Attack aim = held direction (8): side/diagonal aims use that art and the blade's own tip/dir;
// pure ↑ / ↓ keep the diagonal body (↗/↖ or ↘/↙ by the last left/right) and only the trail and hit box go straight up / down (Linette).
// Other motions = room 1's hero sandbox atlas (6 art dirs). Code-drawn lance trail = port of linette fx.py; nothing baked in the sprites.
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let A,SH=[],IMG={},VW=480,VH=270,SC=1;
function resize(){const d=devicePixelRatio||1,w=innerWidth*d,h=innerHeight*d;SC=Math.max(1,Math.round(h/560));   // field camera: ~540 logical px tall, the hero is ~15% of the screen (Ys VIII field framing)
VW=Math.ceil(w/SC);VH=Math.ceil(h/SC);cv.width=VW;cv.height=VH;ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);resize();
const TILE=document.createElement('canvas');TILE.width=TILE.height=256;{const g=TILE.getContext('2d');g.fillStyle='#567c46';g.fillRect(0,0,256,256);let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<520;i++){g.fillStyle=r()<.6?'#486c3a':'#688e52';g.fillRect(r()*256|0,r()*256|0,2,1);}for(let i=0;i<14;i++){g.fillStyle='#7a9e5e';const x=r()*256|0,y=r()*256|0;g.fillRect(x,y,1,3);g.fillRect(x+2,y+1,1,2);}}
// ---- semi-open world (Ys VIII style): one continuous region of 6 areas on a single coordinate space, no loading between areas.
// Areas are a 3x2 grid of 36x23 cells (40px). Clearings + winding corridors are carved out of a tree mass; tree clumps inside the
// clearings are cover. Only foes near the hero are simulated; dead groups respawn out of sight. Save: waystones (heal + warp),
// anywhere out of combat (F5 / O), auto on entering a new area. Death: retry from just before the fight, or the last waystone.
const CELL=40,AW=48,AH=30,GW=AW*3,GH=AH*2,WW=GW*CELL,WH=GH*CELL;
const AREAS=[{n:'서쪽 숲',c:0,r:0,g:[74,112,64]},{n:'숲 갈림길',c:1,r:0,g:[84,122,70]},{n:'동쪽 습지',c:2,r:0,g:[70,104,82]},
             {n:'마을 문 앞',c:0,r:1,g:[96,128,72]},{n:'바람길',c:1,r:1,g:[90,124,68]},{n:'봉인된 문',c:2,r:1,g:[76,96,66]}];
AREAS.forEach((a,i)=>{a.i=i;a.x=(a.c+.5)*AW*CELL;a.y=(a.r+.5)*AH*CELL;});
const SOL=new Uint8Array(GW*GH).fill(1);   // 1 = tree wall, 2 = water, 0 = walkable
let rs=11;const rnd=()=>(rs=(rs*16807)%2147483647)/2147483647;
function paint(px,py,r,v){const c0=Math.max(0,Math.floor((px-r)/CELL)),c1=Math.min(GW-1,Math.floor((px+r)/CELL)),r0=Math.max(0,Math.floor((py-r)/CELL)),r1=Math.min(GH-1,Math.floor((py+r)/CELL));
  for(let y=r0;y<=r1;y++)for(let x=c0;x<=c1;x++)if(Math.hypot((x+.5)*CELL-px,(y+.5)*CELL-py)<=r)SOL[y*GW+x]=v;}
const PATHS=[];
function corridor(a,b,r){const A=AREAS[a],B=AREAS[b],pts=[],dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy);
  for(let i=0;i<=30;i++){const t=i/30,w=Math.sin(t*Math.PI*2+a+b)*46*Math.sin(t*Math.PI);pts.push([A.x+dx*t-dy/l*w,A.y+dy*t+dx/l*w]);}
  for(const p of pts)paint(p[0],p[1],r,0);PATHS.push(pts);return pts;}
for(const a of AREAS){paint(a.x,a.y,300,0);for(let i=0;i<8;i++){const an=rnd()*6.28,d=160+rnd()*260;paint(a.x+Math.cos(an)*d*1.3,a.y+Math.sin(an)*d*.75,180+rnd()*120,0);}}
for(const a of AREAS)for(let i=0;i<5;i++){const an=i*1.26+rnd(),d=230+rnd()*120;paint(a.x+Math.cos(an)*d,a.y+Math.sin(an)*d*.7,36+rnd()*26,1);}
for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(x%AW<1||x%AW>=AW-1||y%AH<1||y%AH>=AH-1)SOL[y*GW+x]=1;   // keep a tree band on every area border: areas meet only through corridors
for(const[a,b]of[[3,4],[4,1],[1,0],[1,2],[4,5]])corridor(a,b,80);
paint(AREAS[5].x+380,AREAS[5].y,150,0);
const GATES=[];   // shortcuts: open only from the far (north) side, then stay open
for(const[a,b,id]of[[0,3,'gW'],[2,5,'gE']]){const p=corridor(a,b,58),yb=AH*CELL;let q=p[0];for(const s of p)if(Math.abs(s[1]-yb)<Math.abs(q[1]-yb))q=s;let c0=Math.floor(q[0]/CELL),c1=c0;const rr=Math.floor(q[1]/CELL);while(c0>0&&!SOL[rr*GW+c0-1])c0--;while(c1<GW-1&&!SOL[rr*GW+c1+1])c1++;   // gate spans the whole corridor row
  GATES.push({id,x:(c0+c1+1)/2*CELL,y:(rr+.5)*CELL,w:(c1-c0+1)*CELL+24,h:CELL});}
paint(AREAS[1].x+40,AREAS[1].y-330,70,2);
const walk=(x,y)=>{const c=Math.floor(x/CELL),r=Math.floor(y/CELL);return c>=0&&r>=0&&c<GW&&r<GH&&!SOL[r*GW+c];};
function near(x,y){if(walk(x,y))return[x,y];for(let d=CELL;d<600;d+=CELL)for(let k=0;k<16;k++){const a=k/16*6.283,px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;if(walk(px,py))return[px,py];}return[x,y];}
const at=(i,dx,dy)=>near(AREAS[i].x+dx,AREAS[i].y+dy);
const WAYS=[['w1','마을 문 앞 비석',3,-150,-60],['w2','숲 갈림길 비석',1,-90,60],['w3','봉인된 문 비석',5,-120,90]].map(([id,n,a,dx,dy])=>{const[x,y]=at(a,dx,dy);return{id,n,x,y,on:false};});
const DOOR=(()=>{const[x,y]=at(5,400,0);return{x,y,w:110,h:26};})();
const POND={x:AREAS[1].x+40,y:AREAS[1].y-330};
const CHAMPS=[{id:'cA',k:'boar',a:0,hp:40,n:'거대 왕멧돼지 「돌엄니」'},{id:'cB',k:'slime',a:2,hp:36,n:'늪의 왕 슬라임',big:true}];
CHAMPS.forEach(c=>{[c.x,c.y]=at(c.a,0,0);});
const GROUPS=[[3,[['slime',160,90],['slime',220,-60]]],[4,[['slime',-60,120],['slime',40,150],['spirit',0,-120]]],[1,[['spirit',160,-40],['spirit',220,60]]],
  [0,[['slime',-260,120],['slime',-200,170]]],[2,[['spirit',260,-120],['slime',300,80]]],[5,[['spirit',-40,-140],['spirit',40,160]]]].map(([a,m],gi)=>({gi,a,m,t:0}));
// ---- state, explored fog, save ----
const EXP=new Uint8Array(GW*GH),WALKN=SOL.reduce((s,v)=>s+(v?0:1),0);let expN=0;
let FLAGS={},LAST='w1',MAP=false,LOCK=null,AREA=-1,CARD={t:0,n:''},TOAST={t:0,s:''},SNAP=null,WASFIGHT=false,SEEN={};
const LS='abyss.ow.v1';
function toast(s){TOAST={t:150,s};}
function explore(){const c0=Math.floor(P.x/CELL),r0=Math.floor(P.y/CELL);for(let r=r0-7;r<=r0+7;r++)for(let c=c0-9;c<=c0+9;c++){if(c<0||r<0||c>=GW||r>=GH)continue;const i=r*GW+c;if(!EXP[i]&&!SOL[i]){EXP[i]=1;expN++;}else EXP[i]=1;}}
const fighting=()=>foes.some(e=>e.aggro&&!e.dead&&!e.gone)||!!LOCK;
const canSave=()=>!fighting()&&!P.dead;
function save(kind){if(kind!=='way'&&!canSave()){toast('근처에 적이 있어 저장할 수 없음');return false;}
  const ex=[];for(let i=0;i<EXP.length;i+=8){let b=0;for(let k=0;k<8;k++)if(EXP[i+k])b|=1<<k;ex.push(b);}
  const d={x:P.x,y:P.y,hp:P.hp,way:WAYS.filter(w=>w.on).map(w=>w.id),last:LAST,flags:FLAGS,seen:SEEN,ex:ex.join(',')};
  try{localStorage.setItem(LS,JSON.stringify(d));}catch(e){}toast(kind==='auto'?'자동 저장 · '+AREAS[AREA].n:kind==='way'?'비석에 기록 — 체력 회복 · 저장':'저장 완료');return true;}
function loadSave(){let d=null;try{d=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
  const w1=WAYS[0];P.x=w1.x+40;P.y=w1.y+30;
  if(!d)return false;P.x=d.x;P.y=d.y;P.hp=d.hp||HP_MAX;LAST=d.last||'w1';FLAGS=d.flags||{};SEEN=d.seen||{};for(const w of WAYS)w.on=(d.way||[]).includes(w.id);
  if(d.ex){const ex=d.ex.split(',').map(Number);expN=0;for(let i=0;i<EXP.length;i++){EXP[i]=(ex[i>>3]>>(i&7))&1;if(EXP[i]&&!SOL[i])expN++;}}
  for(const g of GATES)g.open=!!FLAGS[g.id];toast('이어하기 — 저장한 곳에서 시작');return true;}
function newGame(){try{localStorage.removeItem(LS);}catch(e){}location.reload();}
function blocked(x,y){if(!walk(x,y))return true;for(const g of GATES)if(!g.open&&Math.abs(x-g.x)<g.w/2&&Math.abs(y-g.y)<g.h/2+8)return true;
  if(!FLAGS.door&&Math.abs(x-DOOR.x)<DOOR.w/2&&Math.abs(y-DOOR.y)<DOOR.h/2+6)return true;return false;}
const heroBlocked=(x,y)=>blocked(x-9,y)||blocked(x+9,y)||blocked(x,y-5)||blocked(x,y+5)||(LOCK&&Math.hypot(x-LOCK.x,(y-LOCK.y)*1.3)>LOCK.R);
function warp(w){P.x=w.x+40;P.y=w.y+30;P.hp=HP_MAX;LAST=w.id;camX=P.x-VW/2;camY=P.y-VH*.55;LOCK=null;resetFoes();}
function resetFoes(){for(const e of foes)if(!e.dead&&!e.gone){e.x=e.hx;e.y=e.hy;e.hp=e.max;e.aggro=false;e.st='idle';e.cd=80;}}
function interact(){if(P.dead)return;const d=(x,y)=>Math.hypot(P.x-x,P.y-y);
  for(const w of WAYS)if(d(w.x,w.y)<70){if(fighting()){toast('전투 중에는 비석을 쓸 수 없음');return;}const first=!w.on;w.on=true;LAST=w.id;P.hp=HP_MAX;save('way');if(first)CARD={t:150,n:w.n+' 등록 — 지도(M)에서 순간이동'};return;}
  for(const g of GATES)if(!g.open&&d(g.x,g.y)<110){if(P.y<g.y){g.open=true;FLAGS[g.id]=1;SHAKE=3;toast('지름길이 열렸다!');save('auto');}else toast('반대편에서 빗장이 걸려 있다');return;}
  if(d(DOOR.x,DOOR.y)<110){const n=CHAMPS.filter(c=>FLAGS[c.id]).length;if(n<2)toast('봉인 '+n+' / 2 — 두 챔피언을 쓰러뜨려야 열린다');else{FLAGS.door=1;toast('봉인이 풀렸다 — 보스 방 입구 (데모는 여기까지)');save('auto');}return;}
  if(d(POND.x,POND.y)<140){toast('물속 깊이 무언가 반짝인다… (잠수 능력을 얻으면 다시 오자)');SEEN.pond=1;return;}}
function prompt(){const d=(x,y)=>Math.hypot(P.x-x,P.y-y);for(const w of WAYS)if(d(w.x,w.y)<70)return 'E  비석';for(const g of GATES)if(!g.open&&d(g.x,g.y)<110)return 'E  빗장';
  if(!FLAGS.door&&d(DOOR.x,DOOR.y)<110)return 'E  봉인된 문';if(d(POND.x,POND.y)<140)return 'E  물 살피기';return '';}

// thrust combo: strike tick from the atlas (thr), cancel after the hold; long narrow hit box along the aim
// skill-speed thrusts: attack clips play at ATK_SPEED (wind-up frames squeezed hardest), each strike fires a laser beam of length L
const ATK_SPEED=0.5;
const COMBO=[{cancel:.62,r:150,arc:70,dmg:1,kb:6},{cancel:.62,r:155,arc:70,dmg:1,kb:7},{cancel:1,len:380,w:3,dmg:2,kb:12}];  // hits 1-2: lance trail + sector, hit 3: thin laser  // cancel = share of the clip
const CHIT=[{push:10,stop:3,shake:1.5},{push:14,stop:4,shake:2.5},{push:24,stop:8,shake:5}];
const HB_FWD=22,HERO_R=16,HERO_INV=60,HERO_KB=18,HITSTOP=6,HP_MAX=20;
const JUMP_H=84,JUMP_T=15,JUMP_V=2*JUMP_H/JUMP_T,GRAV=JUMP_V/JUMP_T;
const BLOCKS=[];
function groundAt(x,y){let g=0;for(const b of BLOCKS)if(x>b.x-6&&x<b.x+b.w+6&&y>b.y-3&&y<b.y+b.d+3)g=Math.max(g,b.h);return g;}
const P={x:0,y:0,face:'right',lastH:1,aim:[1,0],st:'idle',t:0,clip:null,combo:0,queued:false,run:false,dead:false,inv:0,white:0,kbx:0,kby:0,hitDone:false,hp:HP_MAX,deadT:0,z:0,vz:0,air:false,jv:0};
let foes=[],showHB=false,stop=0,pops=[],SHAKE=0,FLASH=0,camX=0,camY=0;const WAVES=[],BEAMS=[],SPARKS=[],CTR=[];
const SFX={};['swing_light','swing_heavy','hit_light','hit_heavy','kill'].forEach(n=>{try{SFX[n]=new Audio('sfx/'+n+'.ogg')}catch(e){}});
let audioOn=false;const snd=n=>{if(!audioOn||!SFX[n])return;try{const a=SFX[n].cloneNode();a.volume=.45;a.play().catch(()=>{})}catch(e){}};
const K={};let joy={x:0,y:0};
cv.tabIndex=0;cv.style.outline='none';cv.focus();addEventListener('pointerdown',()=>{cv.focus();audioOn=true});
const keysEl=document.getElementById('keys');if(matchMedia('(pointer:coarse)').matches)keysEl.classList.add('off');addEventListener('pointerdown',()=>keysEl.classList.add('off'));
addEventListener('keydown',e=>{const c=e.code;if(/^Arrow|^Space$|^F5$/.test(c))e.preventDefault();keysEl.classList.add('off');audioOn=true;if(e.repeat||K[c])return;K[c]=1;
 if(MAP){if(c==='KeyM'||c==='Escape')MAP=false;const n=+c.replace('Digit','');if(n>=1&&n<=WAYS.length&&WAYS[n-1].on&&!fighting()){warp(WAYS[n-1]);MAP=false;toast(WAYS[n-1].n+'(으)로 순간이동');}return;}
 if(P.dead){if(P.deadT>40){if(c==='KeyJ'||c==='KeyZ'||c==='Enter')retry(SNAP?'snap':'way');if(c==='KeyT')retry('way');}return;}
 if(c==='KeyM')MAP=true;if(c==='KeyE'||c==='KeyC')interact();if(c==='F5'||c==='KeyO')save('manual');
 if(c==='KeyJ'||c==='KeyZ')attack();if(c==='KeyK'||c==='ShiftLeft'||c==='ShiftRight')dash();if(c==='KeyL')P.run=!P.run,ui();if(c==='KeyU')cast();
 if(c==='Space'||c==='KeyX')jump();if(c==='KeyH')showHB=!showHB,ui();});
addEventListener('keyup',e=>{K[e.code]=0;});addEventListener('blur',()=>{for(const k in K)K[k]=0;});
function tap(id,f){document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();f();});}

function speedUp(){for(const k in A.anims){if(!k.startsWith('thit'))continue;const L=A.anims[k],key=k.slice(1),th=A.thr[key];let c=0,fi=L.length-1;
