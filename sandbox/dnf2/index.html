<meta charset="utf-8">
<title>필멸자 좌우 샌드박스 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* one-screen field toy (room 1's hero sandbox, left/right only): canvas fills the frame, touch controls float over it. single dark-field look in every theme */
:root{--bg:#2c3a26;--fg:#ffffff;--btn:rgba(0,0,0,.35);--btn-line:rgba(255,255,255,.55);--on:rgba(255,200,60,.55);--info:#9fe8ff;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif;color:var(--fg)}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));top:calc(6px + env(safe-area-inset-top,0px));font-size:13px;text-shadow:0 1px 2px #000;pointer-events:none;max-width:calc(100% - 180px)}
#hmode{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));top:calc(26px + env(safe-area-inset-top,0px));color:var(--info);font:bold 13px sans-serif;text-shadow:0 1px 2px #000;pointer-events:none}
.btn{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--btn);border:2px solid var(--btn-line);color:var(--fg);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn.on{background:var(--on)}
.small{width:48px;height:48px;font-size:11px}
.pc{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));font:12px system-ui;background:var(--btn);border:1px solid var(--btn-line);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
.pc:focus-visible,.btn:focus-visible{outline:2px solid #ffd27a}
#stick{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.4)}
#knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55)}
#keys{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);padding:14px 18px;border-radius:10px;font-size:14px;line-height:1.7;text-align:center;pointer-events:none}
#keys.off{display:none}
@media (hover:hover) and (pointer:fine){#stick,.btn{display:none}}
@media not ((hover:hover) and (pointer:fine)){.pc{display:none}}
</style>

<canvas id="c"></canvas>
<div id="hud">이동 WASD/방향키 · 공격 J/Z · 대시(회피) K/Shift · 달리기 L · 점프 Space/X · 스킬 U · 공격 방식 M · 판정 H · 사망 P</div>
<div id="hmode">공격 방식(M): </div>
<button class="pc" id="pMode" type="button" style="right:calc(110px + env(safe-area-inset-right,0px))">공격 방식 바꾸기</button>
<button class="pc" id="pReset" type="button" style="right:calc(10px + env(safe-area-inset-right,0px))">적 다시 놓기</button>
<div id="keys"><b>화면 한 번 클릭 → 키보드 조작</b><br>이동 WASD / 방향키 · 캐릭터는 좌우만 봄<br>공격 J 또는 Z (연타 3타) · 대시(회피) K 또는 Shift<br>달리기 L · 점프 Space 또는 X · 스킬 U<br>공격 방식 M · 판정 H · 사망 P</div>
<div id="stick"><div id="knob"></div></div>
<div class="btn" id="bAtk" style="right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:76px;height:76px">공격</div>
<div class="btn" id="bDash" style="right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px))">대시</div>
<div class="btn" id="bRun" style="right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px))">달리기</div>
<div class="btn" id="bJump" style="right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px))">점프</div>
<div class="btn" id="bCast" style="right:calc(100px + env(safe-area-inset-right,0px));bottom:calc(180px + env(safe-area-inset-bottom,0px))">스킬</div>
<div class="btn small" id="bHB" style="right:calc(16px + env(safe-area-inset-right,0px));top:calc(40px + env(safe-area-inset-top,0px))">판정</div>
<div class="btn small" id="bDie" style="right:calc(72px + env(safe-area-inset-right,0px));top:calc(40px + env(safe-area-inset-top,0px))">사망</div>
<div class="btn small" id="bMode" style="right:calc(128px + env(safe-area-inset-right,0px));top:calc(40px + env(safe-area-inset-top,0px))">방식</div>
<div class="btn small" id="bReset" style="right:calc(184px + env(safe-area-inset-right,0px));top:calc(40px + env(safe-area-inset-top,0px))">적</div>
<script>
// Left/right-only (DnF-style) sandbox built on room 1's hero sandbox (handoff/claude/hero_atk_feel_v2): same atlas, motions, combo ticks,
// hit sectors and Linette feel, but the hero only ever faces left/right (side clips), the field is a horizontal belt, and 5 enemies.
// Attack sets (M): 0 = room 1 attack as in the game, 1 = room 1 attack + Linette feel (mode C), 2 = new 3-hit (slash, horizontal slash, thrust).
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let A,SH=[],IMG={},VW=480,VH=270,SC=1;
function resize(){const d=devicePixelRatio||1,w=innerWidth*d,h=innerHeight*d;SC=Math.max(1,Math.floor(Math.min(w/380,h/320)));VW=Math.ceil(w/SC);VH=Math.ceil(h/SC);cv.width=VW;cv.height=VH;ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);resize();
const TILE=document.createElement('canvas');TILE.width=TILE.height=256;{const g=TILE.getContext('2d');g.fillStyle='#567c46';g.fillRect(0,0,256,256);let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<520;i++){g.fillStyle=r()<.6?'#486c3a':'#688e52';g.fillRect(r()*256|0,r()*256|0,2,1);}for(let i=0;i<14;i++){g.fillStyle='#7a9e5e';const x=r()*256|0,y=r()*256|0;g.fillRect(x,y,1,3);g.fillRect(x+2,y+1,1,2);}}
// ---- belt field (sprite pixels): x from X0 to X1, feet line y from Y0 (back) to Y1 (front)
const X0=-700,X1=1500,Y0=-70,Y1=110;
// ---- tuning (sprite pixels, 60 ticks/s); room 1 values unless noted
const COMBO_R1=[{hit:5,cancel:12,r:124,arc:150,dmg:1,kb:5},{hit:6,cancel:15,r:100,arc:170,dmg:1,kb:6},{hit:9,cancel:23,r:118,arc:160,dmg:2,kb:10}];
const COMBO_NEW=[{hit:12,cancel:14,r:124,arc:150,dmg:1,kb:5},{hit:8,cancel:15,r:120,arc:150,dmg:1,kb:6},{hit:4,cancel:23,r:150,arc:90,dmg:2,kb:12}];  // new clips: ticks from the packed frames, thrust reaches further but narrower
const SETS=[{name:'1번방 공격 (게임 그대로)',clip:'hit',combo:COMBO_R1,feel:0},{name:'1번방 공격 + 리네트 손맛',clip:'hit',combo:COMBO_R1,feel:1},{name:'새 3연타 (내려베기·가로베기·찌르기)',clip:'nhit',combo:COMBO_NEW,feel:1,fx:'cres'}];
let ATKSET=1;
const CHIT=[{push:8,stop:4,shake:1.5},{push:10,stop:5,shake:2},{push:18,stop:9,shake:4}];
const HB_FWD=22,HERO_R=16,HERO_INV=60,HERO_KB=18,HITSTOP=6,HP_MAX=10;
const JUMP_H=84,JUMP_T=15,JUMP_V=2*JUMP_H/JUMP_T,GRAV=JUMP_V/JUMP_T;
const RJUMP_T=15,RJUMP_V=2*JUMP_H/RJUMP_T,RGRAV=RJUMP_V/RJUMP_T,RJUMP_SP=4.0;
const BLOCKS=[{x:240,y:-40,w:96,d:44,h:36}];
function groundAt(x,y){let g=0;for(const b of BLOCKS)if(x>b.x-6&&x<b.x+b.w+6&&y>b.y-3&&y<b.y+b.d+3)g=Math.max(g,b.h);return g;}
const P={x:0,y:20,f:1,st:'idle',t:0,clip:null,combo:0,queued:false,run:false,dead:false,inv:0,white:0,kbx:0,kby:0,hitDone:false,hp:HP_MAX,deadT:0,z:0,vz:0,air:false,jr:false,jv:0};
let foes=[],showHB=false,stop=0,pops=[],SHAKE=0,FLASH=0,camX=0;const WAVES=[],CTR=[],CRES=[];
const SFX={};['swing_light','swing_heavy','hit_light','hit_heavy','kill'].forEach(n=>{try{SFX[n]=new Audio('sfx/'+n+'.ogg')}catch(e){}});
let audioOn=false;const snd=n=>{if(!audioOn||!SFX[n])return;try{const a=SFX[n].cloneNode();a.volume=.45;a.play().catch(()=>{})}catch(e){}};
const K={};let joy={x:0,y:0};
cv.tabIndex=0;cv.style.outline='none';cv.focus();addEventListener('pointerdown',()=>{cv.focus();audioOn=true});
const keysEl=document.getElementById('keys');if(matchMedia('(pointer:coarse)').matches)keysEl.classList.add('off');addEventListener('pointerdown',()=>keysEl.classList.add('off'));
addEventListener('keydown',e=>{const c=e.code;if(/^Arrow|^Space$/.test(c))e.preventDefault();keysEl.classList.add('off');audioOn=true;if(e.repeat||K[c])return;K[c]=1;
 if(c==='KeyJ'||c==='KeyZ')attack();if(c==='KeyK'||c==='ShiftLeft'||c==='ShiftRight')dash();if(c==='KeyL')P.run=!P.run,ui();if(c==='KeyU')cast();
 if(c==='Space'||c==='KeyX')jump();if(c==='KeyH')showHB=!showHB,ui();if(c==='KeyP')die();if(c==='KeyM')nextSet();});
addEventListener('keyup',e=>{K[e.code]=0;});addEventListener('blur',()=>{for(const k in K)K[k]=0;});
function tap(id,f){document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();f();});}
tap('bAtk',attack);tap('bDash',dash);tap('bRun',()=>{P.run=!P.run;ui();});tap('bCast',cast);tap('bJump',jump);tap('bHB',()=>{showHB=!showHB;ui();});tap('bDie',die);tap('bMode',nextSet);tap('bReset',spawn);
document.getElementById('pMode').addEventListener('click',()=>{nextSet();cv.focus()});document.getElementById('pReset').addEventListener('click',()=>{spawn();cv.focus()});
function nextSet(){ATKSET=(ATKSET+1)%SETS.length;ui();}
function ui(){document.getElementById('hmode').textContent='공격 방식(M): '+SETS[ATKSET].name;document.getElementById('bRun').classList.toggle('on',P.run);document.getElementById('bHB').classList.toggle('on',showHB);}
{const st=document.getElementById('stick'),kn=document.getElementById('knob');let id=null;
 const mv=e=>{const r=st.getBoundingClientRect();let dx=e.clientX-r.left-60,dy=e.clientY-r.top-60;const m=Math.hypot(dx,dy),R=44;if(m>R){dx*=R/m;dy*=R/m;}kn.style.left=38+dx+'px';kn.style.top=38+dy+'px';joy={x:dx/R,y:dy/R};};
 st.addEventListener('pointerdown',e=>{id=e.pointerId;st.setPointerCapture(id);mv(e);});st.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e);});
 const up=e=>{if(e.pointerId!==id)return;id=null;kn.style.left=kn.style.top='38px';joy={x:0,y:0};};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);}
const clip=n=>A.anims[n];const total=L=>L.reduce((s,e)=>s+e[2],0);
function frameAt(L,t,loop){if(loop)t%=total(L);for(const e of L){if(t<e[2])return e;t-=e[2];}return L[L.length-1];}
const side=()=>P.f>0?'right':'left';
function start(st,name){P.st=st;P.t=0;P.clip=name;P.hitDone=false;}
const atkClip=n=>SETS[ATKSET].clip+n+'_'+side();
function attack(){if(P.dead||P.air)return;if(P.st==='atk'){P.queued=true;return;}if(P.st==='dash'||P.st==='hurt'||P.st==='cast')return;P.combo=1;P.set=ATKSET;start('atk',atkClip(1));snd('swing_light');}
function jump(){if(P.dead||P.air||(P.st!=='idle'&&P.st!=='move'))return;P.jr=P.run&&P.st==='move';P.jv=P.jr?RJUMP_V:JUMP_V;P.vz=P.jv;P.air=true;start('jump',(P.jr?'rjump_':'jump_')+side());}
function dash(){if(P.dead||P.air||P.st==='atk'||P.st==='dash'||P.st==='hurt')return;const ix=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0)+joy.x;if(Math.abs(ix)>.3)P.f=ix>0?1:-1;
  P.dy=((K.ArrowDown||K.KeyS?1:0)-(K.ArrowUp||K.KeyW?1:0)+joy.y);start('dash','dash_'+side());}   // dash = dodge: invulnerable while it plays
function cast(){if(P.dead||P.st!=='idle'&&P.st!=='move')return;start('cast','cast_'+side());P.castHit=false;}
function hurt(dx,dy,dmg){if(P.dead||P.inv>0||P.st==='dash')return;P.hp=Math.max(0,P.hp-(dmg||1));const l=Math.hypot(dx,dy)||1;P.kbx=dx/l;P.kby=dy/l;P.inv=HERO_INV;P.white=3;stop=HITSTOP;start('hurt','hurt_'+side());snd('hit_light');if(P.hp<=0){P.dead=true;start('death','death_'+side());}}
function die(){if(P.dead){P.dead=false;P.hp=HP_MAX;start('idle','idle_'+side());return;}P.dead=true;start('death','death_'+side());}
function inSector(cx,cy,dir,r,arc,px,py,pr){const dx=px-cx,dy=py-cy,d=Math.hypot(dx,dy);if(d>r+pr)return false;if(d<pr)return true;
  const a=Math.acos(Math.max(-1,Math.min(1,(dx*dir[0]+dy*dir[1])/d)))*180/Math.PI;return a<=arc/2+Math.asin(Math.min(1,pr/d))*180/Math.PI;}
// ---- enemies (5): 3 slimes, 1 spirit, 1 boar (mini boss, charges along its row)
function spawn(){foes=[
  {k:'slime',x:260,y:60,hp:5},{k:'slime',x:420,y:-30,hp:5},{k:'slime',x:560,y:90,hp:5},{k:'spirit',x:780,y:20,hp:6},{k:'boar',x:1080,y:30,hp:16}
 ].map(e=>Object.assign(e,{max:e.hp,kbx:0,kby:0,t:Math.random()*60|0,cd:60+Math.random()*80|0,flash:0,dead:0,gone:false,f:-1,st:'idle',
   r:e.k==='boar'?44:e.k==='spirit'?20:20,h:e.k==='boar'?80:e.k==='spirit'?56:40,heavy:e.k==='boar'}));}
function hitFoes(cx,cy,dir,C,heavyFx){let any=false;
  for(const e of foes){if(e.dead||e.gone||P.z>=30)continue;
    if(inSector(cx,cy,dir,C.r,C.arc,e.x,e.y-e.h/2,e.r)){any=true;e.hp-=C.dmg;e.flash=8;const kb=C.kb*(e.heavy?.35:1);e.kbx=dir[0]*kb;e.kby=dir[1]*kb;if(e.st==='wind'||e.st==='lunge')e.st='idle',e.cd=50;
      pops.push({x:e.x,y:e.y-e.h-14,t:0,s:String(C.dmg),big:heavyFx});if(e.hp<=0){e.dead=60;snd('kill');}}}
  if(any)snd(heavyFx?'hit_heavy':'hit_light');return any;}
function foeStep(e){
  if(e.gone)return;if(e.dead){if(--e.dead<=0)e.gone=true;return;}
  e.t++;if(e.flash>0)e.flash--;e.x+=e.kbx;e.y+=e.kby;e.kbx*=.8;e.kby*=.8;
  const dx=P.x-e.x,dy=P.y-e.y,ad=Math.abs(dx);if(e.st!=='charge'&&e.st!=='lunge')e.f=dx>0?1:-1;
  const near=()=>!P.dead&&P.z<20&&Math.abs(P.x-e.x)<e.r+HERO_R&&Math.abs(P.y-e.y)<16;
  if(e.flash>4)return;
  if(e.k==='boar'){
    if(e.st==='charge'){e.x+=e.cf*6.5;if(--e.ct<=0||e.x<X0+40||e.x>X1-40){e.st='idle';e.cd=100;}if(near())hurt(e.cf,0,2);return;}
    if(e.st==='wind'){if(--e.wt<=0){e.st='charge';e.ct=46;}return;}
    e.y+=Math.sign(dy)*Math.min(1,Math.abs(dy));if(ad>260)e.x+=e.f*1;
    if(--e.cd<=0&&Math.abs(dy)<16&&ad<520){e.st='wind';e.wt=36;e.cf=e.f;}
    return;}
  const sp=e.k==='spirit'?1.1:.9;
  if(e.st==='wind'){if(--e.wt<=0){e.st='lunge';e.lt=14;}return;}
  if(e.st==='lunge'){e.x+=e.f*4.6;if(--e.lt<=0){e.st='idle';e.cd=70+Math.random()*60|0;}if(near())hurt(e.f,0,1);return;}
  if(ad>70)e.x+=e.f*sp;else if(ad<44)e.x-=e.f*sp*.6;
  e.y+=Math.sign(dy)*Math.min(sp*.7,Math.abs(dy));
  if(--e.cd<=0&&ad<110&&Math.abs(dy)<20){e.st='wind';e.wt=24;}
}
function step(){
  if(stop>0){stop--;return;}
  let ix=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0)+joy.x,iy=(K.ArrowDown||K.KeyS?1:0)-(K.ArrowUp||K.KeyW?1:0)+joy.y;const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
  const moving=m>0.2;P.t++;if(P.inv>0)P.inv--;
  if(P.air){P.vz-=P.jr?RGRAV:GRAV;P.z+=P.vz;const g=groundAt(P.x,P.y);if(P.z<=g&&P.vz<=0){P.z=g;P.vz=0;P.air=false;P.jr=false;P.jv=0;if(P.st==='jump')start('idle','idle_'+side());}}
  else{const g=groundAt(P.x,P.y);if(g<P.z-1){P.air=true;P.vz=0;P.jv=P.jv||JUMP_V;if(P.st==='idle'||P.st==='move')start('jump','jump_'+side()),P.t=JUMP_T;}else P.z=g;}
  if(P.st==='jump'){if(moving){if(Math.abs(ix)>.25)P.f=ix>0?1:-1;const js=P.jr?RJUMP_SP:1.3;moveHero(ix*js,iy*js);}return world();}
  if(P.st==='idle'||P.st==='move'){
    if(moving){if(Math.abs(ix)>.25)P.f=ix>0?1:-1;const sp=P.run?2.2:1.0;moveHero(ix*sp,iy*sp*.8);const n=(P.run?'run_':'walk_')+side();if(P.st!=='move'||P.clip!==n){P.st='move';P.clip=n;}}
    else if(P.st!=='idle'||P.clip!=='idle_'+side())start('idle','idle_'+side());
  }else{
    const L=clip(P.clip),T=total(L);
    if(P.st==='dash'){const k=1-P.t/T,dy=Math.max(-1,Math.min(1,P.dy||0));moveHero(P.f*5*k*(dy?.75:1),dy*3.5*k);}
    if(P.st==='hurt'){const k=Math.max(0,1-P.t/18);moveHero(P.kbx*HERO_KB/9*k,P.kby*HERO_KB/9*k);}
    if(P.st==='cast'&&!P.castHit&&P.t>=Math.floor(T*.55)){P.castHit=true;FLASH=3;WAVES.push({x:P.x,y:P.y,t:0,big:1});SHAKE=Math.max(SHAKE,2);hitFoes(P.x,P.y-30,[P.f,0],{r:150,arc:360,dmg:2,kb:9},true);}
    if(P.st==='atk'){const S=SETS[P.set],C=S.combo[P.combo-1],H=CHIT[P.combo-1],dir=[P.f,0];
      if(S.feel){if(P.t<C.hit-4)moveHero(dir[0]*.9,0);if(P.t>=C.hit-4&&P.t<C.hit)moveHero(dir[0]*H.push/4,0);}
      else if(P.t<C.hit)moveHero(dir[0]*.9,0);
      if(!P.hitDone&&P.t>=C.hit){P.hitDone=true;const cx=P.x+dir[0]*HB_FWD,cy=P.y-44;
        const any=hitFoes(cx,cy,dir,C,P.combo===3);
        if(S.feel){stop=H.stop;SHAKE=Math.max(SHAKE,H.shake);if(P.combo===3){FLASH=4;WAVES.push({x:P.x+dir[0]*90,y:P.y-44,t:0});}
          if(S.fx==='cres'&&P.combo<3)CRES.push({x:P.x,y:P.y,f:P.f,n:P.combo,t:0});else CTR.push({x:P.x+dir[0]*20,y:P.y-44,dir,t:0,heavy:P.combo===3,big:P.combo>1});}
        else if(any)stop=HITSTOP+(P.combo===3?5:0);}
      if(P.queued&&P.combo<3&&P.t>=C.cancel){P.queued=false;P.combo++;const ix2=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0)+joy.x;if(Math.abs(ix2)>.3)P.f=ix2>0?1:-1;start('atk',atkClip(P.combo));snd(P.combo===3?'swing_heavy':'swing_light');return world();}}
    if(P.t>=T){if(P.st==='death'){P.t=T;if(++P.deadT>120){P.dead=false;P.hp=HP_MAX;P.deadT=0;P.inv=HERO_INV;start('idle','idle_'+side());}return world();}P.queued=false;start('idle','idle_'+side());}
  }
  world();
}
