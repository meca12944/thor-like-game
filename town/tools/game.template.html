<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Town Demo</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;inset:0;pointer-events:none}
#atk{position:fixed;right:max(28px,env(safe-area-inset-right));bottom:max(34px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;
 background:radial-gradient(circle at 40% 35%,#ff8a6a,#c23224 60%,#7a1610);border:4px solid #2a0d08;box-shadow:0 0 0 3px #e8d6b0 inset,0 4px 0 #000a;
 color:#fff6e0;font:bold 22px/96px sans-serif;text-align:center;text-shadow:2px 2px 0 #4a0f08;pointer-events:auto;display:none}
#atk.on{transform:scale(.92);filter:brightness(1.2)}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#0004;border:3px solid #fff6;display:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffc;border:3px solid #333a}
#hint{transition:opacity 1s;position:fixed;left:50%;bottom:8px;transform:translateX(-50%);color:#fff9;font:12px sans-serif;text-shadow:1px 1px 0 #000}
body.touch #atk{display:block} body.touch #hint{display:none}
/* skill quick slots (3) */
.slot{position:fixed;width:64px;height:64px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle at 40% 35%,#5a8ef0,#24479c 62%,#132a63);
 border:4px solid #0b1430;box-shadow:0 0 0 3px #e8d6b0 inset,0 4px 0 #000a;overflow:hidden}
.slot .ic{position:absolute;left:8px;top:8px;width:48px;height:48px;image-rendering:pixelated;background:url(assets/ui_icons.png) 0 0/480px 48px no-repeat}
.slot .cd{position:absolute;inset:0;border-radius:50%}
.slot .k{position:absolute;right:9px;bottom:5px;font:bold 12px monospace;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.slot .plus{position:absolute;inset:0;font:bold 30px/56px monospace;color:#e8d6b0;text-align:center}
.slot.low{filter:saturate(.35) brightness(.75)} .slot.on{transform:scale(.92);filter:brightness(1.25)}
#s0{right:236px;bottom:24px}#s1{right:162px;bottom:24px}#s2{right:88px;bottom:24px}
body.touch #s0{right:138px;bottom:26px} body.touch #s1{right:132px;bottom:112px} body.touch #s2{right:52px;bottom:148px}
#wbtn{position:fixed;right:20px;top:16px;pointer-events:auto;padding:6px 12px;background:#1b2550;color:#fff6e0;font:bold 15px monospace;
 border:3px solid #e8d6b0;box-shadow:0 0 0 3px #0b0b14,0 3px 0 3px #000a;cursor:pointer}
#slotsKeys{position:fixed;right:24px;bottom:94px;color:#fff9;font:11px monospace;text-shadow:1px 1px 0 #000}
body.touch #slotsKeys{display:none}
#atk.desk{display:none}
/* skill window */
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;pointer-events:auto}
#win.open{display:flex}
#panel{width:min(780px,94vw);max-height:92vh;overflow:auto;background:#18203f;color:#fff6e0;font:13px monospace;border:4px solid #e8d6b0;
 box-shadow:0 0 0 4px #0b0b14,0 0 0 8px #6b5a3a,0 8px 0 8px #000a;padding:12px 14px;box-sizing:border-box}
#panel h2{margin:0 0 6px;font:bold 20px monospace;color:#ffe08a;text-shadow:2px 2px 0 #000;display:flex;justify-content:space-between;align-items:center}
#close{font:bold 14px monospace;background:#7a1610;color:#fff;border:3px solid #e8d6b0;padding:2px 10px;cursor:pointer}
#wslots{display:flex;gap:10px;margin:6px 0 10px}
.ws{flex:1;display:flex;align-items:center;gap:8px;padding:6px;background:#0c1430;border:3px solid #4a5f9a;cursor:pointer;min-height:52px}
.ws.sel{border-color:#ffe08a;background:#2a3460}
.ws .n{font:bold 18px monospace;color:#9ec3ff;width:16px}
.ws .ic,.wi .ic{width:48px;height:48px;flex:none;image-rendering:pixelated;background:url(assets/ui_icons.png) 0 0/480px 48px no-repeat;background-color:#070b1c;outline:2px solid #000}
#wlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wi{display:flex;gap:8px;padding:6px;background:#222c55;border:3px solid #34427a;cursor:pointer;position:relative}
.wi.sel{border-color:#ffe08a;background:#34407a}.wi .t{font:bold 14px monospace;color:#fff}.wi .d{color:#c9d3f0;font-size:11px;margin-top:2px}
.wi .m{font-size:11px;color:#8fd6ff;margin-top:2px}.wi .eq{position:absolute;right:4px;top:3px;background:#ffe08a;color:#000;font:bold 10px monospace;padding:0 4px}
.pip{display:inline-block;width:7px;height:9px;background:#1ea6f2;border:1px solid #0a0e1e;margin-right:1px;vertical-align:-1px}
#wnote{margin-top:8px;color:#ffcf7a;font-size:11px}
@media (max-width:600px){#wlist{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="stick"><div id="knob"></div></div><div id="atk">공격</div>
<div class="slot" id="s0"></div><div class="slot" id="s1"></div><div class="slot" id="s2"></div>
<div id="slotsKeys">1/X · 2/C · 3/V</div>
<div id="wbtn">스킬창</div>
<div id="hint">WASD / 방향키 이동 · Z / Space 공격 (횡베기→찌르기→돌려베기) · 1·2·3 또는 X·C·V 스킬 · K / Tab 스킬창</div></div>
<div id="win"><div id="panel"><h2><span>스킬창 · Skills</span><span id="close">닫기 ✕</span></h2>
<div style="font-size:11px;color:#c9d3f0">스킬을 누르면 빈 슬롯에 장착 · 슬롯이 꽉 찼으면 스킬 선택 후 슬롯 1/2/3을 눌러 교체 · 선택 없이 슬롯을 누르면 해제</div>
<div id="wslots"></div><div id="wlist"></div>
<div id="wnote">※ 데모: 10개 스킬 모두 해금 (DEMO.unlockAll). 실제 게임에서는 각 보스를 쓰러뜨리고 흡수해야 습득. 기력(파란 게이지)은 데모용으로 천천히 자동 회복.</div></div></div>
<script>
'use strict';
const SPR=/*SPRITES*/;
const LVL=/*LEVEL*/;
const WW=1280,WH=720;
const Q=new URLSearchParams(location.search);
const DEBUG=Q.has('debug');
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const IMG={};
function load(n,src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{IMG[n]=i;res()};i.onerror=()=>rej(new Error('load '+src));i.src='assets/'+src;});}

// =====================================================================
//  SKILL DATA — edit freely. cost = blue-gauge segments (gauge has 8),
//  dmg = slime HP removed per hit (slimes have 2), cd = cooldown seconds.
//  boss = where the skill comes from in the real game (absorbed after that boss).
// =====================================================================
const DEMO={unlockAll:true,gaugeRegen:0.07}; // demo only: every skill unlocked, gauge refills ~1 segment / 1.8s
const SKILLS=[
 {id:'quake', name:'대지의 수정',en:'Earth Crystal',      cost:2,dmg:2,cd:3.0, boss:'수정 골렘',  desc:'검을 땅에 꽂아 주위에 수정 기둥을 솟구치게 한다. 주변 적을 밀쳐낸다.'},
 {id:'thread',name:'수정 실',    en:'Crystal Thread',     cost:1,dmg:1,cd:1.5, boss:'수정 거미',  desc:'수정 실을 앞으로 쏘아 그 지점까지 몸을 끌어당긴다. 지나는 적에게 피해.'},
 {id:'sand',  name:'사중 잠행',  en:'Sand Burrow',        cost:2,dmg:2,cd:3.5, boss:'모래 벌레',  desc:'모래 속으로 숨어 무적 상태로 이동, 솟구치며 충격파를 낸다.'},
 {id:'pact',  name:'망자의 계약',en:'Pact of the Dead',   cost:3,dmg:1,cd:6.0, boss:'망령 군주',  desc:'룬 서클에서 망령 아군을 불러낸다. 가장 가까운 적을 3번 공격.'},
 {id:'water', name:'해류의 숨결',en:'Ocean Breath / Dive',cost:1,dmg:2,cd:1.2, boss:'심해 서펀트',desc:'손바닥에서 물대포 발사. 분수 옆에서 쓰면 잠수해 헤엄친다(다시 쓰면 나옴).'},
 {id:'shield',name:'산호 방패',  en:'Coral Shield',       cost:1,dmg:2,cd:1.0, boss:'산호 거북',  desc:'누르고 있는 동안 정면 피해 무효. 막 들었을 때 막으면 퍼펙트 → 방패 반격.'},
 {id:'fire',  name:'업화의 검',  en:'Hellfire Sword',     cost:2,dmg:2,cd:2.0, boss:'화염 마수',  desc:'불꽃 초승달 검기를 날린다. 적을 관통.'},
 {id:'bolt',  name:'뇌광 질주',  en:'Lightning Dash',     cost:2,dmg:2,cd:2.0, boss:'뇌조',       desc:'번개처럼 돌진. 잔상을 남기고 지나간 적에게 피해, 돌진 중 무적.'},
 {id:'time',  name:'시간 정지',  en:'Time Stop',          cost:4,dmg:0,cd:10,  boss:'시계탑 수호자',desc:'황금 고리가 퍼지며 3초간 적이 멈춘다. 주인공은 자유롭게 움직인다.', dur:3},
 {id:'dragon',name:'삼룡의 각성',en:'Three-Dragon Awakening',cost:8,dmg:6,cd:20,boss:'삼룡왕',desc:'궁극기. 세 용의 기운을 두르고 거대한 삼색 참격으로 넓은 범위를 벤다.'},
];
const SK=Object.fromEntries(SKILLS.map((s,i)=>[s.id,Object.assign(s,{icon:i})]));
const unlocked=id=>DEMO.unlockAll||false; // real game: check boss-absorbed flags here

// ---------- collision ----------
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
function blockedPt(x,y){const b=LVL.bounds;if(x<b[0]||x>b[2]||y<b[1]||y>b[3])return true;
 for(const o of LVL.blocks){if(o.poly&&inPoly(x,y,o.poly))return true;if(o.ellipse){const[ex,ey,rx,ry]=o.ellipse;const dx=(x-ex)/rx,dy=(y-ey)/ry;if(dx*dx+dy*dy<1)return true;}}return false;}
function blocked(x,y,r){return blockedPt(x,y)||blockedPt(x-r,y)||blockedPt(x+r,y)||blockedPt(x,y-r*.4)||blockedPt(x,y+r*.4);}
function moveCol(e,dx,dy,r){let ok=true;if(dx){if(!blocked(e.x+dx,e.y,r))e.x+=dx;else ok=false;}
 if(dy){if(!blocked(e.x,e.y+dy,r))e.y+=dy;else ok=false;}return ok;}
// fountain water (swim area, inside the basin) and "next to the fountain" test
const POOL={x:777,y:398,rx:96,ry:40},PILLAR={x:777,y:392,rx:34,ry:15};
const ell=(x,y,e)=>((x-e.x)/e.rx)**2+((y-e.y)/e.ry)**2;
function nearFountain(x,y){return ((x-777)/140)**2+((y-415)/95)**2<1.85;}
function swimOk(x,y){return ell(x,y,POOL)<1&&ell(x,y,PILLAR)>1;}

// ---------- input ----------
const keys={};let atkPressed=false;const skPress=[];const skHeld=[false,false,false];
const SLOTKEYS={'1':0,'2':1,'3':2,'x':0,'c':1,'v':2};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k))e.preventDefault();
 if(k==='k'||k==='tab'){if(!e.repeat)toggleWin();return;}
 if(k==='escape'&&winOpen){toggleWin(false);return;}
 if(winOpen)return;
 if(!keys[k]&&(k==='z'||k===' '||k==='j'))atkPressed=true;
 if(!keys[k]&&k in SLOTKEYS){skPress.push(SLOTKEYS[k]);skHeld[SLOTKEYS[k]]=true;}
 keys[k]=true;});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k in SLOTKEYS)skHeld[SLOTKEYS[k]]=false;});
const stick={id:null,ox:0,oy:0,dx:0,dy:0};const stEl=document.getElementById('stick'),knob=document.getElementById('knob'),atkEl=document.getElementById('atk');
const slotEls=[0,1,2].map(i=>document.getElementById('s'+i));
function setTouch(){document.body.classList.add('touch');}
if(matchMedia('(pointer:coarse)').matches)setTouch();
const isBtn=t=>t===atkEl||slotEls.some(s=>s.contains(t))||t.closest&&t.closest('#wbtn,#win');
addEventListener('touchstart',e=>{setTouch();if(winOpen)return;for(const t of e.changedTouches){if(isBtn(t.target))continue;
 if(stick.id===null&&t.clientX<innerWidth*0.6){stick.id=t.identifier;stick.ox=t.clientX;stick.oy=t.clientY;stick.dx=stick.dy=0;stEl.style.display='block';stEl.style.left=t.clientX+'px';stEl.style.top=t.clientY+'px';knob.style.transform='';}}
 if(!e.target.closest||!e.target.closest('#win'))e.preventDefault();},{passive:false});
addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===stick.id){let dx=t.clientX-stick.ox,dy=t.clientY-stick.oy;const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l;}
 stick.dx=dx/m;stick.dy=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`;}if(!e.target.closest||!e.target.closest('#win'))e.preventDefault();},{passive:false});
function endT(e){for(const t of e.changedTouches)if(t.identifier===stick.id){stick.id=null;stick.dx=stick.dy=0;stEl.style.display='none';}}
addEventListener('touchend',endT);addEventListener('touchcancel',endT);
atkEl.addEventListener('touchstart',e=>{atkPressed=true;atkEl.classList.add('on');e.preventDefault();e.stopPropagation();},{passive:false});
atkEl.addEventListener('touchend',e=>{atkEl.classList.remove('on');e.preventDefault();},{passive:false});
atkEl.addEventListener('mousedown',e=>{atkPressed=true;});
slotEls.forEach((el,i)=>{
 const down=e=>{e.preventDefault();e.stopPropagation();if(winOpen)return;if(!slots[i]){toggleWin(true);return;}skPress.push(i);skHeld[i]=true;el.classList.add('on');};
 const up=e=>{e.preventDefault();skHeld[i]=false;el.classList.remove('on');};
 el.addEventListener('touchstart',down,{passive:false});el.addEventListener('touchend',up,{passive:false});el.addEventListener('touchcancel',up,{passive:false});
 el.addEventListener('mousedown',down);el.addEventListener('mouseup',up);el.addEventListener('mouseleave',up);});
document.getElementById('wbtn').addEventListener('click',()=>toggleWin());
document.getElementById('wbtn').addEventListener('touchend',e=>{e.preventDefault();toggleWin();},{passive:false});

// ---------- skill window / quick slots (saved in localStorage) ----------
const LS='townDemo.skillSlots';
let slots=['fire','quake','time'];
try{const v=JSON.parse(localStorage.getItem(LS));if(Array.isArray(v)&&v.length===3)slots=v.map(x=>SK[x]?x:null);}catch(e){}
function saveSlots(){try{localStorage.setItem(LS,JSON.stringify(slots));}catch(e){}}
let winOpen=false,winSel=null;const winEl=document.getElementById('win');
function icStyle(i){return `background-position:${-i*48}px 0`;}
function toggleWin(v){winOpen=v===undefined?!winOpen:v;winSel=null;winEl.classList.toggle('open',winOpen);
 for(let i=0;i<3;i++){skHeld[i]=false;slotEls[i].classList.remove('on');}for(const k in keys)keys[k]=false;atkPressed=false;skPress.length=0;
 stick.id=null;stick.dx=stick.dy=0;stEl.style.display='none';if(winOpen)renderWin();}
function renderWin(){
 const ws=document.getElementById('wslots');ws.innerHTML='';
 slots.forEach((id,i)=>{const d=document.createElement('div');d.className='ws'+(winSel!==null?' sel':'');
  d.innerHTML=`<span class="n">${i+1}</span>`+(id?`<div class="ic" style="${icStyle(SK[id].icon)}"></div><span>${SK[id].name}</span>`:`<span style="color:#7f8bb5">— 비어 있음 —</span>`);
  d.onclick=()=>slotClick(i);ws.appendChild(d);});
 const wl=document.getElementById('wlist');wl.innerHTML='';
 for(const s of SKILLS){if(!unlocked(s.id))continue;const d=document.createElement('div');const eq=slots.indexOf(s.id);
  d.className='wi'+(winSel===s.id?' sel':'');d.dataset.id=s.id;
  d.innerHTML=`<div class="ic" style="${icStyle(s.icon)}"></div><div><div class="t">${s.name} <span style="font-weight:normal;color:#9ab">${s.en}</span></div>
  <div class="m">기력 ${'<span class="pip"></span>'.repeat(s.cost)} · 피해 ${s.dmg} · 쿨 ${s.cd}s</div><div class="d">${s.desc}</div></div>`+(eq>=0?`<span class="eq">슬롯${eq+1}</span>`:'');
  d.onclick=()=>skillClick(s.id);wl.appendChild(d);}}
function skillClick(id){const empty=slots.indexOf(null);
 if(slots.indexOf(id)<0&&empty>=0&&winSel===null){slots[empty]=id;saveSlots();}
 else winSel=winSel===id?null:id;
 renderWin();updateSlotEls(true);}
function slotClick(i){
 if(winSel){const j=slots.indexOf(winSel);if(j>=0)slots[j]=slots[i];slots[i]=winSel;winSel=null;}  // equip / swap
 else slots[i]=null;                                                                              // unequip
 saveSlots();renderWin();updateSlotEls(true);}
let slotSig='';
function updateSlotEls(force){
 const sig=slots.join();if(force||sig!==slotSig){slotSig=sig;slots.forEach((id,i)=>{slotEls[i].innerHTML=id?`<div class="ic" style="${icStyle(SK[id].icon)}"></div><div class="cd"></div><span class="k">${i+1}</span>`:`<div class="plus">+</div><span class="k">${i+1}</span>`;slotEls[i].title=id?SK[id].name:'빈 슬롯';});}
 slots.forEach((id,i)=>{if(!id)return;const s=SK[id],c=cool[id]||0,el=slotEls[i];const cd=el.querySelector('.cd');
  cd.style.background=c>0?`conic-gradient(rgba(0,0,0,0) ${360*(1-c/s.cd)}deg,rgba(5,10,30,.72) 0)`:'none';
  el.classList.toggle('low',gauge+1e-6<s.cost/8);});}

// ---------- entities ----------
const DIRV={down:[0,1],up:[0,-1],right:[1,0],left:[-1,0]};
const hero={x:456,y:438,face:'right',hz:'right',walkT:0,moving:false,hp:5,maxHp:5,inv:0,kx:0,ky:0,
 atk:null,combo:0,chainT:0,buffered:false,cool:0,sk:null,swim:null,ghost:false,hidden:false};
const spirit={x:585,y:400,t:0};
let gauge=7/8;const cool={};let timeStop=0,flash=0,toast=null;
// 3-hit combo: 횡베기 (horizontal slash) -> 찌르기 (thrust) -> 돌려베기 (spin). Times in seconds.
const SWINGS=[
 {name:'횡베기',kind:'slash', dur:.28,a0:.05,a1:.15,reach:58,rad:64,kb:300,lunge:10},
 {name:'찌르기',kind:'thrust',dur:.30,a0:.07,a1:.17,len:165,half:18,kb:380,lunge:34},
 {name:'돌려베기',kind:'spin',dur:.50,a0:.07,a1:.33,rad:122,kb:700,lunge:0,fin:true},
];
const CHAIN_WINDOW=.24;
function startSwing(i){const s=SWINGS[i];hero.atk={i,t:0,hit:new Set(),s};hero.combo=i;hero.buffered=false;
 if(i===2)shake=6;}
const slimes=[];const parts=[];const fx=[];let shake=0;
function mkSlime(x,y,sc){return{x,y,sc,hp:2,state:'idle',t:Math.random()*1.5,hopT:0,hz:0,vx:0,vy:0,kx:0,ky:0,flash:0,dead:0,respawn:0,face:1,squash:0};}
slimes.push(mkSlime(548,544,1),mkSlime(857,612,.62),mkSlime(330,300,.8));
Object.assign(slimes[2],{dead:true,respawn:5});
function randSpot(){for(let k=0;k<200;k++){const x=260+Math.random()*700,y=230+Math.random()*460;if(!blocked(x,y,20)&&Math.hypot(x-hero.x,y-hero.y)>260)return[x,y];}return[600,600];}
const live=()=>slimes.filter(m=>!m.dead);
function nearest(x,y,max=1e9){let b=null,bd=max;for(const m of live()){const d=Math.hypot(m.x-x,(m.y-y)*1.2);if(d<bd){bd=d;b=m;}}return b;}
function faceDV(){return DIRV[hero.face];}
function heroFlip(dv){return dv[0]<0||(dv[0]===0&&hero.hz==='left');}

// ---------- damage ----------
function damageSlime(m,dx,dy,dmg,kb,o={}){if(m.dead)return;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
 m.hp-=dmg;m.flash=.16;const k=kb/(0.6+m.sc*.4);m.kx=dx*k;m.ky=dy*k*.8;m.state='idle';m.t=.5;m.hz=0;
 hitStop=Math.max(hitStop,o.stop??.04);if(o.shake)shake=Math.max(shake,o.shake);if(!o.skill)gauge=Math.min(1,gauge+0.02);

 // Ocean Breath next to the fountain -> dive (free)
 if(id==='water'&&nearFountain(hero.x,hero.y)&&!opt.noDive){let tx=hero.x,ty=hero.y;const a=Math.atan2((hero.y-POOL.y)/POOL.ry,(hero.x-POOL.x)/POOL.rx);
  for(let r=.85;r>.3;r-=.05){tx=POOL.x+Math.cos(a)*POOL.rx*r;ty=POOL.y+Math.sin(a)*POOL.ry*r;if(swimOk(tx,ty))break;}
  hero.sk={id:'dive',t:0,dir:faceDV(),flip:tx<hero.x,from:[hero.x,hero.y],to:[tx,ty],z:0};hero.hz=tx<hero.x?'left':'right';showToast(S,'잠수');return true;}
 if(gauge+1e-6<S.cost/8){showToast(S,'기력 부족',1);return false;}
 gauge-=S.cost/8;cool[id]=S.cd;const dv=faceDV();
 hero.sk={id,t:0,dir:dv,flip:heroFlip(dv),slot:opt.slot??-1,holdFor:opt.hold,ph:'hold'};showToast(S);return true;}

function update(dt){

 for(const k in cool)if(cool[k]>0)cool[k]=Math.max(0,cool[k]-dt);

 while(skPress.length){const i=skPress.shift();if(slots[i])useSkill(slots[i],{slot:i});}
 if(atkPressed){atkPressed=false;
  if(hero.swim||hero.sk){}
  else if(hero.atk){if(hero.atk.t>.03&&hero.atk.i<2)hero.buffered=true;}
  else if(hero.cool<=0){startSwing(hero.chainT>0&&hero.combo<2?hero.combo+1:0);}
 }

 if(a){a.t+=dt;const s=a.s,dv=DIRV[hero.face];
  if(a.t<s.a1&&s.lunge){const f=s.lunge/s.a1;moveCol(hero,dv[0]*f*dt,dv[1]*f*dt*.8,12);} // forward step
  if(a.t>=s.a0&&a.t<=s.a1){
   for(const m of slimes){if(m.dead||a.hit.has(m))continue;let hit=false,kx=dv[0],ky=dv[1];
    if(s.kind==='slash'){const hx=hero.x+dv[0]*s.reach,hy=hero.y+dv[1]*s.reach*.75-(dv[1]?0:6);hit=inEll(m,hx,hy,dv[0]?s.rad:s.rad*1.25,dv[0]?s.rad*.85:s.rad*.7);}
    else if(s.kind==='thrust')hit=inBeam(m,hero.x,hero.y-(dv[1]?0:4),dv,s.len,s.half);

    if(hit){a.hit.add(m);damageSlime(m,kx,ky,1,s.kb,s.fin?{stop:.09,shake:9,fin:1}:{});}}}

   if(hero.buffered&&a.i<2){startSwing(a.i+1);}else{hero.chainT=a.i<2?CHAIN_WINDOW:0;if(a.i===2){hero.cool=.18;hero.combo=0;}}}

 }else{
  if(hero.chainT>0){hero.chainT-=dt;if(hero.chainT<=0)hero.combo=0;}
  if(l>0){const sp=230*l;moveCol(hero,ix*sp*dt,iy*sp*dt,12);hero.moving=true;hero.walkT+=dt*l;

  else{hero.moving=false;hero.walkT=0;}
 }
 // hero knockback / invuln
 if(hero.kx||hero.ky){if(!hero.swim)moveCol(hero,hero.kx*dt,hero.ky*dt,12);hero.kx*=Math.pow(.002,dt);hero.ky*=Math.pow(.002,dt);if(Math.hypot(hero.kx,hero.ky)<5)hero.kx=hero.ky=0;}
 if(hero.inv>0)hero.inv-=dt;
 // spirit

  m.t-=dt;
  if(m.kx||m.ky){moveCol(m,m.kx*dt,m.ky*dt,14*m.sc);m.kx*=Math.pow(.004,dt);m.ky*=Math.pow(.004,dt);if(Math.hypot(m.kx,m.ky)<6)m.kx=m.ky=0;}

  else if(m.state==='hop'){m.hopT+=dt;const D=.42;m.hz=Math.sin(Math.min(1,m.hopT/D)*Math.PI)*26*m.sc;moveCol(m,m.vx*dt,m.vy*dt,14*m.sc);

  if(hero.inv<=0&&!hero.ghost&&!hero.swim&&!m.spawnT>0&&m.hz<10){const dx=hero.x-m.x,dy=hero.y-m.y;const r=34*m.sc+12;if(dx*dx+(dy*1.6)**2<r*r){
   if(hero.sk&&hero.sk.id==='shield'&&SKFX.shield.block(hero.sk,m)){}else hurtHero(dx,dy);}}
 }

function updateFx(dt){

  else if(f.type==='ghost'){f.cd-=dt;const fade=f.hits>=3||f.t>f.life;if(fade){f.fo=(f.fo||0)+dt;if(f.fo>.5){fx.splice(i,1);continue;}}
   const m=f.t>.5&&!fade?nearest(f.x,f.y,600):null;f.z+=(70-f.z)*Math.min(1,dt*3);

function resize(){dpr=Math.min(window.devicePixelRatio||1,3);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);}

function computeView(){const W=cv.width,H=cv.height;
 if(W>=H){scale=Math.min(W/WW,H/WH);}else{scale=H/WH;}

 camX=viewW>=WW?(WW-viewW)/2:Math.max(0,Math.min(WW-viewW,hero.x-viewW/2));

// which sprite frame the hero shows right now -> [key, frame, flip, yOffset]
function heroPose(){const h=hero,a=h.atk,sk=h.sk;
 if(sk){const F=SKFX[sk.id];const fi=F.pose(sk);if(fi<0)return null;return[F.key||('sk_'+sk.id),fi,sk.flip,-(sk.z||0)];}
 if(h.swim)return['sk_water',3,h.hz==='left',58+Math.sin(h.walkT*6)*2];
 if(a){const s=a.s,side=h.face==='left'||h.face==='right',fl=side?h.face==='left':h.hz==='left';
  if(s.kind==='spin'){// right -> front -> left -> back -> right (backhand): reads as one full turn
   const seq=[[0,0],[1,0],[2,1],[3,0],[4,0]];const k=Math.min(4,Math.floor(a.t/((s.a1-.02)/5)));const[f,inv]=seq[k];return['cb_spin',f,inv?!fl:fl,0];}

  const key=h.face==='up'?'hero_atk_up':'hero_atk_r1';return[key,s.kind==='slash'?(a.t<.06?0:1):2,h.face==='up'?false:fl,0];}

 if(h.face==='down')return['hero_walk_down',fi,false,0];if(h.face==='up')return['hero_walk_up',fi,false,0];return['hero_walk_right',fi,h.face==='left',0];}
function drawHero(){const h=hero;if(h.inv>0&&Math.floor(h.inv*20)%2)return;

  ctx.strokeStyle='rgba(220,250,255,.75)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(h.x,h.y+6,62+Math.sin(h.walkT*5)*4,11,0,0,Math.PI*2);ctx.stroke();return;}

function drawMound(){const h=hero,t=performance.now()/1000;ctx.fillStyle='#b8914a';ctx.beginPath();ctx.ellipse(h.x,h.y-4,34,13,0,0,Math.PI*2);ctx.fill();

 for(const [w,c,rr] of [[16,`rgba(120,220,255,${.35*fade})`,R],[9,`rgba(255,255,255,${.9*fade})`,R-2],[4,`rgba(190,240,255,${fade})`,R-12]]){

function drawSpinRing(a,part){const s=a.s;const p=(a.t-s.a0+.03)/(s.a1-s.a0+.03);if(p<0||p>1.35)return;const fade=p>1?Math.max(0,1-(p-1)/.35):1;

function drawFx(f){
 if(f.type==='crystal'){if(f.t<0)return;const g=Math.min(1,f.t/.09),out=f.t>f.life-.3?(f.life-f.t)/.3:1;

 drawHUD();}
function drawDebug(){ctx.save();ctx.lineWidth=2;ctx.strokeStyle='#f00';ctx.fillStyle='rgba(255,0,0,.2)';
 for(const o of LVL.blocks){ctx.beginPath();if(o.poly){o.poly.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();}else{const[x,y,rx,ry]=o.ellipse;ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);}ctx.fill();ctx.stroke();}
 ctx.strokeStyle='#0cf';ctx.beginPath();ctx.ellipse(POOL.x,POOL.y,POOL.rx,POOL.ry,0,0,7);ctx.stroke();
 const E=(x,y,rx,ry)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.stroke();};
 const a=hero.atk;if(a&&a.t>=a.s.a0&&a.t<=a.s.a1){const s=a.s,dv=DIRV[hero.face];ctx.strokeStyle='#ff0';
  if(s.kind==='slash')E(hero.x+dv[0]*s.reach,hero.y+dv[1]*s.reach*.75-(dv[1]?0:6),dv[0]?s.rad:s.rad*1.25,dv[0]?s.rad*.85:s.rad*.7);
  else if(s.kind==='thrust'){ctx.save();ctx.translate(hero.x,hero.y-(dv[1]?0:4));ctx.scale(1,dv[1]?.75:1);ctx.rotate(Math.atan2(dv[1],dv[0]));ctx.strokeRect(0,-s.half,s.len,s.half*2);ctx.restore();}
  else E(hero.x,hero.y-8,s.rad,s.rad*.7);}
 ctx.strokeStyle='#f0f';for(const f of fx){if(f.type==='crystal'&&f.t>=0&&f.t<.15)E(f.x,f.y,64,46);if(f.type==='proj')E(f.x,f.y,f.r,f.r/1.2);if(f.type==='ghost')E(f.x,f.y,34,28);}
 const sk=hero.sk;if(sk){if(sk.id==='sand'&&sk.t>.9&&sk.t<1.05)E(hero.x,hero.y,150,100);if(sk.area)E(sk.area[0],sk.area[1],sk.dir[0]?250:200,sk.dir[0]?160:190);
  if(sk.id==='bolt'||sk.id==='thread')E(hero.x,hero.y,60,46);if(sk.id==='shield'){const dv=sk.dir;E(hero.x+dv[0]*62,hero.y+dv[1]*46,66,54);}}
 ctx.fillStyle='#0f0';ctx.fillRect(hero.x-2,hero.y-2,4,4);ctx.restore();}

// ---------- loop ----------
let last=0,manual=false;
function step(dt){if(winOpen)return;if(hitStop>0)hitStop-=dt;else update(dt);}
function frame(t){const dt=Math.min(1/30,(t-last)/1000||0);last=t;
 if(!manual)step(dt);updateSlotEls();render();requestAnimationFrame(frame);}
const jobs=[load('bg','bg_town.jpg')];for(const k in SPR)jobs.push(load(k,SPR[k].src));for(const o of LVL.overlayImgs)jobs.push(load('ov_'+o.name,o.src));
Promise.all(jobs).then(()=>{
 const pose=Q.get('pose');if(pose&&pose.startsWith('attack')){const i=(+pose.slice(6)||1)-1;slimes.forEach(m=>m.t=99);startSwing(i);hero.atk.t=(SWINGS[i].a0+SWINGS[i].a1)/2;hero.atk.hit=new Set(slimes);if(Q.get('face'))hero.face=Q.get('face');hitStop=1e9;shake=0;document.getElementById('hint').style.display='none';}
 updateSlotEls(true);
 window.__game={hero,slimes,spirit,SWINGS,SKILLS,SK,fx,parts,cool,slots,press:()=>{atkPressed=true;},keys,blocked,useSkill,toggleWin,skHeld,
  get gauge(){return gauge},set gauge(v){gauge=v},get timeStop(){return timeStop},get winOpen(){return winOpen},
  setManual(v){manual=v},advance(sec,dt=1/60){for(let t=0;t<sec-1e-9;t+=dt)step(dt);},render,ready:true};
 setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity=0},5000);
 requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
}).catch(e=>{console.error(e);document.body.insertAdjacentHTML('beforeend','<p style="color:#fff">'+e.message+'</p>');});
</script>
</body>
