<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>필멸자 (가제)</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;inset:0;pointer-events:none}
#atk{position:fixed;right:max(28px,env(safe-area-inset-right));bottom:max(34px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;
 background:radial-gradient(circle at 40% 35%,#ff8a6a,#c23224 60%,#7a1610);border:4px solid #2a0d08;box-shadow:0 0 0 3px #e8d6b0 inset,0 4px 0 #000a;
 color:#fff6e0;font:bold 22px/96px sans-serif;text-align:center;text-shadow:2px 2px 0 #4a0f08;pointer-events:auto;display:none}
#atk.on{transform:scale(.92);filter:brightness(1.2)}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#0004;border:3px solid #fff6;display:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffc;border:3px solid #333a}
#hint{transition:opacity 1s;position:fixed;left:50%;bottom:36px;transform:translateX(-50%);color:#fff9;font:12px sans-serif;text-shadow:1px 1px 0 #000}
body.touch #atk{display:block} body.touch #hint{display:none}
/* skill quick slots (3) */
.slot{position:fixed;width:64px;height:64px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle at 40% 35%,#5a8ef0,#24479c 62%,#132a63);
 border:4px solid #0b1430;box-shadow:0 0 0 3px #e8d6b0 inset,0 4px 0 #000a;overflow:hidden}
.slot .ic{position:absolute;left:8px;top:8px;width:48px;height:48px;image-rendering:pixelated;background:url(assets/ui_icons.png) 0 0/480px 48px no-repeat}
.slot .cd{position:absolute;inset:0;border-radius:50%}
.slot .k{position:absolute;right:9px;bottom:5px;font:bold 12px monospace;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.slot .plus{position:absolute;inset:0;font:bold 30px/56px monospace;color:#e8d6b0;text-align:center}
.slot.low{filter:saturate(.35) brightness(.75)} .slot.on{transform:scale(.92);filter:brightness(1.25)}
#s0{right:236px;bottom:24px}#s1{right:162px;bottom:24px}#s2{right:88px;bottom:24px}
body.touch #s0{right:138px;bottom:26px} body.touch #s1{right:132px;bottom:112px} body.touch #s2{right:52px;bottom:148px}
#wbtn{position:fixed;right:20px;top:16px;pointer-events:auto;padding:6px 12px;background:#1b2550;color:#fff6e0;font:bold 15px monospace;
 border:3px solid #e8d6b0;box-shadow:0 0 0 3px #0b0b14,0 3px 0 3px #000a;cursor:pointer}
#slotsKeys{position:fixed;right:24px;bottom:94px;color:#fff9;font:11px monospace;text-shadow:1px 1px 0 #000}
body.touch #slotsKeys{display:none}
#atk.desk{display:none}
/* skill window */
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;pointer-events:auto}
#win.open{display:flex}
#panel{width:min(780px,94vw);max-height:92vh;overflow:auto;background:#18203f;color:#fff6e0;font:13px monospace;border:4px solid #e8d6b0;
 box-shadow:0 0 0 4px #0b0b14,0 0 0 8px #6b5a3a,0 8px 0 8px #000a;padding:12px 14px;box-sizing:border-box}
#panel h2{margin:0 0 6px;font:bold 20px monospace;color:#ffe08a;text-shadow:2px 2px 0 #000;display:flex;justify-content:space-between;align-items:center}
#close{font:bold 14px monospace;background:#7a1610;color:#fff;border:3px solid #e8d6b0;padding:2px 10px;cursor:pointer}
#wslots{display:flex;gap:10px;margin:6px 0 10px}
.ws{flex:1;display:flex;align-items:center;gap:8px;padding:6px;background:#0c1430;border:3px solid #4a5f9a;cursor:pointer;min-height:52px}
.ws.sel{border-color:#ffe08a;background:#2a3460}
.ws .n{font:bold 18px monospace;color:#9ec3ff;width:16px}
.ws .ic,.wi .ic{width:48px;height:48px;flex:none;image-rendering:pixelated;background:url(assets/ui_icons.png) 0 0/480px 48px no-repeat;background-color:#070b1c;outline:2px solid #000}
#wlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wi{display:flex;gap:8px;padding:6px;background:#222c55;border:3px solid #34427a;cursor:pointer;position:relative}
.wi.sel{border-color:#ffe08a;background:#34407a}.wi .t{font:bold 14px monospace;color:#fff}.wi .d{color:#c9d3f0;font-size:11px;margin-top:2px}
.wi .m{font-size:11px;color:#8fd6ff;margin-top:2px}.wi .eq{position:absolute;right:4px;top:3px;background:#ffe08a;color:#000;font:bold 10px monospace;padding:0 4px}
.pip{display:inline-block;width:7px;height:9px;background:#1ea6f2;border:1px solid #0a0e1e;margin-right:1px;vertical-align:-1px}
#wnote{margin-top:8px;color:#ffcf7a;font-size:11px}
@media (max-width:600px){#wlist{grid-template-columns:1fr}}
/* controls: HUD key bar, overlays (menu / options / inventory / map), dialog */
kbd{display:inline-block;min-width:14px;padding:0 4px;margin-right:3px;border:2px solid #e8d6b0;border-bottom-width:3px;border-radius:3px;background:#0b0b14;color:#ffe08a;font:bold 11px monospace;text-align:center}
#khud{position:fixed;left:12px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100vw - 340px);color:#fff;font:12px sans-serif;text-shadow:1px 1px 0 #000}
#khud span{background:#0008;padding:2px 6px 2px 3px;border-radius:3px}#khud span.hot{background:#3a5f1acc;outline:1px solid #b6f07a}
body.touch #khud{display:none}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;pointer-events:auto}#ov.open{display:flex}
#ovp{width:min(760px,94vw);max-height:92vh;overflow:auto;background:#18203f;color:#fff6e0;font:13px monospace;border:4px solid #e8d6b0;box-shadow:0 0 0 4px #0b0b14,0 0 0 8px #6b5a3a;padding:12px 16px;box-sizing:border-box}
#ovp h2{margin:0 0 8px;font:bold 20px monospace;color:#ffe08a;text-shadow:2px 2px 0 #000}
#ovp .sub{font-size:11px;color:#c9d3f0;margin:4px 0}#ovp .hb{margin-top:10px;padding-top:8px;border-top:2px solid #34427a;font-size:12px;color:#e8e0c8}
.menu .mi{padding:8px 12px;margin:4px 0;background:#222c55;border:3px solid #34427a;cursor:pointer;font:bold 15px monospace;display:flex;justify-content:space-between}
.menu .mi.sel{border-color:#ffe08a;background:#34407a}.menu .mi.sel:before{content:'▶ ';color:#ffe08a}.mk{color:#ffe08a;font:bold 11px monospace;border:1px solid #ffe08a88;padding:0 4px;margin-left:6px}
table.km{border-collapse:collapse;width:100%}table.km th{text-align:left;color:#9ec3ff;padding:3px 0 1px;font-size:12px;border-bottom:1px solid #34427a}
table.km td{padding:1px 4px}table.km td.an{width:42%}table.km td.warn{color:#ff9a8a}table.km tr.cur td.an{color:#ffe08a}
.kc{display:inline-block;min-width:70px;padding:1px 6px;text-align:center;background:#0c1430;border:2px solid #4a5f9a;cursor:pointer;font:bold 12px monospace}
.kc.sel{border-color:#ffe08a;background:#2a3460}.kc.rb{border-color:#7aff9a;background:#1a4a2a;animation:blink .6s infinite alternate}.kc.lk{color:#aab}
@keyframes blink{to{background:#0c1430}}
#ovp .note{margin:8px 0;padding:6px;background:#0c1430;border:2px solid #4a5f9a;color:#b6f07a;font-size:12px}#ovp .note.bad{color:#ff9a8a;border-color:#a04030}
.btn{display:inline-block;padding:4px 10px;margin:4px 6px 0 0;background:#7a1610;color:#fff;border:3px solid #e8d6b0;cursor:pointer;font:bold 13px monospace}.btn.sm{padding:1px 6px;font-size:11px;background:#222c55}.btn.on{background:#3a6a1a}
.inv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.inv>div{background:#0c1430;border:2px solid #34427a;padding:8px;line-height:1.7}.inv .big{font:bold 16px monospace;color:#ffe08a}
img.wmap{width:100%;display:block;border:3px solid #0b0b14;image-rendering:auto}
#dlg{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);width:min(720px,92vw);display:none;background:#18203fee;color:#fff;border:4px solid #e8d6b0;box-shadow:0 0 0 4px #0b0b14;padding:10px 14px;box-sizing:border-box;pointer-events:auto;font:15px sans-serif}
#dlg.hasp{padding-left:122px;min-height:124px}#dlg .dp{position:absolute;left:8px;top:8px;width:104px;height:104px;image-rendering:pixelated;border:2px solid #e8d6b0;background:#0b0b14}#dlg.open{display:block}#dlg .dn{color:#ffe08a;font:bold 14px monospace;margin-bottom:4px}#dlg .dn .dst{display:block;margin-top:1px;color:#d8c9a0;opacity:.7;font:normal 11px sans-serif;letter-spacing:.02em}#dlg .dt{line-height:1.5;min-height:44px}#dlg .dh{text-align:right;font-size:11px;color:#c9d3f0;margin-top:4px}
@media (max-width:600px){.inv{grid-template-columns:1fr}}
/* item icons (assets/icons/icons32.png / icons64.png, map in icons.json) */
.ic32{display:inline-block;width:32px;height:32px;background:url(assets/icons/icons32.png) no-repeat;image-rendering:pixelated;vertical-align:middle;flex:none}
.ic64{display:inline-block;width:64px;height:64px;background:url(assets/icons/icons64.png) no-repeat;flex:none}
.ic32.mini{width:32px;height:32px;transform:scale(.5);margin:-8px;}
#ovp.wide{width:min(980px,96vw)}
.tabs{display:flex;gap:6px;align-items:center;margin-bottom:8px}.tab{padding:2px 10px 2px 2px;background:#222c55;border:3px solid #34427a;cursor:pointer;font:bold 13px monospace;display:flex;align-items:center;gap:2px}
.tab.on{border-color:#ffe08a;background:#34407a;color:#ffe08a}.gold{margin-left:auto;font:bold 15px monospace;color:#ffe08a;display:flex;align-items:center}
.invmain{display:flex;gap:12px;align-items:flex-start}.cap{font:bold 11px monospace;color:#9ec3ff;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(8,44px);gap:3px}
.cell{position:relative;width:38px;height:38px;background:#0a1028;border:3px solid var(--rc,#2a355e);box-shadow:inset 0 0 0 1px #000,inset 0 0 8px color-mix(in srgb,var(--rc,#000) 35%,transparent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell.empty{border-color:#232c50;background:#0b1126}.cell.sel{outline:3px solid #ffe08a;outline-offset:1px;z-index:1}
.cell .cnt{position:absolute;right:1px;bottom:-2px;font:bold 11px monospace;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.cell .pl{position:absolute;left:1px;top:-3px;font:bold 11px monospace;color:#ffe08a;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.cell .qk{position:absolute;right:1px;top:-3px;font:bold 9px monospace;color:#8fd6ff;text-shadow:1px 1px 0 #000}
.eqcol{display:flex;flex-direction:column;gap:4px}.eqrow{display:flex;align-items:center;gap:6px}.eql{width:44px;font:bold 11px monospace;color:#c9d3f0;text-align:right}.qrow{margin-top:8px}
.tipcol{flex:1;min-width:240px}.tip{background:#0c1430;border:3px solid var(--rc,#4a5f9a);padding:8px;min-height:150px;line-height:1.5}.tip.none{color:#7f8bb5}
.th{display:flex;gap:8px;align-items:center;margin-bottom:6px}.th .big{background-color:#070b1c;outline:2px solid #000;box-shadow:0 0 0 3px var(--rc)}
.tn{font:bold 16px sans-serif}.tplus{color:#ffe08a}.tk{font-size:11px;color:#c9d3f0}.st{font-size:13px}.st b{color:#fff}.dim{color:#8f9ac0;font-size:11px}.fx{color:#8fd6ff;font-size:12px}.src{color:#c9b98a;font-size:11px;margin-top:4px}.pr{display:flex;align-items:center;color:#ffe08a;font-size:12px;margin-top:4px}
.list{flex:1.4;max-height:430px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.row{display:flex;align-items:center;gap:8px;padding:3px 6px;background:#222c55;border:3px solid #34427a;cursor:pointer;font-size:12px}.row.sel{border-color:#ffe08a;background:#34407a}.row.dimrow{opacity:.7}
.row .rn{font:bold 13px sans-serif;min-width:120px}.row .rs{color:#c9d3f0;flex:1;font-size:11px}.row .rp{display:flex;align-items:center;color:#ffe08a;font-weight:bold;margin-left:auto}.row .rp.bad,.mat.bad b{color:#ff8a7a}.row .rh{color:#8f9ac0;font-size:11px;min-width:50px;text-align:right}
.mat .ic32.mini{transform:scale(.75);margin:-4px}
.mats{display:flex;flex-wrap:wrap;gap:2px 8px;flex:1}.mat{display:inline-flex;align-items:center}.mat b{font-size:11px;color:#b6f07a}
#qslot{position:fixed;left:14px;bottom:40px;width:46px;height:46px;background:#0a1028cc;border:3px solid var(--rc,#9aa0a8);box-shadow:0 0 0 2px #000;display:flex;align-items:center;justify-content:center}
#qslot .cnt{position:absolute;right:2px;bottom:0;font:bold 12px monospace;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}#qslot .qkey{position:absolute;left:-2px;top:-10px;font:bold 10px monospace;background:#0b0b14;color:#ffe08a;border:2px solid #e8d6b0;padding:0 3px}
#qslot.zero{filter:grayscale(1) brightness(.6)}body.touch #qslot{display:none}
/* ===== translucent windows (반투명창): one knob = --ui-alpha (panel opacity; 0.65 default, Esc menu → 창 투명도) ===== */
:root{--ui-alpha:.65;--ui-bg:rgba(12,18,44,var(--ui-alpha));--ui-sub:rgba(8,12,32,calc(var(--ui-alpha)*.7));--ui-row:rgba(34,44,90,calc(var(--ui-alpha)*.75));--ui-gold:#e2c27a}
#ov,#win{background:rgba(0,0,0,calc(var(--ui-alpha)*.18))}
#ovp,#panel,#dlg{background:var(--ui-bg);border:3px double var(--ui-gold);box-shadow:0 0 0 1px #000c,inset 0 0 0 1px rgba(255,232,170,.28),inset 0 0 24px rgba(0,0,0,.35),0 6px 18px #0008;text-shadow:0 1px 2px #000,0 0 1px #000}
#ovp:before,#panel:before,#dlg:before{content:'';position:absolute;inset:4px;border:1px solid rgba(226,194,122,.35);pointer-events:none}
#ovp,#panel{position:relative}
#dlg .dp{opacity:1;background:#0b0b14;border-color:var(--ui-gold)} /* speaker portrait stays fully opaque */
.ws,.kc,#ovp .note,.inv>div,.tip,.cell,.cell.empty{background:var(--ui-sub)}
.wi,.menu .mi,.tab,.row{background:var(--ui-row)}
.wi.sel,.ws.sel,.menu .mi.sel,.tab.on,.row.sel,.kc.sel{background:rgba(60,72,130,calc(var(--ui-alpha)*.95))}
#qslot{background:var(--ui-sub)}
.menu .mi .ml{flex:1}
/* ===== rarity stars (RARITY_STARS) + shop sell tab + drop notifications ===== */
.stars{position:absolute;left:1px;bottom:1px;pointer-events:none;image-rendering:pixelated;background-repeat:no-repeat;background-size:100% 100%;z-index:1}
.bigw{position:relative;display:inline-block;flex:none;line-height:0}.bigw .stars{left:3px;bottom:3px}
.tk .rst{color:var(--rc);letter-spacing:-1px}
.cell .eqlock{position:absolute;right:1px;top:-3px;font:bold 9px monospace;color:#ffb0a0;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;z-index:1}
.tab.lock{opacity:.45}
.shopmode{display:flex;gap:6px;align-items:center;margin:0 0 6px}.shopmode .sm{padding:2px 12px;border:2px solid #34427a;background:var(--ui-row);cursor:pointer;font:bold 13px monospace}
.shopmode .sm.on{border-color:#ffe08a;color:#ffe08a}.shopmode .shopn{margin-left:auto;color:#9ec3ff;font:bold 12px monospace}
.sellp{margin-top:6px;font:bold 13px monospace;color:#ffe08a}.sellp.no{color:#ff9a8a}
#dropn{position:fixed;right:16px;top:64px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:30;pointer-events:none}
#dropn .dn1{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;background:var(--ui-bg);border:2px solid var(--rc);box-shadow:0 0 0 1px #000c;font:bold 13px sans-serif;color:#fff;text-shadow:0 1px 2px #000;animation:dnin .25s ease-out}
#dropn .dn1 .cell{cursor:default}#dropn .dn1 b{color:var(--rc)}@keyframes dnin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="stick"><div id="knob"></div></div><div id="atk">공격</div>
<div class="slot" id="s0"></div><div class="slot" id="s1"></div><div class="slot" id="s2"></div>
<div id="slotsKeys">1 · 2 · 3</div>
<div id="wbtn">스킬창 (O)</div>
<div id="hint">조작 안내</div><div id="khud"></div><div id="qslot" title="퀵슬롯"></div></div>
<div id="ov"><div id="ovp"></div></div><div id="dlg"></div><div id="dropn"></div>
<div id="win"><div id="panel"><h2><span id="wtitle">스킬창 · Skills</span><span id="close">닫기 ✕</span></h2>
<div style="font-size:11px;color:#c9d3f0">스킬을 누르면 빈 슬롯에 장착 · 슬롯이 꽉 찼으면 스킬 선택 후 슬롯 1/2/3을 눌러 교체 · 선택 없이 슬롯을 누르면 해제</div>
<div id="wslots"></div><div id="wlist"></div>
<div id="wnote">※ 데모: 10개 스킬 모두 해금 (DEMO.unlockAll). 실제 게임에서는 각 보스를 쓰러뜨리고 흡수해야 습득. 기력(파란 게이지)은 데모용으로 천천히 자동 회복.</div></div></div>
<script src="hud.js"></script><!-- modern HUD gauges: HP/MP/EXP/필살기 (town/hud.js) -->
<script>
'use strict';
const SPR=/*SPRITES*/;
const LVL=/*LEVEL*/;
const ANIM=/*ANIM*/;
const SFX_DATA=/*SFX*/; // procedural impact SFX (tools/sfx/gen_sfx.py), inlined as data URIs by build.py
const SFX=(()=>{let ac=null,gain=null;const buf={},last={},voices=[],pend={};
 // [sfx] file SFX (assets/sfx/fx/*.ogg, .m4a fallback for Safari) from docs_music/sfx_draft: fetched lazily after the audio unlock, never inlined.
 // FILE: key -> [file, per-key max voices, min gap (s), pitch jitter (+-), base vol, ui(=plays even with ?juice=0)]
 const FX='assets/sfx/fx/',FILE={},def=(ks,mx,gap,jit,vol,ui)=>{for(const k of ks.split(' '))FILE[k]={mx,gap,jit,vol,ui};};
 def('swing_sword_1 swing_sword_2 swing_sword_3 swing_spear swing_axe dash_attack',2,.04,.05,.8);
 def('hit_normal hit_finisher hit_critical',3,.035,.05,.9);def('combo_hit',1,.06,.02,.35);
 def('charge_stage1 charge_stage2 charge_release dodge_afterimage just_dodge',1,.08,.02,.8);
 def('footstep step_dirt step_stone step_wood step_grass',2,.09,.12,.22);def('skid',1,.25,.06,.3);
 def('player_hurt',1,.12,.05,.8);def('level_up',1,.5,0,.8,1);
 def('ult_raikou ult_demon_descent ult_ice_sword',1,.5,0,.9);def('magic_cast',1,.1,.03,.8);
 for(let i=1;i<=10;i++)def('skill_'+String(i).padStart(2,'0'),2,.08,.03,.7);
 def('monster_attack',3,.08,.08,.5);def('monster_death',3,.06,.08,.6);def('boss_warning',1,.4,0,.8);
 def('chest_open chest_locked item_pickup potion shop_buy door_open warp',2,.1,.02,.7,1);
 def('menu_move',1,.03,.03,.35,1);def('menu_confirm menu_cancel',1,.05,.02,.5,1);def('dialogue_advance',1,.03,.06,.35,1);
 const OGG=(()=>{try{return !!document.createElement('audio').canPlayType('audio/ogg; codecs="vorbis"');}catch(e){return false;}})();
 const MAXV=12,stat={req:0,ok:0,fail:[]};
 function dec(u){return fetch(u).then(r=>{if(!r.ok)throw new Error(r.status+' '+u);return r.arrayBuffer();}).then(a=>new Promise((res,rej)=>ac.decodeAudioData(a,res,rej)));}
 function load(k){if(!ac||buf[k]||pend[k]||!FILE[k])return pend[k];stat.req++;const o=FX+k+'.ogg',m=FX+k+'.m4a';
  return pend[k]=(OGG?dec(o).catch(()=>dec(m)):dec(m)).then(b=>{buf[k]=b;stat.ok++;}).catch(e=>{stat.fail.push(k);console.warn('[sfx] load failed',k,e&&e.message||e);});}
 function init(){if(ac||!SFX_DATA)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();gain=ac.createGain();gain.gain.value=FEEL.sfxVol;gain.connect(ac.destination);
  for(const k in SFX_DATA){fetch(SFX_DATA[k]).then(r=>r.arrayBuffer()).then(a=>ac.decodeAudioData(a)).then(b=>{buf[k]=b;}).catch(()=>{});}
  let i=0;const ks=Object.keys(FILE),next=()=>{if(i<ks.length){load(ks[i++]);setTimeout(next,40);}};setTimeout(next,300);}catch(e){ac=null;}} // trickle-preload after unlock

// ---------- collision ----------
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
function blockedPt(x,y){const b=LVL.bounds;if(x<b[0]||x>b[2]||y<b[1]||y>b[3])return true;
 for(const o of LVL.blocks){if(o.poly&&inPoly(x,y,o.poly))return true;if(o.ellipse){const[ex,ey,rx,ry]=o.ellipse;const dx=(x-ex)/rx,dy=(y-ey)/ry;if(dx*dx+dy*dy<1)return true;}}return false;}
function blocked(x,y,r){return blockedPt(x,y)||blockedPt(x-r,y)||blockedPt(x+r,y)||blockedPt(x,y-r*.4)||blockedPt(x,y+r*.4);}
function moveCol(e,dx,dy,r){let ok=true;if(dx){if(!blocked(e.x+dx,e.y,r))e.x+=dx;else ok=false;}
 if(dy){if(!blocked(e.x,e.y+dy,r))e.y+=dy;else ok=false;}return ok;}

function swimOk(x,y){return ell(x,y,POOL)<1&&ell(x,y,PILLAR)>1;}

 if(INV.bag.length>=BAG_N)return false;INV.bag.push(stackable(id)?{id,n}:{id,n:1,plus});return true;}
function invTake(id,n=1){let left=n;for(const b of INV.bag.filter(b=>b.id===id)){const k=Math.min(left,b.n);b.n-=k;left-=k;if(!left)break;}INV.bag=INV.bag.filter(b=>b.n>0);return left===0;}
function invSet(id,n){const c=invCount(id);if(n>c)invAdd(id,n-c);else if(n<c)invTake(id,c-n);}
function icSpan(id,size=32,cls=''){const d=IT[id],cols=ITEMS?ITEMS.cols:16,i=d?d.ic:(ITEMS&&ITEMS.ui[id]);if(i===undefined)return '';
 return `<span class="ic${size} ${cls}" style="background-position:${-(i%cols)*size}px ${-Math.floor(i/cols)*size}px"></span>`;}
function rarCol(id){return (RARITY[(IT[id]||{}).r]||RARITY.common)[0];}
const STAR_PX=['..#..','.###.','#####','.###.','.#.#.'],starCache={};
function starStrip(r){const n=RARITY_STARS[r]||0;if(!n)return null;if(starCache[r])return starCache[r];
 const W=6*n+1,H=7,on=new Set();for(let k=0;k<n;k++)STAR_PX.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='#')on.add((1+k*6+x)+','+(1+y));}));
 const cv2=document.createElement('canvas');cv2.width=W;cv2.height=H;const g=cv2.getContext('2d'),col=(RARITY[r]||RARITY.common)[0];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(on.has(x+','+y)){g.fillStyle=y<=2?'#fff6d8':col;if(y>2||x%6===3)g.fillRect(x,y,1,1);if(y<=2&&x%6!==3){g.fillStyle=col;g.fillRect(x,y,1,1);}}
  else{let edge=false;for(let dy=-1;dy<=1&&!edge;dy++)for(let dx=-1;dx<=1;dx++)if(on.has((x+dx)+','+(y+dy))){edge=true;break;}if(edge){g.fillStyle='#05040a';g.fillRect(x,y,1,1);}}}
 return starCache[r]={url:cv2.toDataURL(),w:W,h:H,n};}
function starsHTML(id,sc=1){const r=(IT[id]||{}).r,s=starStrip(r);if(!s)return '';
 return `<span class="stars" data-stars="${s.n}" style="width:${s.w*sc}px;height:${s.h*sc}px;background-image:url(${s.url})"></span>`;}

  hints=[['↑↓','선택'],['Enter','제작 · 강화'],['1·2·3 / Q·E','탭'],['Esc','닫기']];}

function makeUWBg(theme){// pre-rendered at 320x180 then scaled 4x (matches the chunky pixel grain)

          mud:{top:[78,110,86],bot:[22,40,30],floor:['#5e5236','#7a6a44','#3e3420'],weed:1}}[theme];
 const c=document.createElement('canvas');c.width=320;c.height=180;const g=c.getContext('2d');let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 for(let y=0;y<180;y++){const k=y/179;g.fillStyle=`rgb(${T.top.map((v,i)=>Math.round(v+(T.bot[i]-v)*k)).join()})`;g.fillRect(0,y,320,1);}
 for(let i=0;i<220;i++){g.fillStyle='rgba(255,255,255,.05)';g.fillRect(Math.floor(rnd()*320),Math.floor(rnd()*140),1,1);}
 // floor

 for(let x=0;x<320;x++){const y0=fy(x);for(let y=y0;y<180;y++){const r=rnd();g.fillStyle=y===y0?T.floor[1]:r<.12?T.floor[2]:r<.2?T.floor[1]:T.floor[0];g.fillRect(x,y,1,1);}}
 if(theme==='stone')for(let x=0;x<320;x+=16){g.fillStyle='#3c4850';g.fillRect(x,152,1,28);}            // basin tiles
 if(theme==='wood'){for(let x=0;x<320;x+=22){g.fillStyle='rgba(30,18,6,.55)';g.fillRect(x,0,2,180);}       // barrel staves
  g.fillStyle='rgba(40,26,10,.6)';g.fillRect(0,30,320,3);g.fillRect(0,110,320,3);}
 for(let i=0;i<14;i++){const x=Math.floor(rnd()*320),y=fy(x)+2+Math.floor(rnd()*20),w=3+Math.floor(rnd()*6);g.fillStyle=T.floor[2];g.fillRect(x,y,w,2);g.fillStyle=T.floor[1];g.fillRect(x,y-1,w-1,1);}
 return{c,weed:T.weed,fy};}
