<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.slot .plus{position:absolute;inset:0;font:bold 30px/56px monospace;color:#e8d6b0;text-align:center}

#s0{right:236px;bottom:24px}#s1{right:162px;bottom:24px}#s2{right:88px;bottom:24px}

// ---------- collision ----------
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
function blockedPt(x,y){const b=LVL.bounds;if(x<b[0]||x>b[2]||y<b[1]||y>b[3])return true;
 for(const o of LVL.blocks){if(o.poly&&inPoly(x,y,o.poly))return true;if(o.ellipse){const[ex,ey,rx,ry]=o.ellipse;const dx=(x-ex)/rx,dy=(y-ey)/ry;if(dx*dx+dy*dy<1)return true;}}return false;}
function blocked(x,y,r){return blockedPt(x,y)||blockedPt(x-r,y)||blockedPt(x+r,y)||blockedPt(x,y-r*.4)||blockedPt(x,y+r*.4);}
function moveCol(e,dx,dy,r){let ok=true;if(dx){if(!blocked(e.x+dx,e.y,r))e.x+=dx;else ok=false;}
 if(dy){if(!blocked(e.x,e.y+dy,r))e.y+=dy;else ok=false;}return ok;}

function nearFountain(x,y){return ((x-777)/140)**2+((y-415)/95)**2<1.85;}
function swimOk(x,y){return ell(x,y,POOL)<1&&ell(x,y,PILLAR)>1;}

const ACT=Object.fromEntries(ACTIONS.map(a=>[a.id,a]));
const MOVE_ACTS=['up','down','left','right'];
const LSK='townDemo.keys',MAXK=3;
const RESERVED={F12:'개발자 도구',F11:'전체 화면',MetaLeft:'OS 키',MetaRight:'OS 키',ContextMenu:'메뉴 키'};
let KEYMAP={},CODE2ACT={};
function defaultKeys(){const m={};for(const a of ACTIONS)m[a.id]=a.def.slice();return m;}
function rebuildCodes(){CODE2ACT={};for(const a of ACTIONS)for(const c of KEYMAP[a.id])CODE2ACT[c]=a.id;}
function loadKeys(){KEYMAP=defaultKeys();
 try{const v=JSON.parse(localStorage.getItem(LSK));if(v&&typeof v==='object')for(const a of ACTIONS)if(Array.isArray(v[a.id]))KEYMAP[a.id]=v[a.id].filter(c=>typeof c==='string'&&c&&!RESERVED[c]).slice(0,MAXK);}catch(e){}
 const seen=new Set(['Escape']);KEYMAP.menu=['Escape',...KEYMAP.menu.filter(c=>c!=='Escape')].slice(0,MAXK);
 for(const a of ACTIONS){if(a.id==='menu')continue;KEYMAP[a.id]=KEYMAP[a.id].filter(c=>!seen.has(c)&&seen.add(c));} // a hand-edited save can't create duplicates
 for(const c of KEYMAP.menu.slice(1))if(Object.keys(KEYMAP).some(id=>id!=='menu'&&KEYMAP[id].includes(c)))KEYMAP.menu=KEYMAP.menu.filter(x=>x!==c);
 rebuildCodes();}
function saveKeys(){try{localStorage.setItem(LSK,JSON.stringify(KEYMAP));}catch(e){}rebuildCodes();refreshHints();}
function conflictOf(code,except){for(const a of ACTIONS)if(a.id!==except&&KEYMAP[a.id].includes(code))return a.id;return null;}
function allConflicts(){const seen={},out=[];for(const a of ACTIONS)for(const c of KEYMAP[a.id]){if(seen[c]&&seen[c]!==a.id)out.push([c,seen[c],a.id]);seen[c]=a.id;}return out;}
const KEYNAME={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Space:'Space',Enter:'Enter',NumpadEnter:'Num Enter',Escape:'Esc',Tab:'Tab',ShiftLeft:'L-Shift',ShiftRight:'R-Shift',
 ControlLeft:'L-Ctrl',ControlRight:'R-Ctrl',AltLeft:'L-Alt',AltRight:'R-Alt',Backspace:'Backspace',Delete:'Del',Insert:'Ins',Home:'Home',End:'End',PageUp:'PgUp',PageDown:'PgDn',
 Minus:'-',Equal:'=',BracketLeft:'[',BracketRight:']',Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/',Backslash:'\\',Backquote:'`',CapsLock:'Caps',Lang1:'한/영',Lang2:'한자'};
function keyName(c){if(!c)return '—';if(KEYNAME[c])return KEYNAME[c];if(c.startsWith('Key'))return c.slice(3);if(c.startsWith('Digit'))return c.slice(5);if(c.startsWith('Numpad'))return 'Num '+c.slice(6);return c;}
function keyLabel(id,max=2){const k=(KEYMAP[id]||[]);return k.length?k.slice(0,max).map(keyName).join('/'):'미지정';}
function codeOf(e){if(e.code)return e.code;const k=e.key||'';if(/^[a-z]$/i.test(k))return 'Key'+k.toUpperCase();if(/^[0-9]$/.test(k))return 'Digit'+k;if(k===' ')return 'Space';return k;}
loadKeys();

const keys={};          // held state per action id (movement reads keys.up/down/left/right)
const pressed=new Set(); // physical codes currently down
let atkPressed=false,dashPressed=false,areaPressed=false;const skPress=[];const skHeld=[false,false,false];
const SKILL_ACT={skill1:0,skill2:1,skill3:2};
let ui=null;            // open overlay: 'menu' | 'options' | 'inv' | 'map' | 'dialog' | null  (game is paused while set)
let rebind=null;        // options screen: {id, idx, pending}
function syncHeld(){for(const a of ACTIONS)keys[a.id]=KEYMAP[a.id].some(c=>pressed.has(c));
 for(const id in SKILL_ACT)skHeld[SKILL_ACT[id]]=keys[id];}
function releaseAll(){pressed.clear();for(const k in keys)keys[k]=false;for(let i=0;i<3;i++)skHeld[i]=false;atkPressed=dashPressed=areaPressed=false;skPress.length=0;}
addEventListener('blur',releaseAll);
addEventListener('keydown',e=>{const code=codeOf(e);
 if(rebind){e.preventDefault();captureKey(code);return;}
 const act=CODE2ACT[code];
 if(act||['Tab','Space','F5','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Backspace'].includes(code))e.preventDefault(); // F5 reload, Tab focus, Space/arrow scroll
 if(ui){if(!e.repeat)uiKey(code,act);return;}
 if(!act)return;
 if(act==='menu'){if(!e.repeat){if(winOpen)toggleWin(false);else openUI('menu');}return;}
 if(act==='skills'){if(!e.repeat)toggleWin();return;}
 if(winOpen)return;
 pressed.add(code);syncHeld();
 if(e.repeat)return;
 doAction(act);});
addEventListener('keyup',e=>{pressed.delete(codeOf(e));syncHeld();});
function doAction(act){
 if(act in SKILL_ACT){skPress.push(SKILL_ACT[act]);skHeld[SKILL_ACT[act]]=true;return;}
 switch(act){
  case 'attack':atkPressed=true;break;
  case 'dash':dashPressed=true;break;
  case 'area':areaPressed=true;break;
  case 'interact':interact();break;
  case 'dive':diveAction();break;
  case 'potion':quickPotion();break;
  case 'inventory':invTab=0;openUI('inv');break;
  case 'map':openUI('map');break;
  case 'save':quickSave();break;
  case 'target':cycleTarget();break;
  case 'gear':cycleGear();break;
  case 'skills':toggleWin();break;
  case 'menu':if(winOpen)toggleWin(false);else openUI('menu');break;}}

function setAreaMode(m){areaMode=m in AREA?m:'';try{localStorage.setItem('townDemo.area',areaMode);}catch(e){}refreshHints();}
function castArea(){const A=AREA[areaMode];
 if(!A){msg('광역 스킬 없음 — 찬검(일월식) 또는 마왕(멸계강림) 필요 · 데모: '+keyLabel('menu',1)+' → 조작 설정',1);return;}
 if(uw||hero.swim||!canAct())return;
 if(areaCd>0){msg(A.name+' 재사용 대기 '+Math.ceil(areaCd)+'초',1);return;}
 areaCd=A.cd;areaFx={t:0,A,x:hero.x,y:hero.y};shake=14;flash=.45;hitStop=.12;
 for(const m of live())damageSlime(m,m.x-hero.x,m.y-hero.y,A.dmg,700,{skill:1,fin:1,col:A.col,stop:.12}); // enemies only (children/NPCs are never hit in the demo)
 msg(A.name+'!  ('+A.src+')');}
function quickPotion(){if(uw)return;useConsumable(INV.quick,false);} // E: uses the quick-slot item (default 회복약)
function diveAction(){
 if(uw||hero.swim){useSkill('water');return;}
 if(!unlocked('water')){msg('잠수하려면 크라켄의 힘(해류의 숨결)이 필요하다',1);return;}
 if(!findSpot()){msg('여기에는 잠수할 물이 없다 (분수 · 숨겨진 물웅덩이 근처에서 '+keyLabel('dive',1)+')',1);return;}
 useSkill('water');}
function enemyDist(m){return Math.hypot(m.x-hero.x,(m.y-hero.y)*1.2);}
function cycleTarget(){const L=live().filter(m=>enemyDist(m)<760).sort((a,b)=>enemyDist(a)-enemyDist(b));
 if(!L.length){target=null;msg('대상 없음',1);return;}
 const i=L.indexOf(target);target=L[(i+1)%L.length];}
function faceTarget(){if(!target||target.dead)return;const dx=target.x-hero.x,dy=target.y-hero.y;
 if(Math.abs(dx)>Math.abs(dy)*0.9){hero.face=dx>0?'right':'left';hero.hz=hero.face;}else hero.face=dy>0?'down':'up';}
function updateCtl(dt,ix,iy,l){ // called from update(): dash, area skill, timers
 if(areaCd>0)areaCd=Math.max(0,areaCd-dt);if(areaFx){areaFx.t+=dt;if(areaFx.t>1.4)areaFx=null;}
 if(msgBox){msgBox.t-=dt;if(msgBox.t<=0)msgBox=null;}
 if(target&&target.dead)target=null;
 if(hero.dashCd>0)hero.dashCd-=dt;
 if(areaPressed){areaPressed=false;castArea();}
 if(dashPressed){dashPressed=false;
  if(!uw&&!hero.atk&&!hero.sk&&!hero.swim&&!hero.dash&&!(hero.dashCd>0)){let dx=ix,dy=iy;if(!l){[dx,dy]=DIRV[hero.face];}
   const n=Math.hypot(dx,dy)||1;hero.dash={t:0,dx:dx/n,dy:dy/n};hero.dashCd=.55;hero.chainT=0;hero.combo=0;if(Math.abs(dx)>.2)hero.hz=dx>0?'right':'left';}}
}
function updateDash(dt){const d=hero.dash;d.t+=dt;const sp=900*(1-d.t/.2*.6);moveCol(hero,d.dx*sp*dt,d.dy*sp*dt*.8,12);hero.walkT+=dt*2;
 if(Math.random()<.7)parts.push({x:hero.x+(Math.random()-.5)*30,y:hero.y-10-Math.random()*50,vx:-d.dx*80,vy:-d.dy*60-20,g:0,t:0,life:.25,c:'#e8f4ff',s:4});
 if(d.t>=.2)hero.dash=null;}

const MENU=[['계속하기',()=>closeUI()],['조작 설정 (키 변경)',()=>openUI('options')],['인벤토리 · 장비',()=>{invTab=0;openUI('inv');}],['상점 (데모)',()=>{invTab=1;listSel=0;openUI('inv');}],['대장간 (데모)',()=>{invTab=2;listSel=0;openUI('inv');}],['월드맵',()=>openUI('map')],['빠른 저장',()=>{closeUI();quickSave();}],['저장 삭제 (빠른 저장)',()=>{try{localStorage.removeItem(LSQ);}catch(e){}closeUI();msg('빠른 저장을 삭제했다');}]];
const MENU_KEY=['menu','','inventory','','','map','save',''];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
const kb=c=>`<kbd>${esc(keyName(c))}</kbd>`;
function hintBar(parts){return `<div class="hb">${parts.map(([k,t])=>`<kbd>${esc(k)}</kbd> ${t}`).join(' · ')}</div>`;}
function renderUI(){
 ovEl.classList.toggle('open',!!ui&&ui!=='dialog');ovp.classList.remove('wide');dlgEl.classList.toggle('open',ui==='dialog');
 if(ui==='menu'){ovp.innerHTML=`<h2>일시정지 · 메뉴</h2><div class="menu">${MENU.map(([t],i)=>`<div class="mi${i===uiSel?' sel':''}" data-i="${i}">${t}${MENU_KEY[i]?`<span class="mk">${esc(keyLabel(MENU_KEY[i],1))}</span>`:''}</div>`).join('')}</div>`+
   hintBar([['↑/↓','선택'],[keyLabel('interact',1)+' · Enter','결정'],['Esc','계속하기']]);
  ovp.querySelectorAll('.mi').forEach(el=>el.onclick=()=>MENU[+el.dataset.i][1]());return;}
 if(ui==='options'){const cf=allConflicts();let h=`<h2>조작 설정 · 키 변경</h2><div class="sub">칸을 클릭하거나 방향키로 고른 뒤 Enter → 새 키를 누르세요. 행동마다 키 최대 ${MAXK}개 · 키보드 배치(한/영)와 상관없이 같은 자리 키로 인식합니다.</div><table class="km">`;
  let grp='';ACTIONS.forEach((a,r)=>{if(a.grp!==grp){grp=a.grp;h+=`<tr><th colspan="4">${grp}</th></tr>`;}
   const empty=!KEYMAP[a.id].length;h+=`<tr class="${r===optRow?'cur':''}"><td class="an${empty?' warn':''}">${a.name}${empty?' ⚠ 미지정':''}</td>`;
   for(let c=0;c<MAXK;c++){const code=KEYMAP[a.id][c],isRb=rebind&&rebind.id===a.id&&rebind.idx===c,locked=a.lock&&code===a.lock;
    h+=`<td><span class="kc${r===optRow&&c===optCol?' sel':''}${isRb?' rb':''}${locked?' lk':''}" data-r="${r}" data-c="${c}">${isRb?'키 입력…':code?esc(keyName(code))+(locked?' 🔒':''):'＋'}</span></td>`;}
   h+='</tr>';});
  h+=`</table><div class="note${/⚠|이미/.test(optNote)?' bad':''}">${optNote||(cf.length?'⚠ 충돌: '+cf.map(([c,x,y])=>keyName(c)+' = '+ACT[x].name+' / '+ACT[y].name).join(', '):'충돌 없음 ✓')}</div>`;
  h+=`<div class="row"><span class="btn" id="kreset">기본값으로 되돌리기</span><span class="btn" id="kback">← 메뉴로</span></div>`;

  let L=T.lines[dlg.i](),nm=T.name,por=T.por;if(L&&typeof L==='object'){if(L.who==='hero'){nm=HERO_NAME;por='hero';}else if(L.who){nm=L.name||nm;por=L.who;}L=L.t;}
  dlgEl.classList.toggle('hasp',!!por);

  dlgEl.onclick=dialogNext;}}
function uiKey(code,act){
 if(ui==='options'){optKey(code);return;}
 if(code==='Escape'||act==='menu'){closeUI();return;}
 if(ui==='dialog'){if(act==='interact'||act==='attack'||code==='Space'||code==='Enter')dialogNext();return;}
 if(ui==='menu'){if(code==='ArrowUp'||act==='up'){uiSel=(uiSel+MENU.length-1)%MENU.length;renderUI();}
  else if(code==='ArrowDown'||act==='down'){uiSel=(uiSel+1)%MENU.length;renderUI();}
  else if(code==='Enter'||code==='Space'||act==='interact'||act==='attack')MENU[uiSel][1]();
  else if(act&&act!=='up'&&act!=='down'&&act!=='left'&&act!=='right'&&['inventory','map','save'].includes(act)){closeUI();doAction(act);}
  return;}
 if(ui==='inv'){invKey(code,act);return;}
 if(ui==='map'){if(act==='map')closeUI();else if(act==='inventory')openUI('inv');return;}}
function optKey(code){
 if(code==='Escape'){openUI('menu');return;}
 const N=ACTIONS.length;
 if(code==='ArrowUp'){optRow=(optRow+N-1)%N;}else if(code==='ArrowDown'){optRow=(optRow+1)%N;}
 else if(code==='ArrowLeft'){optCol=(optCol+MAXK-1)%MAXK;}else if(code==='ArrowRight'){optCol=(optCol+1)%MAXK;}
 else if(code==='Enter'||code==='NumpadEnter'||code==='Space'){startRebind();return;}
 else if(code==='Backspace'||code==='Delete'){clearSlot();return;}
 else if(code==='KeyR'){resetKeys();return;}
 else return;
 optNote='';renderUI();}
function startRebind(){const a=ACTIONS[optRow];if(a.lock&&KEYMAP[a.id][optCol]===a.lock){optNote='⚠ Esc 는 메뉴 · 닫기 전용 키라 바꿀 수 없습니다 (다른 칸에 키를 추가할 수는 있음)';renderUI();return;}
 rebind={id:a.id,idx:Math.min(optCol,KEYMAP[a.id].length),pending:null};optNote=`[${a.name}] 새 키를 누르세요 · Esc 취소 · Backspace 지우기`;renderUI();}
function clearSlot(){const a=ACTIONS[optRow],code=KEYMAP[a.id][optCol];if(!code)return;
 if(a.lock&&code===a.lock){optNote='⚠ Esc 는 지울 수 없습니다';renderUI();return;}
 KEYMAP[a.id].splice(optCol,1);saveKeys();optNote=`[${a.name}] ${keyName(code)} 지움`+(KEYMAP[a.id].length?'':' — ⚠ 이 행동에 키가 없습니다');renderUI();}
function resetKeys(){KEYMAP=defaultKeys();saveKeys();rebind=null;optNote='기본값으로 되돌렸습니다 ✓';renderUI();}
function captureKey(code){const r=rebind,a=ACT[r.id];
 if(code==='Escape'){rebind=null;optNote='취소했습니다';renderUI();return;}
 if(code==='Backspace'||code==='Delete'){rebind=null;clearSlot();return;}
 if(RESERVED[code]){optNote=`⚠ ${keyName(code)} 는 ${RESERVED[code]} 용으로 예약된 키입니다`;renderUI();return;}
 const list=KEYMAP[r.id],old=list[r.idx];
 if(list.includes(code)){if(old!==code){list.splice(list.indexOf(code),1);list.splice(Math.min(r.idx,list.length),0,code);}rebind=null;saveKeys();optNote=`[${a.name}] ${keyName(code)} ✓`;renderUI();return;}
 const other=conflictOf(code,r.id);
 if(other&&r.pending!==code){r.pending=code;optNote=`⚠ ${keyName(code)} 는 이미 [${ACT[other].name}] 에 지정되어 있습니다 — 같은 키를 한 번 더 누르면 서로 맞바꾸고, 다른 키를 누르면 그 키로 지정합니다`;renderUI();return;}
 if(other){const ol=KEYMAP[other],j=ol.indexOf(code);if(old&&!(ACT[other].lock&&code===ACT[other].lock))ol[j]=old;else ol.splice(j,1);}
 if(r.idx<list.length)list[r.idx]=code;else list.push(code);
 rebind=null;saveKeys();optNote=`[${a.name}] ${keyName(code)} ✓`+(other?` · [${ACT[other].name}] ← ${old?keyName(old):'(없음)'}`:'');renderUI();}

const pad={dx:0,dy:0,prev:[]};let padName='';
const PADMAP={0:'attack',1:'dash',2:'interact',3:'potion',4:'skill1',5:'skill2',7:'skill3',6:'area',8:'skills',9:'menu',10:'target',11:'dive'};
addEventListener('gamepadconnected',e=>{padName=e.gamepad.id;msg('게임패드 연결: '+e.gamepad.id.slice(0,40));});
addEventListener('gamepaddisconnected',()=>{padName='';pad.dx=pad.dy=0;});
function pollPad(){if(!navigator.getGamepads)return;const gp=[...navigator.getGamepads()].find(g=>g&&g.connected);if(!gp){pad.dx=pad.dy=0;return;}
 const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),edge=i=>b(i)&&!pad.prev[i];
 let dx=(gp.axes[0]||0)+(b(15)?1:0)-(b(14)?1:0),dy=(gp.axes[1]||0)+(b(13)?1:0)-(b(12)?1:0);if(Math.hypot(dx,dy)<.25)dx=dy=0;
 if(ui||winOpen){pad.dx=pad.dy=0;
  if(ui){const nav=edge(12)?'ArrowUp':edge(13)?'ArrowDown':edge(14)?'ArrowLeft':edge(15)?'ArrowRight':edge(0)?'Enter':(edge(1)||edge(9))?'Escape':null;if(nav){if(rebind){if(nav==='Escape')captureKey('Escape');}else uiKey(nav,nav==='Escape'?'menu':null);}}
  else if(edge(1)||edge(8)||edge(9))toggleWin(false);}
 else{pad.dx=Math.max(-1,Math.min(1,dx));pad.dy=Math.max(-1,Math.min(1,dy));
  for(const i in PADMAP){if(edge(+i))doAction(PADMAP[i]);}
  skHeld[0]=!!keys.skill1||b(4);skHeld[1]=!!keys.skill2||b(5);skHeld[2]=!!keys.skill3||b(7);}
 pad.prev=gp.buttons.map(x=>x.pressed);}

 if(uw)P.push([keyLabel('dive',1)+' / '+keyLabel('attack',1),'물 위로']);
 else if(hero.swim)P.push([keyLabel('dive',1),'물 밖으로']);
 else{P.push([keyLabel('attack',1),'공격'],[keyLabel('dash',1),'대시']);
  if(unlocked('water')&&findSpot())P.push([keyLabel('dive',1),'잠수','hot']);

  P.push([keyLabel('target',1),target?'대상 ✓':'대상']);}
 P.push([keyLabel('potion',1),((IT[INV.quick]||{}).n||'물약')+' ×'+invCount(INV.quick)],[keyLabel('menu',1),'메뉴']);
 const sig=P.map(p=>p.join('|')).join(';');if(sig===khudSig)return;khudSig=sig;

function drawCtlWorld(){ // world space: target reticle + area-skill effect
 if(target&&!target.dead){const m=target,r=(m.kind==='boar'?50:30)*Math.min(1.6,m.sc||1),cy=m.y-(m.kind==='boar'?30:18)*(m.sc||1),t=performance.now()/1000,g=r+4+Math.sin(t*6)*3;
  ctx.save();ctx.strokeStyle='#ff4040';ctx.lineWidth=3;ctx.shadowColor='#000';ctx.shadowBlur=3;
  for(const[sx,sy]of[[-1,-1],[1,-1],[1,1],[-1,1]]){ctx.beginPath();ctx.moveTo(m.x+sx*g,cy+sy*g*.7-sy*10);ctx.lineTo(m.x+sx*g,cy+sy*g*.7);ctx.lineTo(m.x+sx*g-sx*12,cy+sy*g*.7);ctx.stroke();}ctx.restore();}
 if(areaFx){const f=areaFx,p=f.t/1.4,A=f.A;ctx.save();ctx.fillStyle=`rgba(${A.tint},${.55*(1-p)})`;ctx.fillRect(0,0,WW,WH);

  if(A===AREA.chan){ctx.fillStyle='#000';ctx.globalAlpha=(1-p)*.9;ctx.beginPath();ctx.arc(f.x,f.y-260,60,0,7);ctx.fill();ctx.strokeStyle='#ffe08a';ctx.lineWidth=6;ctx.stroke();}
  ctx.restore();}}

 updateSparkles(dt);
 if(atkPressed){atkPressed=false;

 }
 const a=hero.atk,sk=hero.sk;

  if(f.type==='crystal'){if(f.t>=0&&!f.hit){f.hit=true;burst(f.x,f.y-20,8,['#c8ffe8','#5ee0b0','#fff'],180,500);

   if(f.t>f.life)fx.splice(i,1);}
  else if(f.type==='proj'){const st=Math.hypot(f.vx,f.vy)*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.dist+=st;
   if(Math.random()<.9)parts.push({x:f.x-(f.vx>0?40:f.vx<0?-40:0)+(Math.random()-.5)*20,y:f.y-f.z+(Math.random()-.5)*30,vx:-f.vx*.1,vy:(Math.random()-.5)*40,g:0,t:0,life:.3,c:f.col[Math.floor(Math.random()*f.col.length)],s:4});

  else if(f.type==='ghost'){f.cd-=dt;const fade=f.hits>=3||f.t>f.life;if(fade){f.fo=(f.fo||0)+dt;if(f.fo>.5){fx.splice(i,1);continue;}}

  else if(f.t>f.life)fx.splice(i,1);
 }}

function updateBoar(m,dt){m.anim+=dt;const dx=hero.x-m.x,dy=hero.y-m.y,d=Math.hypot(dx,dy)||1;
 if(m.state==='idle'){if(Math.abs(dx)>8)m.face=dx>0?1:-1;
  if(m.t>1.4){moveCol(m,Math.cos(m.anim*.7)*30*dt,Math.sin(m.anim*.5)*20*dt,26);}
  if(m.t<=0){if(d<560){m.state='dig';m.t=.55;}else m.t=.8;}}
 else if(m.state==='dig'){m.face=dx>0?1:-1;if(Math.random()<.5)parts.push({x:m.x-m.face*40,y:m.y-4,vx:-m.face*(60+Math.random()*80),vy:-60-Math.random()*60,g:400,t:0,life:.4,c:['#d8b070','#a07a40'][Math.random()*2|0],s:4});
  if(m.t<=0){m.state='charge';m.t=.95;m.vx=dx/d*430;m.vy=dy/d*430*.8;shake=Math.max(shake,2);}}
 else if(m.state==='charge'){const ok=moveCol(m,m.vx*dt,m.vy*dt,26);
  if(Math.random()<.7)parts.push({x:m.x-Math.sign(m.vx)*50,y:m.y-2,vx:-m.vx*.15,vy:-40-Math.random()*50,g:300,t:0,life:.35,c:'#d8b070',s:4});
  if(ok===false){m.state='stun';m.t=1.2;shake=Math.max(shake,6);burst(m.x+Math.sign(m.vx)*60,m.y-40,14,['#c8b088','#8a7050','#fff'],220,500);}
  else if(m.t<=0){m.state='idle';m.t=1.3+Math.random()*1.2;}}
 else if(m.state==='stun'){if(m.t<=0){m.state='idle';m.t=1;}}}

 if(lg>fr){ctx.fillStyle=e.lagDelay>0?'#ffffff':'#ffd84a';ctx.fillRect(x+Math.round(w*fr),y,Math.round(w*(lg-fr)),h);}
 const c=fr>.5?['#46d84a','#a8f58a']:fr>.25?['#f0c030','#fff0a0']:['#e83a2a','#ff9a8a'];
 ctx.fillStyle=c[0];ctx.fillRect(x,y,Math.round(w*fr),h);ctx.fillStyle=c[1];ctx.fillRect(x,y,Math.round(w*fr),1);

  ctx.lineWidth=3;ctx.strokeStyle=enh?'#2a0848':'#5a0a0a';ctx.strokeText('CHAMPION',x+w/2,y-4);ctx.fillStyle=enh?'#c890ff':'rgb(255,205,50)';ctx.fillText('CHAMPION',x+w/2,y-4);ctx.textAlign='start';}}

const GEARSETS=[{id:'',name:'기본 튜닉'},{id:'g1',name:'초급 · 시작 마을'},{id:'g2',name:'중급 · 바다'},{id:'g3',name:'후반 · 미스릴'},{id:'g4',name:'최종 · 마룡'}];
let gearIdx=0,gearToast=0;
function cycleGear(){gearIdx=(gearIdx+1)%GEARSETS.length;gearToast=2.2;}
function gearKey(key){const g=GEARSETS[gearIdx].id;if(!g)return key;const k=key+'@'+g;return IMG[k]?k:key;}
function drawFrame(key,fi,x,y,flip,sc=1,alpha=1){key=gearKey(key);const m=SPR[key],img=IMG[key];if(!img)return;
 const w=m.w*sc,h=m.h*sc;ctx.save();ctx.globalAlpha*=alpha;ctx.translate(Math.round(x),Math.round(y));if(flip)ctx.scale(-1,1);
 ctx.drawImage(img,fi*m.w,0,m.w,m.h,-m.ax*sc,-m.ay*sc,w,h);ctx.restore();}
function shadow(x,y,rx,ry,a=.32){ctx.fillStyle=`rgba(10,15,5,${a})`;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
// which sprite frame the hero shows right now -> [key, frame, flip, yOffset]
function heroPose(){const h=hero,a=h.atk,sk=h.sk;
 if(sk){const F=SKFX[sk.id];const fi=F.pose(sk);if(fi<0)return null;return[F.key||('sk_'+sk.id),fi,sk.flip,-(sk.z||0)];}
 if(h.swim)return['sk_water',3,h.hz==='left',58+Math.sin(h.walkT*6)*2];
 if(a){const s=a.s,side=h.face==='left'||h.face==='right',fl=side?h.face==='left':h.hz==='left';
  if(s.kind==='spin'){// right -> front -> left -> back -> right (backhand): reads as one full turn
   const seq=[[0,0],[1,0],[2,1],[3,0],[4,0]];const k=Math.min(4,Math.floor(a.t/((s.a1-.02)/5)));const[f,inv]=seq[k];return['cb_spin',f,inv?!fl:fl,0];}
  if(side)return[s.kind==='slash'?'cb_slash':'cb_thrust',a.t<(s.kind==='slash'?.06:.07)?0:1,fl,0];
  const key=h.face==='up'?'hero_atk_up':'hero_atk_r1';return[key,s.kind==='slash'?(a.t<.06?0:1):2,h.face==='up'?false:fl,0];}
 const fi=h.moving?Math.floor(h.walkT*9)%4:0;
 if(h.face==='down')return['hero_walk_down',fi,false,0];if(h.face==='up')return['hero_walk_up',fi,false,0];return['hero_walk_right',fi,h.face==='left',0];}
function drawHero(){const h=hero;if(h.inv>0&&Math.floor(h.inv*20)%2)return;
 if(h.hidden){drawMound();return;}
 const p=heroPose();if(!p)return;
 if(h.swim){ctx.save();ctx.beginPath();ctx.rect(h.x-200,h.y-300,400,300+8);ctx.clip();drawFrame(p[0],p[1],h.x,h.y+p[3],p[2]);ctx.restore();
  ctx.strokeStyle='rgba(220,250,255,.75)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(h.x,h.y+6,62+Math.sin(h.walkT*5)*4,11,0,0,Math.PI*2);ctx.stroke();return;}
 drawFrame(p[0],p[1],h.x,h.y+p[3],p[2]);}
function drawMound(){const h=hero,t=performance.now()/1000;ctx.fillStyle='#b8914a';ctx.beginPath();ctx.ellipse(h.x,h.y-4,34,13,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#d9b56a';ctx.beginPath();ctx.ellipse(h.x-3,h.y-8,24,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f0d79a';for(let i=0;i<5;i++){const a=t*7+i*1.3;ctx.fillRect(Math.round(h.x+Math.cos(a)*26),Math.round(h.y-6+Math.sin(a)*8),4,4);}}
function drawSlash(){const a=hero.atk;if(!a)return;const s=a.s;const dv=DIRV[hero.face];
 if(s.kind==='spin'){drawSpinRing(a,'front');return;}
 const p=(a.t-s.a0*0.5)/(s.a1-s.a0*0.5+.06);if(p<0||p>1.2)return;const fade=p>1?1-(p-1)/.2:1;
 if(s.kind==='thrust'){if(!dv[1])return;// up/down: code-drawn stab streak (side view has it in the sprite)
  const x0=hero.x+(hero.hz==='left'?-10:10),y0=hero.y-60+dv[1]*30,L=s.len*.8*Math.min(1,p*1.4);
  for(const[w,c]of[[12,`rgba(120,220,255,${.35*fade})`],[5,`rgba(255,255,255,${.95*fade})`]]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0,y0+dv[1]*L);ctx.stroke();}
  return;}
 const cx=hero.x+dv[0]*20,cy=hero.y-55+dv[1]*30;
 if(hero.face==='left'||hero.face==='right')return; // side-view sprite already contains the arc
 const base=Math.atan2(dv[1]*.8,dv[0]);const R=64,sweep=1.9;
 const a0=base-sweep/2,a1=a0+sweep*Math.min(1,p);
 ctx.save();ctx.translate(cx,cy);ctx.scale(1,.75);ctx.lineCap='butt';
 for(const [w,c,rr] of [[16,`rgba(120,220,255,${.35*fade})`,R],[9,`rgba(255,255,255,${.9*fade})`,R-2],[4,`rgba(190,240,255,${fade})`,R-12]]){
  ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.arc(0,0,rr,a0,a1);ctx.stroke();}
 ctx.restore();}
function drawSpinRing(a,part){const s=a.s;const p=(a.t-s.a0+.03)/(s.a1-s.a0+.03);if(p<0||p>1.35)return;const fade=p>1?Math.max(0,1-(p-1)/.35):1;
 const dir=(hero.face==='left'||(hero.face!=='right'&&hero.hz==='left'))?-1:1;const head=-Math.PI/2+dir*Math.min(1,p)*Math.PI*2.2;const tail=2.6;
 ctx.save();ctx.translate(hero.x,hero.y-46);ctx.scale(1,.38);ctx.lineCap='round';
 ctx.beginPath();if(part==='back')ctx.rect(-200,-200,400,200);else ctx.rect(-200,0,400,200);ctx.clip(); // back half behind the hero, front half over him
 ctx.strokeStyle=`rgba(200,240,255,${.3*fade})`;ctx.lineWidth=26;ctx.beginPath();ctx.arc(0,0,112,0,Math.PI*2);ctx.stroke();
 const N=12;for(let i=0;i<N;i++){const t0=i/N,t1=(i+1)/N;const al=(1-t0)*fade;
  const A0=head-dir*tail*t0,A1=head-dir*tail*t1;ctx.beginPath();ctx.arc(0,0,114,Math.min(A0,A1),Math.max(A0,A1));
  ctx.strokeStyle=`rgba(255,255,255,${al})`;ctx.lineWidth=12*(1-t0*.6);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,100,Math.min(A0,A1),Math.max(A0,A1));ctx.strokeStyle=`rgba(140,220,255,${al*.8})`;ctx.lineWidth=6;ctx.stroke();}
 ctx.restore();}
function drawSkillOverlay(){const sk=hero.sk;if(!sk)return;const dv=sk.dir;
 if(sk.id==='thread'&&sk.tip&&sk.t>=.1&&sk.t<.46){const fl=sk.flip;const hx=hero.x+(dv[0]?(fl?-62:62):10),hy=hero.y-86+(dv[1]?dv[1]*20:0);
  const tx=sk.tip[0],ty=sk.tip[1]-86+(dv[1]?20:0);ctx.lineCap='round';
  for(const[w,c]of[[7,'rgba(120,230,255,.35)'],[3,'rgba(230,255,255,.95)']]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx,ty);ctx.stroke();}
  ctx.fillStyle='#e8ffff';ctx.save();ctx.translate(tx,ty);ctx.rotate(Math.PI/4);ctx.fillRect(-6,-6,12,12);ctx.restore();}
 if(sk.id==='dragon'&&sk.t>=.85&&sk.t<1.35){const p=Math.min(1,(sk.t-.85)/.18),fade=sk.t>1.15?1-(sk.t-1.15)/.2:1;
  const cx=hero.x+dv[0]*60,cy=hero.y-70+dv[1]*40;const base=Math.atan2(dv[1],dv[0]);
  ctx.save();ctx.translate(cx,cy);ctx.scale(1,dv[1]?.8:.62);ctx.lineCap='round';
  [['255,70,90',250,22],['110,170,255',228,20],['255,214,90',206,18],['255,255,255',228,6]].forEach(([c,R,w])=>{ctx.strokeStyle=`rgba(${c},${.9*fade})`;ctx.lineWidth=w;
   ctx.beginPath();ctx.arc(0,0,R,base-1.25,base-1.25+2.5*p);ctx.stroke();});ctx.restore();}
 if(sk.id==='pact'&&sk.t<.72){const a=performance.now()/600;ctx.save();ctx.translate(hero.x,hero.y);ctx.scale(1,.32);ctx.strokeStyle='rgba(220,120,255,.55)';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,92,0,7);ctx.stroke();for(let i=0;i<8;i++){const b=a+i*Math.PI/4;ctx.fillStyle='rgba(240,190,255,.8)';ctx.fillRect(Math.cos(b)*92-4,Math.sin(b)*92-4,8,8);}ctx.restore();}}
function drawFx(f){
 if(f.type==='crystal'){if(f.t<0)return;const g=Math.min(1,f.t/.09),out=f.t>f.life-.3?(f.life-f.t)/.3:1;
  ctx.save();ctx.translate(Math.round(f.x),Math.round(f.y));ctx.scale(1,g*Math.max(.05,out));drawFrame('fx_crystal',f.v,0,0,f.flip,.66,Math.min(1,out*1.5));ctx.restore();}
 else if(f.type==='proj'){ctx.save();ctx.translate(Math.round(f.x),Math.round(f.y-f.z));
  if(f.dv[0]<0)ctx.scale(-1,1);else if(f.dv[1])ctx.rotate(f.dv[1]>0?Math.PI/2:-Math.PI/2);drawFrame(f.key,0,0,0,false,1);ctx.restore();}
 else if(f.type==='ghost'){const al=Math.min(1,f.t/.4)*(f.fo?1-f.fo/.5:1);const bob=Math.sin(f.t*4)*6;
  shadow(f.x,f.y+2,16,5,.18*al);ctx.save();ctx.globalAlpha=.92*al;drawFrame('fx_ghost',0,f.x,f.y-f.z+bob,f.fl,.8);ctx.restore();}
 else if(f.type==='after'){const al=(1-f.t/f.life)*.55;ctx.save();ctx.globalCompositeOperation='lighter';drawFrame(f.key,f.fi,f.x,f.y,f.fl,1,al);ctx.restore();}}
function drawRing(f){const p=f.t/f.life,r=f.r0+(f.r1-f.r0)*(1-Math.pow(1-p,2.2)),al=1-p;
 ctx.save();ctx.translate(f.x,f.y);ctx.scale(1,f.ry);ctx.strokeStyle=`rgba(${f.col},${al})`;ctx.lineWidth=f.w*(1-p*.5)/f.ry*.6;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.restore();}
function drawSlime(m){if(m.dead)return;const sc=m.sc*(m.spawnT>0?1-m.spawnT*1.6:1);if(sc<=0)return;
 let fi=0,sx=1,sy=1;if(m.state==='crouch'||m.squash>0.3)fi=1;if(m.state==='hop'){sx=.9;sy=1.1;}
 const fl=m.flash>0;
 ctx.save();ctx.translate(m.x,m.y-m.hz);ctx.scale(sx,sy);drawFrame('slime',fl?2:fi,0,0,m.face<0,sc);
 if(fl&&Math.floor(m.flash*40)%2){ctx.globalCompositeOperation='lighter';drawFrame('slime',2,0,0,m.face<0,sc,.5);}ctx.restore();}
function drawSpirit(){const fi=Math.floor(spirit.t*6)%4;const bob=Math.sin(spirit.t*3)*6;
 shadow(spirit.x,spirit.y+38,18,6,.18);
 ctx.save();ctx.globalAlpha=.95;drawFrame('spirit',fi,spirit.x,spirit.y+bob,hero.hz==='left');ctx.restore();}

const HEART=["..XXXX..XXXX..",".XRRRRXXRRRRX.","XRWWRRRRRRRRRX","XRWWRRRRRRRRRX","XRWRRRRRRRRRRX","XRRRRRRRRRRRDX","XRRRRRRRRRRRDX",".XRRRRRRRRRDX.","..XRRRRRRRDX..","...XRRRRRDX...","....XRRRDX....",".....XRDX.....","......XX......"];
function drawHeart(x,y,p,full){const C=full?{X:'#1a0606',R:'#e0201c',W:'#ffb4a0',D:'#9a0c0c'}:{X:'#1a0606',R:'#3a1414',W:'#5a2a2a',D:'#2a0c0c'};
 const R=v=>Math.round(v);
 HEART.forEach((row,j)=>{for(let i=0;i<row.length;i++){const ch=row[i];if(ch==='.')continue;ctx.fillStyle=C[ch];ctx.fillRect(R(x+i*p),R(y+j*p),R(x+(i+1)*p)-R(x+i*p),R(y+(j+1)*p)-R(y+j*p));}});
 if(full){ctx.fillStyle='#ff5a40';ctx.fillRect(R(x+8*p),R(y+2*p),R(3*p),Math.max(1,R(p)));}}
function outlined(t,x,y,px,col='#fff'){ctx.font=`bold ${Math.round(px)}px sans-serif`;ctx.fillStyle=col;ctx.strokeStyle='#000';ctx.lineWidth=Math.max(2,px/7);ctx.strokeText(t,x,y);ctx.fillText(t,x,y);}
function drawGearToast(){if(gearToast<=0)return;gearToast-=1/60;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=Math.min(1,gearToast*2);
 const t='장비 세트: '+GEARSETS[gearIdx].name+'  ('+keyLabel('gear',1)+')';ctx.textAlign='center';outlined(t,innerWidth/2,innerHeight*0.16,Math.max(16,innerWidth/55),'#ffe08a');ctx.textAlign='start';ctx.restore();}
window.__gear=()=>({idx:gearIdx,name:GEARSETS[gearIdx].name});
function drawHUD(){// positions in world-pixels of the concept (1280x720 base), anchored to visible top-left
 const s=scale,ox=Math.max(0,-camX)*s+offX,oy=Math.max(0,-camY)*s;const u=s; ctx.save();ctx.setTransform(1,0,0,1,0,0);
 const P=Math.max(1,2.72*u);
 for(let i=0;i<hero.maxHp;i++)drawHeart(ox+27*u+i*41*u,oy+19*u,P,i<hero.hp);
 const bx=Math.round(ox+28*u),by=Math.round(oy+64*u),bw=Math.round(272*u),bh=Math.round(34*u),q=Math.max(1,Math.round(2*u));
 ctx.fillStyle='#0b0b14';ctx.fillRect(bx-q,by-q,bw+2*q,bh+2*q);
 ctx.fillStyle='#d8dde8';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle='#8a90a0';ctx.fillRect(bx+q,by+bh-2*q,bw-2*q,q);ctx.fillRect(bx+bw-2*q,by+q,q,bh-2*q);
 ctx.fillStyle='#ffffff';ctx.fillRect(bx+q,by+q,bw-3*q,q);
 const ix=bx+3*q,iy=by+3*q,iw=bw-6*q,ih=bh-6*q;ctx.fillStyle='#0a0e1e';ctx.fillRect(ix-q,iy-q,iw+2*q,ih+2*q);ctx.fillStyle='#0c1c48';ctx.fillRect(ix,iy,iw,ih);
 const N=8,segW=iw/N,fw=iw*gauge;
 for(let k=0;k<N;k++){const x0=Math.round(ix+k*segW),x1=Math.round(ix+Math.min(fw,(k+1)*segW));if(x1<=x0)continue;
  ctx.fillStyle='#1ea6f2';ctx.fillRect(x0,iy,x1-x0,ih);ctx.fillStyle='#46d0ff';ctx.fillRect(x0,iy+q,x1-x0,Math.round(ih*.45));
  ctx.fillStyle='#b4f2ff';ctx.fillRect(x0,iy+q,x1-x0,q);ctx.fillStyle='#0f5fa8';ctx.fillRect(x0,iy+ih-q,x1-x0,q);
  if(k>0){ctx.fillStyle='#0d4f8c';ctx.fillRect(x0,iy,q,ih);}}
 {const cx=bx+2*u,cy=by+bh+8*u;drawPix('coin',cx,cy,3*u);outlined('× '+(coins+INV.gold),cx+30*u,cy+21*u,19*u,'#ffe08a');} // coin counter (under the gauge)
 if(popup){const al=Math.min(1,popup.t/.4),w=Math.round(420*u),h=Math.round(92*u),px=Math.round(cv.width/2-w/2),py=Math.round(oy+150*u);ctx.globalAlpha=al;
  ctx.fillStyle='#0b0b14';ctx.fillRect(px-3*q,py-3*q,w+6*q,h+6*q);ctx.fillStyle='#e8d6b0';ctx.fillRect(px-q,py-q,w+2*q,h+2*q);ctx.fillStyle='#18203f';ctx.fillRect(px+q,py+q,w-2*q,h-2*q);
  drawPix(popup.pix,px+16*u,py+16*u,5*u);outlined(popup.title,px+96*u,py+40*u,26*u,'#ffe08a');outlined(popup.sub,px+96*u,py+72*u,20*u,'#fff');ctx.globalAlpha=1;}
 let ty=by+bh+26*u+32*u;
 if(hero.atk||(hero.combo>0&&hero.chainT>0)){const i=hero.atk?hero.atk.i:hero.combo;outlined((i+1)+' HIT '+SWINGS[i].name,bx,ty,20*u);ty+=26*u;}
 if(toast){const S=toast.S,al=Math.min(1,toast.t/.3);ctx.globalAlpha=al;const isz=Math.round(36*u);
  ctx.fillStyle='#0b0b14';ctx.fillRect(bx-q,ty-22*u-q,isz+2*q,isz+2*q);ctx.drawImage(IMG.ui_icons,S.icon*48,0,48,48,bx,ty-22*u,isz,isz);
  outlined(S.name+(toast.extra?' · '+toast.extra:''),bx+isz+8*u,ty+4*u,18*u,toast.bad?'#ff9a8a':'#ffe08a');ctx.globalAlpha=1;}
 if(timeStop>0){outlined('시간 정지 '+timeStop.toFixed(1),cv.width/2-70*u,oy+40*u,22*u,'#ffe08a');}
 ctx.restore();}

function render(){computeView();ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
 const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;
 offX=0;ctx.setTransform(scale,0,0,scale,(-camX+sx)*scale,(-camY+sy)*scale);ctx.imageSmoothingEnabled=false;
 if(uw){drawUnderwater();for(const p of parts){ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);}ctx.globalAlpha=1;drawHUD();return;}
 ctx.drawImage(IMG.bg,0,0,WW,WH);
 drawFrame('decal_puddle',0,868,572,false); // hidden dive spot (rain puddle)
 for(const f of fx)if(f.type==='twinkle')drawTwinkle(f);
 if(!hero.swim&&!hero.hidden&&!(hero.sk&&hero.sk.z>2))shadow(hero.x-8,hero.y+2,44,14,.4);else if(hero.sk&&hero.sk.z)shadow(hero.x,hero.y+2,30,9,.25);
 for(const m of slimes)if(!m.dead)m.kind==='boar'?shadow(m.x,m.y+1,62,14,.38):shadow(m.x-3,m.y+1,32*m.sc*(1-m.hz/80),10*m.sc,.38);
 const L=[];const heroY=hero.swim||(hero.sk&&(hero.sk.id==='dive'||hero.sk.id==='undive'))?Math.max(hero.y,419):hero.y;
 const drawHeroAll=()=>{if(hero.atk&&hero.atk.s.kind==='spin')drawSpinRing(hero.atk,'back');drawHero();drawSlash();drawSkillOverlay();};
 L.push({y:heroY,f:drawHeroAll});for(const m of slimes)L.push({y:m.y,f:()=>m.kind==='boar'?drawBoar(m):drawSlime(m)});
 L.push({y:spirit.y+40,f:drawSpirit});
 for(const f of fx)if(f.type!=='ring'&&f.type!=='twinkle')L.push({y:f.type==='proj'?f.y+1:f.y,f:()=>drawFx(f)});
 for(const o of LVL.overlayImgs)L.push({y:o.sortY,ov:1,f:()=>ctx.drawImage(IMG['ov_'+o.name],o.x,o.y)});
 L.sort((a,b)=>a.y-b.y||(a.ov?1:0)-(b.ov?1:0));for(const d of L)d.f();
 for(const f of fx)if(f.type==='ring'&&!f.noTint)drawRing(f);
 for(const p of parts){ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);}ctx.globalAlpha=1;
 if(timeStop>0){// world goes grey-blue, the hero keeps his colours
  const al=Math.min(1,timeStop/.3);ctx.save();ctx.globalAlpha=.8*al;ctx.globalCompositeOperation='saturation';ctx.fillStyle='hsl(0,0%,50%)';ctx.fillRect(0,0,WW,WH);
  ctx.globalCompositeOperation='multiply';ctx.fillStyle='#9fb2d6';ctx.fillRect(0,0,WW,WH);ctx.restore();drawHeroAll();}
 for(const f of fx)if(f.type==='ring'&&f.noTint)drawRing(f);
 drawBars();drawCtlWorld();
 if(flash>0){ctx.fillStyle=`rgba(255,250,230,${Math.min(.7,flash)})`;ctx.fillRect(0,0,WW,WH);}
 if(DEBUG)drawDebug();
 drawHUD();drawGearToast();drawCtlHUD();}
function drawDebug(){ctx.save();ctx.lineWidth=2;ctx.strokeStyle='#f00';ctx.fillStyle='rgba(255,0,0,.2)';
 for(const o of LVL.blocks){ctx.beginPath();if(o.poly){o.poly.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();}else{const[x,y,rx,ry]=o.ellipse;ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);}ctx.fill();ctx.stroke();}
 ctx.strokeStyle='#0cf';ctx.beginPath();ctx.ellipse(POOL.x,POOL.y,POOL.rx,POOL.ry,0,0,7);ctx.stroke();
 for(const sp of DIVE.spots){ctx.strokeStyle=diveTaken.includes(sp.id)?'#888':'#0ff';if(sp.r){ctx.beginPath();ctx.arc(sp.x,sp.y,sp.r,0,7);ctx.stroke();}ctx.fillStyle='#0ff';ctx.font='12px monospace';ctx.fillText('dive:'+sp.id+(diveTaken.includes(sp.id)?' (taken)':''),sp.x-30,sp.y-8);}
 const E=(x,y,rx,ry)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.stroke();};
 const a=hero.atk;if(a&&a.t>=a.s.a0&&a.t<=a.s.a1){const s=a.s,dv=DIRV[hero.face];ctx.strokeStyle='#ff0';
  if(s.kind==='slash')E(hero.x+dv[0]*s.reach,hero.y+dv[1]*s.reach*.75-(dv[1]?0:6),dv[0]?s.rad:s.rad*1.25,dv[0]?s.rad*.85:s.rad*.7);
