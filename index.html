 for(const[t,ex,ey]of(R.en||[])){const c=ENEMIES[t];if(!c)continue;if(c.boss&&G.flags['boss_'+id])continue;ents.push(mkEnemy(t,ex*T+8,ey*T+8));}
 bgDirty=true;roomName=150;playMusic(R.music);
 checkPuzzle(true);G.x=x;G.y=y;saveGame();
 if(R.onEnter&&!G.flags['ev_'+R.onEnter])runEvent(R.onEnter);}
function mkEnemy(t,x,y){const c=ENEMIES[t];return{t,c,x,y,hp:c.hp,max:c.hp,r:c.size||6,timer:c.boss?0:(Math.random()*60)|0,hurt:0,kb:{x:0,y:0},vx:0,vy:0,a:0,
 fly:c.ai==='fly'||c.ai==='boss_wyvern',boss:!!c.boss,spawn:c.boss?60:0};}

/* ---------- events / dialogue ---------- */
function startDlg(lines,onDone){dlg={lines:(lines||[]).map(l=>Array.isArray(l)?l:['',String(l)]),i:0,ch:0,onDone};if(!dlg.lines.length){dlg=null;onDone&&onDone();}}
function runEvent(key){const ev=STORY.events[key];G.flags['ev_'+key]=1;saveGame();if(!ev)return;startDlg(ev.lines||[],()=>{if(ev.give)give(ev.give);if(ev.win){state='win';SFX.win();playMusic('title');}saveGame();});}
function say(s){toastQ.push(s);}
function giveName(g){if(g.sword)return SW[g.sword]?SW[g.sword].name:'?';if(g.sub)return WP[g.sub]?WP[g.sub].name+' ('+(g.n||WP[g.sub].dur)+'회)':'?';if(g.spirit)return SP[g.spirit]?SP[g.spirit].name:'?';
 if(g.item)return (ITEMS[g.item]?ITEMS[g.item].name:'?')+((g.n||1)>1?' x'+g.n:'');if(g.heartup)return '생명의 그릇 (최대 체력 +1칸)';if(g.gold)return g.gold+' 골드';return '?';}
function give(g){if(!g)return;if(g.sword&&SW[g.sword]){if(!G.swords.includes(g.sword))G.swords.push(g.sword);G.sword=g.sword;}
 if(g.sub&&WP[g.sub]){G.subs[g.sub]=(G.subs[g.sub]||0)+(g.n||WP[g.sub].dur);G.sub=g.sub;}
 if(g.spirit&&SP[g.spirit]){if(!G.spirits.includes(g.spirit))G.spirits.push(g.spirit);G.spirit=g.spirit;G.sp=100;}
 if(g.item&&ITEMS[g.item])G.items[g.item]=(G.items[g.item]||0)+(g.n||1);
 if(g.heartup){G.maxHp+=2;G.hp=G.maxHp;}if(g.gold)G.gold+=g.gold;
 say(giveName(g)+' 획득!');SFX.chest();}

/* ---------- tiles ---------- */
const GROUND_BLOCK='#THnA~DFtLSQBXKCco_v ';const AIR_PASS='o_v';const FLY_BLOCK='#THnADtLSQBXKCc ';
function tileAt(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=CW||ty>=CH)return null;return grid[ty][tx];}
function setTile(tx,ty,c){if(grid[ty]&&grid[ty][tx]!==undefined){grid[ty][tx]=c;bgDirty=true;}}
function blocked(c,mode){if(c===null)return false;if(mode==='fly')return FLY_BLOCK.includes(c);if(mode==='air')return GROUND_BLOCK.includes(c)&&!AIR_PASS.includes(c);return GROUND_BLOCK.includes(c);}
function free(x,y,r,mode){return!(blocked(tileAt(x-r,y-r),mode)||blocked(tileAt(x+r-.01,y-r),mode)||blocked(tileAt(x-r,y+r-.01),mode)||blocked(tileAt(x+r-.01,y+r-.01),mode));}
function moveBody(o,dx,dy,r,mode){let b=false;if(free(o.x+dx,o.y,r,mode))o.x+=dx;else b=true;if(free(o.x,o.y+dy,r,mode))o.y+=dy;else b=true;return b;}
function countT(ch){let n=0;for(const r of grid)for(const c of r)if(ch.includes(c))n++;return n;}
function checkPuzzle(silent){const pz=R.puzzle;if(!pz||!pz.length||!countT('D'))return;
 const ok=pz.every(p=>p==='torches'?!countT('t'):p==='switches'?!countT('sS'):p==='plates'?!countT('P'):p==='fire'?!countT('F'):p==='enemies'?!ents.some(e=>!e.dead):true);
 if(ok){for(let y=0;y<CH;y++)for(let x=0;x<CW;x++)if(grid[y][x]==='D')setTile(x,y,'.');if(!silent){SFX.door();say('어딘가에서 문이 열렸다!');shake=6;}saveGame();}}

/* ---------- particles ---------- */
function burst(x,y,col,n=8,sp=2){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp+.4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.3,l:18+Math.random()*16,col});}}
function floatT(x,y,s,c){floats.push({x,y,s,c,l:40});}

/* ---------- combat helpers ---------- */
function hurtEnemy(e,d,kx,ky){if(e.dead||e.spawn>0)return;e.hp-=d;e.hurt=10;const k=e.boss?1:4;e.kb.x=kx*k;e.kb.y=ky*k;SFX.hit();burst(e.x,e.y-6,'#fff8d0',5);spark(e.x+(Math.random()-.5)*6,e.y-6-(Math.random()*6));floatT(e.x,e.y-12,''+d,'#ffe060');shake=Math.max(shake,2);G.sp=Math.min(100,G.sp+1.5);
 if(e.hp<=0)killEnemy(e);}
function killEnemy(e){if(e.dead)return;e.dead=true;SFX.die();burst(e.x,e.y,e.c.color,e.boss?50:14,e.boss?3:2);
 const gd=e.c.gold||0;if(gd)pickups.push({x:e.x+4,y:e.y,t:'gold',n:gd,l:600});
 if(Math.random()<.25)pickups.push({x:e.x-4,y:e.y,t:'heart',l:600});else if(Math.random()<.15)pickups.push({x:e.x-4,y:e.y,t:'orb',l:600});
 if(e.c.drop)pickups.push({x:e.x,y:e.y+6,t:e.c.drop,l:1e9});
 if(e.boss){G.flags['boss_'+G.room]=1;shake=14;SFX.boom();ents.forEach(o=>{if(!o.boss&&!o.dead){o.dead=true;burst(o.x,o.y,'#fff',6);}});shots=shots.filter(s=>s.owner==='p');
  const rid=G.room;setTimeout(()=>{if(G&&G.room===rid&&R.bossEvent&&state==='play')runEvent(R.bossEvent);saveGame();},700);}
 checkPuzzle();}
function hitCircle(x,y,r,d){for(const e of ents){if(e.dead||P.hit.has(e))continue;if(Math.hypot(e.x-x,e.y-y)<r+e.r){P.hit.add(e);const l=Math.hypot(e.x-P.x,e.y-P.y)||1;hurtEnemy(e,d,(e.x-P.x)/l,(e.y-P.y)/l);}}}
function hurtHero(d,fx,fy){if(P.inv>0||state!=='play')return;if(god){P.inv=30;return;}G.hp-=d;P.inv=60;const l=Math.hypot(fx,fy)||1;P.kb.x=fx/l*3.5;P.kb.y=fy/l*3.5;SFX.hurt();shake=6;flash=8;
 if(G.hp<=0){G.hp=0;state='over';overSel=0;playMusic(null);SFX.fall();}}

/* ---------- interaction ---------- */
function frontPoint(d){return{x:P.x+P.fx*d,y:P.y+P.fy*d};}
function tryInteract(){const f=frontPoint(12),tx=Math.floor(f.x/T),ty=Math.floor(f.y/T);
 if(grid[ty]&&grid[ty][tx]==='C'){const ch=(R.chests||[]).find(c=>c.x===tx&&c.y===ty);setTile(tx,ty,'c');burst(tx*T+8,ty*T+6,'#ffe070',14);
  if(ch){give(ch.give);if(ch.event)runEvent(ch.event);}saveGame();return true;}
 for(const n of (R.npcs||[])){const nx=n.x*T+8,ny=n.y*T+8;if(Math.hypot(nx-f.x,ny-f.y)<14){talk(n);return true;}}
 return false;}
function talk(n){const lines=(n.lines||[]).map(l=>[n.name,l]);
 const after=()=>{if(n.shop&&n.shop.length){shop={npc:n,i:0};state='shop';}else if(n.inn!=null){confirmBox={text:`하룻밤 ${n.inn}골드입니다. 쉬어 가시겠어요? (체력·정령 회복 + 저장)`,yes:()=>{
   if(G.gold>=n.inn){G.gold-=n.inn;G.hp=G.maxHp;G.sp=100;saveGame();SFX.win();say('푹 쉬었다! 기록을 저장했다.');}else say('골드가 부족하다…');}};state='confirm';}};
 if(n.event&&!G.flags['ev_'+n.event]){const ev=STORY.events[n.event];G.flags['ev_'+n.event]=1;startDlg((ev&&ev.lines)||lines,()=>{if(ev&&ev.give)give(ev.give);saveGame();after();});}
 else startDlg(lines.length?lines:[[n.name,'…']],after);}

/* ---------- hero update ---------- */
function heroUpdate(){const sw=SW[G.sword]||SWORDS[0];
 if(I.dir&&I.dir!==PI.dir){if(I.dir===P.lastTap&&tick-P.lastTapT<14&&P.z===0&&P.atk===0&&!P.spin){P.dash=14;SFX.jump();burst(P.x,P.y+5,'#ddd',5,1);}P.lastTap=I.dir;P.lastTapT=tick;}
 let mx=I.mx,my=I.my;const busy=P.atk>0||P.spin>0;
 if(Math.hypot(mx,my)>.25&&!busy&&!P.dash){if(Math.abs(mx)>Math.abs(my)){P.fx=Math.sign(mx);P.fy=0;}else{P.fx=0;P.fy=Math.sign(my);}}
 let spd=busy&&P.z===0?.45:1.5;if(P.hold>40)spd=.8;
 if(P.dash>0){P.dash--;mx=P.fx;my=P.fy;spd=P.dslash?4:3.2;if(P.dslash)hitCircle(P.x+P.fx*8,P.y-3+P.fy*8,12,sw.dmg*2);if(tick%2)parts.push({x:P.x,y:P.y+4,vx:0,vy:0,l:10,col:'rgba(255,255,255,.6)'});if(!P.dash)P.dslash=0;}
 const mode=P.z>0?'air':'ground';const ox=P.x,oy=P.y;
 const bump=moveBody(P,mx*spd+P.kb.x,my*spd+P.kb.y,5,mode);P.kb.x*=.78;P.kb.y*=.78;
 P.moving=Math.hypot(P.x-ox,P.y-oy)>.2;if(P.moving)P.walkT++;
 // push blocks
 if(bump&&P.z===0&&Math.hypot(mx,my)>.5&&!P.dash){const f=frontPoint(9),tx=Math.floor(f.x/T),ty=Math.floor(f.y/T),c=grid[ty]&&grid[ty][tx];
  if(c==='B'){P.pushT++;if(P.pushT>18){const nx=tx+P.fx,ny=ty+P.fy,nc=grid[ny]&&grid[ny][nx];if(nc==='.'||nc===','||nc==='P'||nc==='w'||nc==='q'){setTile(tx,ty,'.');setTile(nx,ny,nc==='P'?'X':'B');SFX.door();checkPuzzle();}P.pushT=0;}}else P.pushT=0;}else P.pushT=0;
 // jump
 if(pr('j')&&P.z===0&&!P.spin){P.vz=3.1;P.z=.1;SFX.jump();}
 if(P.z>0){P.z+=P.vz;P.vz-=.21;if(P.z<=0){P.z=0;P.vz=0;
   if(P.jatk){P.jatk=false;P.hit=new Set();hitCircle(P.x,P.y,22,Math.ceil(sw.dmg*1.5));burst(P.x,P.y+4,'#fff',12);SFX.big();shake=5;}
   for(let i=0;i<6;i++)parts.push({x:P.x,y:P.y+5,vx:Math.cos(i)*1.2,vy:Math.sin(i)*.4,l:20,col:'rgba(230,220,200,1)',puff:1});
   const c=tileAt(P.x,P.y);if(c==='_'||c==='v'||!free(P.x,P.y,3,'ground')){SFX.fall();burst(P.x,P.y,'#000',10);P.x=P.safe.x;P.y=P.safe.y;hurtHero(1,0,0);}}}
 else if(tick%6===0&&free(P.x,P.y,6,'ground'))P.safe={x:P.x,y:P.y};
 // attack
 if(P.comboT>0)P.comboT--;else P.combo=0;
 if(pr('a')){if(P.z===0&&!P.atk&&!P.spin&&tryInteract()){}
  else if(P.z>0){if(!P.jatk){P.jatk=true;SFX.slash();}}
  else if(P.dash>0&&!P.dslash){P.dslash=1;P.dash=16;P.hit=new Set();SFX.big();}
  else if(P.atk<=sw.speed*.35&&!P.spin){P.combo=P.comboT>0?(P.combo+1)%sw.combo:0;P.atk=P.atkLen=sw.speed;P.comboT=sw.speed+16;P.hit=new Set();
   const fin=P.combo===sw.combo-1;if(fin){SFX.big();P.kb.x+=P.fx*1.5;P.kb.y+=P.fy*1.5;}else SFX.slash();}}
 if(I.a&&!P.atk&&P.z===0&&!P.dash)P.hold++;else if(!I.a){if(P.hold>40){P.spin=26;P.hit=new Set();SFX.big();}P.hold=0;}
 if(P.atk>0){P.atk--;const fin=P.combo===sw.combo-1,rr=sw.reach*(fin?.75:.62),dd=sw.reach*.62;if(P.atk<P.atkLen-2)hitCircle(P.x+P.fx*dd,P.y-3+P.fy*dd,rr,sw.dmg*(fin?2:1));}
 if(P.spin>0){P.spin--;hitCircle(P.x,P.y,sw.reach+6,sw.dmg*2);if(P.spin%6===0)SFX.slash();}
 if(P.inv>0)P.inv--;
 if(P.z===0){const tx=Math.floor(P.x/T),ty=Math.floor(P.y/T);if(grid[ty]&&grid[ty][tx]==='s'){setTile(tx,ty,'q');SFX.door();checkPuzzle();}}
 if(pr('i'))useSub();
 if(pr('s'))summon();
 if(pr('q')&&G.spirits.length){G.spirit=G.spirits[(G.spirits.indexOf(G.spirit)+1)%G.spirits.length];spirit=null;say(SP[G.spirit].name);SFX.select();}
 if(pr('e')&&G.swords.length>1){G.sword=G.swords[(G.swords.indexOf(G.sword)+1)%G.swords.length];say(SW[G.sword].name+' 장비');SFX.select();}
 // edges / warps
 const ex=R.exits||{};
 if(P.x>W-5&&ex.right)return loadRoom(ex.right,8,P.y);if(P.x<5&&ex.left)return loadRoom(ex.left,W-8,P.y);
 if(P.y<5&&ex.up)return loadRoom(ex.up,P.x,H-9);if(P.y>H-5&&ex.down)return loadRoom(ex.down,P.x,9);
 P.x=Math.max(4,Math.min(W-4,P.x));P.y=Math.max(4,Math.min(H-4,P.y));
 const tc=tileAt(P.x,P.y);if(tc==='>'){if(!P.warpLock&&P.z===0){const tx=Math.floor(P.x/T),ty=Math.floor(P.y/T);const w=(R.warps||[]).find(w=>w.x===tx&&w.y===ty)||(R.warps||[])[0];
   if(w&&ROOMS[w.to]){SFX.door();return loadRoom(w.to,w.tx*T+8,w.ty*T+8);}}}else P.warpLock=false;}
function useSub(){const id=G.sub;if(!id||!G.subs[id]){say('보조무기가 없다');return;}const w=WP[id];G.subs[id]--;
 const s={owner:'p',w,x:P.x+P.fx*6,y:P.y-4+P.fy*6,vx:P.fx*w.speed,vy:P.fy*w.speed,z:0,vz:0,life:w.life||40,t:0,r:4,hit:new Set()};
 if(w.type==='bomb'){s.vz=2.4;s.z=6;}shots.push(s);SFX.slash();
 if(G.subs[id]<=0){delete G.subs[id];say(w.name+'이(가) 부서졌다!');SFX.brk();G.sub=Object.keys(G.subs)[0]||null;}}
function explode(x,y,w){SFX.boom();shake=10;burst(x,y,'#ffa030',30,3.5);burst(x,y,'#555',14,2);const rad=w.radius||30;
 for(const e of ents)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<rad+e.r)hurtEnemy(e,w.dmg,(e.x-x)/rad,(e.y-y)/rad);
 if(w.breaks)for(let ty=0;ty<CH;ty++)for(let tx=0;tx<CW;tx++)if(grid[ty][tx]==='K'&&Math.hypot(tx*T+8-x,ty*T+8-y)<rad+8){setTile(tx,ty,'.');burst(tx*T+8,ty*T+8,'#999',16);SFX.brk();saveGame();}}
function shotsUpdate(){for(const s of shots){s.t++;
 if(s.owner==='p'){const w=s.w;
  if(w.type==='bomb'){s.x+=s.vx;s.y+=s.vy;s.vx*=.95;s.vy*=.95;s.z+=s.vz;s.vz-=.2;if(s.z<0){s.z=0;s.vz*=-.4;}if(!free(s.x,s.y,2,'fly')){s.x-=s.vx;s.y-=s.vy;s.vx*=-.3;s.vy*=-.3;}if(s.t>=s.life){explode(s.x,s.y,w);s.dead=1;}continue;}
  if(w.type==='boomerang'&&s.t>s.life/2){const dx=P.x-s.x,dy=P.y-4-s.y,l=Math.hypot(dx,dy)||1;s.vx=dx/l*w.speed;s.vy=dy/l*w.speed;if(l<8)s.dead=1;}
  s.x+=s.vx;s.y+=s.vy;if(w.type!=='boomerang'&&(s.t>s.life||!free(s.x,s.y,1,'fly'))){s.dead=1;burst(s.x,s.y,'#ccc',3);}if(s.t>s.life*3)s.dead=1;
  for(const e of ents)if(!e.dead&&!s.hit.has(e)&&Math.hypot(e.x-s.x,e.y-s.y)<e.r+s.r){s.hit.add(e);hurtEnemy(e,w.dmg,Math.sign(s.vx),Math.sign(s.vy));if(!w.pierce){s.dead=1;break;}}}
 else{if(s.kind==='fall'){s.t2--;if(s.t2<=0){s.dead=1;burst(s.x,s.y,'#887',10);SFX.hit();if(Math.hypot(P.x-s.x,P.y-s.y)<12&&P.z<8)hurtHero(s.dmg,P.x-s.x,P.y-s.y);}continue;}
  s.x+=s.vx;s.y+=s.vy;if(s.t>240||s.x<-10||s.x>W+10||s.y<-10||s.y>H+10||(!s.ghost&&!free(s.x,s.y,1,'fly')))s.dead=1;
  if(Math.hypot(P.x-s.x,P.y-4-s.y)<s.r+5&&P.z<10){hurtHero(s.dmg,s.vx,s.vy);s.dead=1;}}}
 shots=shots.filter(s=>!s.dead);}

/* ---------- spirit ---------- */
function summon(){if(spirit){burst(spirit.x,spirit.y,'#fff',10);spirit=null;return;}
 if(!G.spirit){say('아직 정령이 없다');return;}const s=SP[G.spirit];if(G.sp<s.cost){say('정령 게이지가 부족하다…');tone(120,.15);return;}
 G.sp-=s.cost;spirit={s,x:P.x,y:P.y-14,cd:0,ht:0};SFX.spirit();burst(P.x,P.y-10,s.color,20,2.5);say(s.name+' 소환!');}
function nearestTile(chars,maxD){let best=null,bd=1e9;for(let y=0;y<CH;y++)for(let x=0;x<CW;x++)if(chars.includes(grid[y][x])){const gx=x*T+8,gy=y*T+8,d=Math.hypot(gx-P.x,gy-P.y);if(d<maxD&&d<bd){bd=d;best={x:gx,y:gy,tx:x,ty:y};}}return best;}
function vineLine(g){const horiz=Math.abs(g.x-P.x)>Math.abs(g.y-P.y),sx=horiz?(Math.sign(g.x-P.x)||1):0,sy=horiz?0:(Math.sign(g.y-P.y)||1);
 let x=g.tx,y=g.ty;while(grid[y]&&grid[y][x]==='v'){setTile(x,y,'=');burst(x*T+8,y*T+8,'#6d4',4);x+=sx;y+=sy;}SFX.pick();}
function spiritUpdate(){const sp=spirit;if(!sp)return;const s=sp.s,ab=s.abilities||[];G.sp-=s.drain;if(G.sp<=0){G.sp=0;burst(sp.x,sp.y,'#fff',10);spirit=null;return;}
 sp.cd--;let tx=P.x-P.fx*16,ty=P.y-18,goal=null,act=null;
 if(ab.includes('extinguish')&&(goal=nearestTile('F',140)))act=g=>{setTile(g.tx,g.ty,'.');burst(g.x,g.y,'#bdf',14);SFX.spirit();};
 else if(ab.includes('ignite')&&(goal=nearestTile('t',140)))act=g=>{setTile(g.tx,g.ty,'L');burst(g.x,g.y,'#fc4',14);SFX.pick();};
 else if(ab.includes('switch')&&(goal=nearestTile('Ss',170)))act=g=>{setTile(g.tx,g.ty,grid[g.ty][g.tx]==='S'?'Q':'q');burst(g.x,g.y,'#a8f',14);SFX.door();};
 else if(ab.includes('vine')&&(goal=nearestTile('v',90)))act=vineLine;
 if(goal){tx=goal.x;ty=goal.y-6;if(Math.hypot(goal.x-sp.x,goal.y-6-sp.y)<8){act(goal);checkPuzzle();saveGame();}}
 else{let tgt=null,bd=150;for(const e of ents){if(e.dead||e.spawn>0)continue;const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<bd){bd=d;tgt=e;}}
  if(tgt&&(ab.includes('attack')||ab.includes('devour'))){tx=tgt.x;ty=tgt.y-6;if(Math.hypot(tgt.x-sp.x,tgt.y-6-sp.y)<tgt.r+8&&sp.cd<=0){sp.cd=32;

   컬러 외곽선을 입혀 오프스크린 캔버스에 미리 구워(bake) 둡니다. */
function hex2rgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255];}

const MATS=[null],MI={};
function mat(hex,flat){const k=hex+(flat?'f':'');if(MI[k])return MI[k];MATS.push({r:ramp(hex),flat:!!flat,c:hex2rgb(hex)});return MI[k]=MATS.length-1;}
function spr(w,h){return{w,h,m:new Uint8Array(w*h)};}
function sp(s,x,y,k){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<s.w&&y<s.h)s.m[y*s.w+x]=k;}

function poly(s,pts,k){let a=1e9,b=-1e9;for(const p of pts){a=Math.min(a,p[1]);b=Math.max(b,p[1]);}
 for(let y=Math.floor(a);y<=Math.ceil(b);y++){const yc=y+.5,xs=[];for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];if((p[1]<=yc&&q[1]>yc)||(q[1]<=yc&&p[1]>yc))xs.push(p[0]+(yc-p[1])/(q[1]-p[1])*(q[0]-p[0]));}

  if(M.flat)col=M.c;else{const u=run(x,y,0,-1,k),dn=run(x,y,0,1,k),l=run(x,y,-1,0,k),r=run(x,y,1,0,k);
