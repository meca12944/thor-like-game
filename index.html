/* ---------- tiles ---------- */
const GROUND_BLOCK='#THnA~DFtLSQBXKCco_v ';const AIR_PASS='o_v';const FLY_BLOCK='#THnADtLSQBXKCc ';
function tileAt(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=CW||ty>=CH)return null;return grid[ty][tx];}
function setTile(tx,ty,c){if(grid[ty]&&grid[ty][tx]!==undefined){grid[ty][tx]=c;bgDirty=true;}}
function blocked(c,mode){if(c===null)return false;if(mode==='fly')return FLY_BLOCK.includes(c);if(mode==='air')return GROUND_BLOCK.includes(c)&&!AIR_PASS.includes(c);return GROUND_BLOCK.includes(c);}
function free(x,y,r,mode){return!(blocked(tileAt(x-r,y-r),mode)||blocked(tileAt(x+r-.01,y-r),mode)||blocked(tileAt(x-r,y+r-.01),mode)||blocked(tileAt(x+r-.01,y+r-.01),mode));}
function moveBody(o,dx,dy,r,mode){let b=false;if(free(o.x+dx,o.y,r,mode))o.x+=dx;else b=true;if(free(o.x,o.y+dy,r,mode))o.y+=dy;else b=true;return b;}
function countT(ch){let n=0;for(const r of grid)for(const c of r)if(ch.includes(c))n++;return n;}
function checkPuzzle(silent){const pz=R.puzzle;if(!pz||!pz.length||!countT('D'))return;
 const ok=pz.every(p=>p==='torches'?!countT('t'):p==='switches'?!countT('sS'):p==='plates'?!countT('P'):p==='fire'?!countT('F'):p==='enemies'?!ents.some(e=>!e.dead):true);
 if(ok){for(let y=0;y<CH;y++)for(let x=0;x<CW;x++)if(grid[y][x]==='D')setTile(x,y,'.');if(!silent){SFX.door();say('어딘가에서 문이 열렸다!');shake=6;}saveGame();}}

 if(I.dir&&I.dir!==PI.dir){if(I.dir===P.lastTap&&tick-P.lastTapT<14&&P.z===0&&P.atk===0&&!P.spin){P.dash=14;SFX.jump();burst(P.x,P.y+5,'#ddd',5,1);}P.lastTap=I.dir;P.lastTapT=tick;}

 else if(tick%6===0&&free(P.x,P.y,6,'ground'))P.safe={x:P.x,y:P.y};

function randFloor(minD){for(let i=0;i<80;i++){const x=1+(Math.random()*(CW-2)|0),y=1+(Math.random()*(CH-2)|0);if(!GROUND_BLOCK.includes(grid[y][x])){const gx=x*T+8,gy=y*T+8;if(Math.hypot(gx-P.x,gy-P.y)>minD)return{x:gx,y:gy};}}return{x:W/2,y:H/2};}

 switch(c.ai){
 case'hop':if(e.timer%80<26){if(e.timer%80===0){const a=Math.random()*6.28;e.vx=Math.cos(a);e.vy=Math.sin(a);if(d<90){e.vx=dx/d;e.vy=dy/d;}}vx=e.vx*c.spd*2.2;vy=e.vy*c.spd*2.2;}break;
 case'fly':vx=dx/d*c.spd+Math.cos(e.timer*.09)*1.1;vy=dy/d*c.spd+Math.sin(e.timer*.12)*1.1;if(d>160){vx*=.2;vy*=.2;}break;
 case'shoot':if(d<60){vx=-dx/d*c.spd;vy=-dy/d*c.spd;}else if(d>110){vx=dx/d*c.spd;vy=dy/d*c.spd;}if(e.timer%110===0&&d<170)eShot(e,Math.atan2(dy,dx),1.8,c.dmg,'orb');break;
 case'boss_golem':{const cyc=e.timer%240,sp=c.spd*(ph2?1.5:1);
  if(cyc<140){vx=dx/d*sp;vy=dy/d*sp;}else if(cyc===140){e.cdx=dx/d;e.cdy=dy/d;SFX.roar();}else if(cyc<170){e.shk=1;}else if(cyc<205){e.shk=0;vx=e.cdx*3.4;vy=e.cdy*3.4;if(tick%4==0)burst(e.x,e.y+10,'#776',3);}
  else if(cyc===215){shake=8;SFX.boom();const n=ph2?7:4;for(let i=0;i<n;i++){const p=i===0?{x:P.x,y:P.y}:randFloor(0);shots.push({owner:'e',kind:'fall',x:p.x,y:p.y,t:0,t2:50+i*6,dmg:2,r:8});}}
  break;}
 case'boss_wyvern':{e.a+=.018;const cyc=e.timer%300;
  if(cyc<230){const tx=W/2+Math.cos(e.a)*100,ty=H/2-10+Math.sin(e.a*2)*50;vx=(tx-e.x)*.03;vy=(ty-e.y)*.03;
   if(e.timer%(ph2?55:80)===0){const a=Math.atan2(dy,dx);for(let k=-1;k<=1;k++)eShot(e,a+k*.3,2.1,2,'fire',true);tone(200,.2,'sawtooth',.1,90);}}
  else if(cyc===230){e.cdx=dx/d;e.cdy=dy/d;SFX.roar();}else if(cyc<270){vx=e.cdx*3.6;vy=e.cdy*3.6;}

  if(cyc===0){burst(e.x,e.y,'#a6f',20);const p=randFloor(90);e.x=p.x;e.y=p.y;burst(e.x,e.y,'#a6f',20);SFX.spirit();

  else if(cyc===60||(ph2&&cyc===100)){const n=ph2?14:10;for(let i=0;i<n;i++)eShot(e,i/n*6.283+e.timer,1.5,2,'orb',true);tone(150,.4,'sawtooth',.12,60);}
  else if(cyc===140){for(let k=-2;k<=2;k++)eShot(e,Math.atan2(dy,dx)+k*.18,2.4,2,'fire',true);}
  else{vx=Math.cos(e.timer*.03)*c.spd;vy=Math.sin(e.timer*.04)*c.spd;}

  if(p.t==='heart')heart(p.x-4,p.y-5+b,1);else if(p.t==='gold'){px(p.x-3,p.y-3+b,6,6,'#d4a020');px(p.x-2,p.y-2+b,4,4,'#ffd84a');px(p.x-1,p.y-2+b,1,2,'#fff');}
  else if(p.t==='orb'){px(p.x-3,p.y-3+b,6,6,'#40a0ff');px(p.x-1,p.y-2+b,2,2,'#fff');}else if(p.t==='heartup'){heart(p.x-4,p.y-5+b,1);ctx.strokeStyle='#fd4';ctx.lineWidth=1;ctx.strokeRect(p.x-6.5,p.y-7.5+b,13,12);}}
 for(const s of shots)if(s.kind==='fall'){const k=1-Math.max(0,s.t2)/80;ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(s.x,s.y,4+k*6,2+k*3,0,0,7);ctx.fill();if(s.t2<15)px(s.x-5,s.y-s.t2*6-8,10,9,'#7a7a6a');}
 const list=[];ents.forEach(e=>list.push({y:e.y,f:()=>drawEnemy(e)}));(R.npcs||[]).forEach(n=>list.push({y:n.y*T+8,f:()=>drawNPC(n)}));list.push({y:P.y,f:drawHero});
 list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
 for(const s of shots){if(s.kind==='fall')continue;if(s.owner==='p'){const w=s.w;if(w.type==='bomb'){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(s.x,s.y+3,3,1.5,0,0,7);ctx.fill();icon(w.id,s.x-5,s.y-6-s.z);if(s.life-s.t<15&&tick%4<2){ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(s.x,s.y-2-s.z,5,0,7);ctx.fill();}}
   else if(w.type==='boomerang'){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.t*.5);px(-4,-1,8,2,w.color);px(-1,-4,2,8,w.color);ctx.restore();}
   else{const a=Math.atan2(s.vy,s.vx);ctx.strokeStyle=w.color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x-Math.cos(a)*6,s.y-Math.sin(a)*6);ctx.lineTo(s.x+Math.cos(a)*3,s.y+Math.sin(a)*3);ctx.stroke();}}
  else{const c=s.kind==='fire'?['#f60','#fd4']:s.kind==='bone'?['#ddd','#fff']:['#b040ff','#f8f'];px(s.x-3,s.y-3,6,6,c[0]);px(s.x-1,s.y-1,2,2,c[1]);}}
 if(spirit){const s=spirit.s,x=spirit.x,y=spirit.y+Math.sin(tick*.15)*2;ctx.fillStyle=s.color+'44';ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill();
  px(x-4,y-4,8,8,s.color);px(x-3,y-7,6,3,s.color);px(x-2,y-2,1,2,'#fff');px(x+1,y-2,1,2,'#fff');const w=Math.sin(tick*.3)*2;px(x-7,y-3+w,3,2,s.color);px(x+4,y-3-w,3,2,s.color);}
 for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.l/14));px(p.x,p.y,2,2,p.col);}ctx.globalAlpha=1;
 for(const f of floats){ctx.globalAlpha=Math.min(1,f.l/15);txt(f.s,f.x,f.y,f.c,8);}ctx.globalAlpha=1;
 if(R.theme==='cave'||R.theme==='temple'){const g=cx.createRadialGradient(P.x,P.y,36,P.x,P.y,170);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,12,.6)');cx.fillStyle=g;cx.fillRect(-10,-10,W+20,H+20);}
 cx.setTransform(RS,0,0,RS,0,0);
 if(flash)px(0,0,W,H,'rgba(255,0,0,'+(flash*.03)+')');
 drawHUD();
 if(state==='menu')drawMenu();if(state==='shop')drawShop();if(state==='confirm')drawConfirm();
 if(state==='over'){px(0,0,W,H,'rgba(0,0,0,.72)');txt('게임 오버',W/2,96,'#ff4455',26);txt(STORY.hero+'의 여정은 여기서 멈추었다…',W/2,120,'#ddd',10);
  ['마지막 기록부터','타이틀로'].forEach((o,i)=>txt((i===overSel?'▶ ':'  ')+o,W/2,156+i*16,i===overSel?'#fff':'#888',11));}
 if(state==='win'&&!dlg){px(0,0,W,H,'rgba(0,0,20,.82)');txt('THE END',W/2,80,'#ffd860',26);txt('에리오스 섬에 평화가 돌아왔다',W/2,106,'#fff',11);txt(`최대 체력 ${G.maxHp/2}칸 · 골드 ${G.gold} · 정령 ${G.spirits.length}/${SPIRITS.length} · 검 ${G.swords.length}/${SWORDS.length}`,W/2,128,'#aac',9);if(tick%60<40)txt('공격 버튼으로 타이틀로',W/2,190,'#ccc',10);}
 if(dlg)drawDlg();
 if(joy.id!==null){const r=cv.getBoundingClientRect(),s=1/cssScale;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc((joy.ox-r.left)*s,(joy.oy-r.top)*s,46*s,0,7);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc((joy.cx-r.left)*s,(joy.cy-r.top)*s,18*s,0,7);ctx.fill();}}
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;let n=0;while(acc>=1000/60&&n<4){update();acc-=1000/60;n++;}draw();requestAnimationFrame(loop);}
resize();requestAnimationFrame(loop);
/* hidden debug hook (자동 테스트용, UI에 노출되지 않음) */
Object.defineProperty(window,'__dbg',{enumerable:false,value:{
 get G(){return G},get P(){return P},get state(){return state},get room(){return G&&G.room},get ents(){return ents},get dlg(){return dlg},get spirit(){return spirit},get shop(){return shop},
 grid:()=>grid.map(r=>r.join('')),god:v=>{god=v!==false;},warp:(id,tx,ty)=>{loadRoom(id,tx*T+8,ty*T+8);},pos:(x,y,fx,fy)=>{P.x=x*T+8;P.y=y*T+8;if(fx!=null){P.fx=fx;P.fy=fy;}},
 give:g=>give(g),skipDlg:()=>{let n=0;while(dlg&&n++<50){const d=dlg.onDone;dlg=null;d&&d();}},rooms:()=>Object.keys(ROOMS)}});
</script></body></html>
