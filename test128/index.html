<script>/* 휴대폰 옛 판 막기 (주인 10-23 「모바일이라 접속하니 옛날버전」): Pages가 모든 파일을 10분 저장해 두므로, 배포 시각을 주소 뒤에 붙여 새 배포 = 새 주소.
 __v(u) 는 js·지도·그림 주소에 ?v=배포시각 을 붙인다 (index.html 은 Pages 10분 저장을 피할 수 없어서 index 가 바뀌는 순간부터 나머지가 모두 새로 받아짐). */
window.__BUILD=(Date.parse(document.lastModified)||0).toString(36);
window.__v=function(u){return u+(u.indexOf('?')<0?'?':'&')+'v='+window.__BUILD;};
window.__js=function(u){document.write('<script src="'+window.__v(u)+'"><\/script>');};</script>

// ---------- collision ----------
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
function blockedPt(x,y){const b=LVL.bounds;if(x<b[0]||x>b[2]||y<b[1]||y>b[3])return true;
 for(const o of LVL.blocks){if(o.poly&&inPoly(x,y,o.poly))return true;if(o.ellipse){const[ex,ey,rx,ry]=o.ellipse;const dx=(x-ex)/rx,dy=(y-ey)/ry;if(dx*dx+dy*dy<1)return true;}}return false;}
function blocked(x,y,r){return blockedPt(x,y)||blockedPt(x-r,y)||blockedPt(x+r,y)||blockedPt(x,y-r*.4)||blockedPt(x,y+r*.4);}
function moveCol(e,dx,dy,r){let ok=true;if(dx){if(!blocked(e.x+dx,e.y,r))e.x+=dx;else ok=false;}
 if(dy){if(!blocked(e.x,e.y+dy,r))e.y+=dy;else ok=false;}return ok;}
