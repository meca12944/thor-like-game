<div id="stick"><div id="knob"></div></div>
<div class="btn" id="bAtk" style="right:calc(24px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom));width:76px;height:76px">공격</div>

<div id="res"><div class="box"><h1 id="rTitle">던전 클리어!</h1><div id="rank">S</div>
<table id="rTab"></table><div id="cards"></div><button id="again">다시 도전</button></div></div>
<script>
// Test dungeon, DNF-style room clears (owner 10-20): room 1-3 -> boss room. Entering a room locks the gate, killing every monster opens it,
// the boss kill shows the result screen (time / combo / damage taken -> rank, pick one reward card). Town and field stay top-down.
// Player = linette.html (same atlas, attacks, trails, hit-stop); monsters reuse test128 art: slime.png (3 frames: green, green squash, blue),
// champ_boar.png (6 frames: charge 0-3, idle 4, stun 5, faces left natively), dungeon tiles = assets/world/tiles_dungeon.png (16px, drawn x3).
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let A,SH=[],VW=480,VH=270,SC=1;
function resize(){const d=devicePixelRatio||1,w=innerWidth*d,h=innerHeight*d;SC=Math.max(1,Math.floor(Math.min(w/360,h/300)));VW=Math.ceil(w/SC);VH=Math.ceil(h/SC);cv.width=VW;cv.height=VH;ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);resize();
let FX=null,FIRE=null,IMG={};
const CIRC=[[[115,143,115,46,57,24],[463,143,115,46,57,24]],[[345,49,115,46,57,24],[693,49,115,46,57,24]],[[230,96,115,46,57,24],[578,96,115,46,57,24]]];
const FC=[0,85,170].flatMap(y=>[0,124,248,372,496].map(x=>[x,y,123,84,60,63])),RING=[-1,-2.5,57,22.5],A0=Math.PI/2,LAP0=2,LAPEND=26,POST=[4,12,22,34];
function blitC(img,c,x,y){ctx.drawImage(img,c[0],c[1],c[2],c[3],x-c[4],y-c[5],c[2],c[3]);}
function castFx(front,sx,sy){
  if(!FX||P.skill==null)return;const casting=P.st==='cast',t=P.t,cx=sx+RING[0],cy=sy+RING[1],rx=RING[2],ry=RING[3];
  if(!casting&&!P.cf)return;
  const p=casting?(t-LAP0)/(LAPEND-LAP0):2,clipHalf=()=>{ctx.beginPath();ctx.rect(cx-rx-30,front?cy:cy-ry*3-60,rx*2+60,ry*3+60);ctx.clip();},
        sector=sw=>{ctx.beginPath();ctx.moveTo(cx,cy);ctx.ellipse(cx,cy,rx+12,ry+12,0,A0,A0+sw);ctx.closePath();ctx.clip();};
  if(!front&&casting){ctx.save();if(p<1){if(p<=0){ctx.restore();}else{sector(p*Math.PI*2);blitC(FX,CIRC[P.skill][0],sx,sy);ctx.restore();}}else{const T=total(clip(P.clip));blitC(FX,CIRC[P.skill][t>T-10?1:0],sx,sy);ctx.restore();}}
  if(casting&&p>0&&p<1){ctx.save();clipHalf();sector(p*Math.PI*2);blitC(FIRE,FC[P.skill*5],sx,sy);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.35;blitC(FIRE,FC[P.skill*5],sx,sy);ctx.restore();}
  else if(p>=1){if(!P.cf)P.cf={t0:P.gt};const k=POST.findIndex(v=>P.gt-P.cf.t0<v);if(k<0){if(!casting)P.cf=null;return;}ctx.save();clipHalf();blitC(FIRE,FC[P.skill*5+1+k],sx,sy);ctx.restore();}
}
// ---------------- rooms ----------------
const TS=48,RW=960,RH=336,DOOR=[120,216];   // tile size on screen, floor size in px (feet coordinates), door opening on the right wall (y range)
const TI={floor:0,floor_crack:1,floor_moss:2,floor_moss2:3,floor2:5,wall:6,wall_moss:7,wall_vine:8,wall_crack:10,wall_moss2:12,torch:25,rune:31,walltop_dark:33,carpet:29};
const ROOMS=[
  {name:'1구역',mobs:[['g',560,120],['g',700,230],['g',820,150]]},
  {name:'2구역',mobs:[['g',420,90],['g',520,260],['g',700,110],['g',760,250],['b',860,170]]},
  {name:'3구역',pillars:[[330,80],[330,260],[640,80],[640,260]],mobs:[['g',460,170],['b',560,90],['b',560,250],['g',780,120],['g',780,220],['b',880,170]]},
  {name:'보스',boss:1,mobs:[]}];
const hash=(x,y)=>((x*73856093)^(y*19349663))>>>0;
function roomCanvas(R){   // pre-rendered room: 1 tile wall left/right/bottom, 3 rows on top (dark top + 2 rows of wall face)
  const cols=RW/TS+2,rows=RH/TS+4,c=document.createElement('canvas');c.width=cols*TS;c.height=rows*TS;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const put=(n,x,y)=>{const i=TI[n];g.drawImage(IMG.tiles,(i%8)*16,(i/8|0)*16,16,16,x*TS,y*TS,TS,TS);};
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const fy=y-3,fx=x-1,inFloor=fx>=0&&fx<RW/TS&&fy>=0&&fy<RH/TS,doorR=x===cols-1&&fy*TS>=DOOR[0]&&fy*TS<DOOR[1],doorL=x===0&&fy*TS>=DOOR[0]&&fy*TS<DOOR[1];
    if(inFloor||doorR&&!R.boss||doorL&&R.prev){put(['floor','floor','floor','floor_crack','floor_moss','floor2','floor','floor_moss2'][hash(x,y)%8],x,y);continue;}
    if(y===1||y===2){if(x>0&&x<cols-1){put(y===2&&x%4===2?'torch':['wall','wall','wall_moss','wall_vine','wall_crack','wall_moss2'][hash(x,y)%6],x,y);if(y===2){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x*TS,y*TS+TS-4,TS,4);}continue;}}
    put('walltop_dark',x,y);g.fillStyle='rgba(8,10,14,.6)';g.fillRect(x*TS,y*TS,TS,TS);}
  if(R.boss){g.fillStyle='rgba(120,20,10,.18)';g.fillRect(TS,3*TS,RW,RH);}   // boss room: reddish floor
  return c;}
// ---------------- player (linette.html) ----------------
const P={x:0,y:0,face:'right',lastH:'right',st:'idle',t:0,clip:null,combo:0,queued:false,run:false,dead:false,hp:150,maxHp:150,inv:0,kb:[0,0],skillCd:0};
const K={};let joy={x:0,y:0};
addEventListener('keydown',e=>{if(e.repeat)return;K[e.code]=1;if(e.code==='KeyJ')attack();if(e.code==='KeyK')dash();if(e.code==='KeyL')P.run=!P.run,ui();if(e.code==='KeyU')cast();if(e.code==='Space')jump();});
addEventListener('keyup',e=>{K[e.code]=0;});
function tap(id,f){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();f();});}
tap('bAtk',attack);tap('bDash',dash);tap('bRun',()=>{P.run=!P.run;ui();});tap('bCast',cast);tap('bJump',jump);
function ui(){document.getElementById('bRun').classList.toggle('on',P.run);}
{const st=document.getElementById('stick'),kn=document.getElementById('knob');let id=null;
 const mv=e=>{const r=st.getBoundingClientRect();let dx=e.clientX-r.left-60,dy=e.clientY-r.top-60;const m=Math.hypot(dx,dy),R=44;if(m>R){dx*=R/m;dy*=R/m;}kn.style.left=38+dx+'px';kn.style.top=38+dy+'px';joy={x:dx/R,y:dy/R};};
 st.addEventListener('pointerdown',e=>{id=e.pointerId;st.setPointerCapture(id);mv(e);});st.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e);});
 const up=e=>{if(e.pointerId!==id)return;id=null;kn.style.left=kn.style.top='38px';joy={x:0,y:0};};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);}
const clip=n=>A.anims[n];
const total=L=>L.reduce((s,e)=>s+e[2],0);
function frameAt(L,t,loop){if(loop)t%=total(L);for(const e of L){if(t<e[2])return e;t-=e[2];}return L[L.length-1];}
function atkDir(){return P.face==='right'||P.face==='left'?P.face:P.face==='down'?(P.lastH==='left'?'downl':'down'):(P.lastH==='left'?'upl':'up');}
function start(st,name){P.st=st;P.t=0;P.clip=name;}
const busy=()=>P.dead||G.mode!=='play';
function attack(){if(busy())return;if(P.st==='atk'){P.queued=true;return;}if(P.st==='dash'||P.st==='hurt')return;P.combo=1;start('atk','atk1_'+atkDir());}
function dash(){if(busy()||P.st==='atk'||P.st==='dash')return;start('dash','dash_'+atkDir());P.inv=Math.max(P.inv,18);}   // dash = short dodge (i-frames)
function cast(){if(busy()||P.skillCd>0||P.st!=='idle'&&P.st!=='move')return;P.skill=((P.skill??-1)+1)%3;P.cf=null;P.skillCd=300;start('cast','cast_'+atkDir());}
function jump(){if(busy()||P.st!=='idle'&&P.st!=='move')return;start('jump','jump_'+atkDir());}
const DV={down:[0,1],up:[0,-1],right:[1,0],left:[-1,0],downl:[0,1],upl:[0,-1]};
function hurtP(dmg,kx,ky){if(P.dead||P.inv>0||G.mode!=='play')return;P.hp=Math.max(0,P.hp-dmg);G.taken+=dmg;P.inv=50;P.kb=[kx,ky];P.queued=false;SHAKE=Math.max(SHAKE,3);
  POPS.push({x:P.x,y:P.y-120,v:dmg,a:0,col:'255,90,80'});
  if(P.hp<=0){P.dead=true;start('death','death_'+P.lastH);G.endT=110;}else start('hurt','hurt_'+P.lastH);}
function blocked(x,y,r){if(x<r||x>RW-r||y<r*0.5||y>RH-4){if(G.open&&!ROOM.boss&&x>RW-r&&y>DOOR[0]+8&&y<DOOR[1]-8&&x<RW+40)return false;return true;}
  for(const p of ROOM.pillars||[])if(Math.hypot((x-p[0])/1.6,y-p[1])<18+r*0.4)return true;return false;}
function moveP(dx,dy){if(!blocked(P.x+dx,P.y,14))P.x+=dx;if(!blocked(P.x,P.y+dy,14))P.y+=dy;}
function stepP(ix,iy,moving){
  if(P.inv>0)P.inv--;if(P.skillCd>0)P.skillCd--;
  if(P.kb[0]||P.kb[1]){moveP(P.kb[0],P.kb[1]);P.kb=[P.kb[0]*0.82,P.kb[1]*0.82];if(Math.abs(P.kb[0])+Math.abs(P.kb[1])<0.2)P.kb=[0,0];}
  if(P.st==='idle'||P.st==='move'){
    if(moving){if(Math.abs(ix)>=Math.abs(iy)){P.face=ix>0?'right':'left';P.lastH=P.face;}else{P.face=iy>0?'down':'up';if(Math.abs(ix)>0.3)P.lastH=ix>0?'right':'left';}
      const sp=P.run?2.2:1.2;moveP(ix*sp,iy*sp);const n=(P.run?'run_':'walk_')+atkDir();if(P.st!=='move'||P.clip!==n){P.st='move';P.clip=n;}}
    else if(P.st!=='idle'||P.clip!=='idle_'+atkDir())start('idle','idle_'+atkDir());
  }else{
    const L=clip(P.clip),T=total(L);
    if(P.st==='jump')moveP(ix*(P.run?1.6:0.9),iy*(P.run?1.6:0.9));
    if(P.st==='dash'){const v=DV[P.face];const k=1-P.t/T;moveP(v[0]*5*k,v[1]*5*k);}
    if(P.st==='cast'&&P.t===LAPEND)skillBlast();
    if(P.st==='atk'){const lt=tmeta(P.clip);if(lt){const tl=L.slice(0,lt.frame).reduce((s,e)=>s+e[2],0),H=HIT[P.combo-1];if(P.t>tl-4&&P.t<=tl)moveP(lt.dir[0]*H.push/4,lt.dir[1]*H.push/4);if(P.t===tl)strike(P.clip,P.combo-1);}
      const lt2=A.thrust[P.clip],tl2=lt2?L.slice(0,lt2.frame+1).reduce((s,e)=>s+e[2],0):T;
      if(P.queued&&P.combo<3&&P.t>=tl2){P.queued=false;P.combo++;start('atk','atk'+P.combo+'_'+atkDir());return;}}
    if(P.t>=T){if(P.st==='death'){P.t=T;return;}P.queued=false;start('idle','idle_'+atkDir());}
  }}
// hit feel = linette.html; targets are the room's monsters (centre = feet - h/2, radius r)
const VERT={down:1,downl:1,up:-1,upl:-1};
function tmeta(n){const m=A.thrust[n];if(!m)return null;const d=n.split('_')[1],v=VERT[d];if(!v)return m;
  const tx=m.tip[0]*0.35,ty=v>0?-34:-96,o=m.tip2?6:0;return {...m,dir:[0,v],tip:[tx-o,ty],tip2:m.tip2?[tx+o,ty]:null};}
const HIT=[{push:8,stop:4,shake:1.5,dmg:12},{push:10,stop:5,shake:2,dmg:14},{push:18,stop:9,shake:4,dmg:30}];
let SHAKE=0,FLASH=0,WAVES=[],POPS=[],FXS=[];
function strike(n,hi){const m=tmeta(n);if(!m)return;const H=HIT[hi];
  // hit test on the floor plane (DNF-style depth band): from the feet along the thrust to the tip + trail, so short monsters get hit too
  const [dx,dy]=m.dir,reach=(m.big?100:74),fwd=VERT[n.split('_')[1]]?44:Math.abs(m.tip[0]);let any=false;
  if(hi===2)WAVES.push({x:P.x+m.tip[0]+dx*reach*.7,y:P.y+m.tip[1]+dy*reach*.7,a:0});
  for(const E of MOBS){if(E.dead||E.st==='spawn')continue;const rx=E.x-P.x,ry=E.y-P.y,along=rx*dx+ry*dy,perp=Math.abs(rx*dy-ry*dx);
    if(along>-12&&along<fwd+reach*0.6+E.r*0.5&&perp<(m.tip2?34:28)+E.r*0.5){any=true;damage(E,H.dmg,dx*H.push*.8,dy*H.push*.8,hi===2,hi===2?'big':'');}}
  if(any){P.stop=H.stop;SHAKE=Math.max(SHAKE,H.shake);if(hi===2)FLASH=4;}}
function skillBlast(){SHAKE=Math.max(SHAKE,4);FLASH=3;WAVES.push({x:P.x,y:P.y,a:0,big:1});
  for(const E of MOBS){if(E.dead||E.st==='spawn')continue;const dx=E.x-P.x,dy=(E.y-P.y)*1.9,d=Math.hypot(dx,dy);if(d<130+E.r){const k=d||1;damage(E,45,dx/k*9,dy/k*4,true,'big');}}}
function damage(E,v,kx,ky,launch,kind){if(E.boss&&E.st==='stun')v=Math.round(v*1.5);E.hp-=v;E.fl=8;G.hits++;G.comboN=(G.comboT>0?G.comboN:0)+1;G.comboT=100;G.maxCombo=Math.max(G.maxCombo,G.comboN);
  POPS.push({x:E.x+(Math.random()*16-8),y:E.y-E.z-E.h-10,v,a:0,big:kind==='big',col:E.boss&&E.st==='stun'?'255,150,60':null});
  FXS.push({x:E.x,y:E.y-E.z-E.h*0.5,a:0});
  if(!E.boss){E.vx=kx;E.vy=ky;E.st='hit';E.t=0;if(launch||E.z>0)E.vz=Math.max(E.vz,launch?5.2:2.6);}
  if(E.hp<=0){E.dead=true;E.t=0;if(E.boss){G.bossDown=1;P.stop=24;FLASH=8;SHAKE=8;}}}
// ---------------- monsters ----------------
const SL={g:{fr:0,sq:1,hp:40,sp:1.6,leap:4.2,dmg:9,h:56,r:20},b:{fr:2,sq:2,hp:70,sp:2.2,leap:5.4,dmg:12,h:58,r:20}};
let MOBS=[],ROOM=null,RC=null,RI=0;
function mkSlime(k,x,y,i){const s=SL[k];return {k,x,y,z:0,vx:0,vy:0,vz:0,hp:s.hp,maxHp:s.hp,h:s.h,r:s.r,st:'spawn',t:-i*8,fl:0,face:-1,cd:60+i*20,hop:0};}
function mkBoar(){return {boss:1,x:740,y:RH/2,z:0,vx:0,vy:0,vz:0,hp:480,maxHp:480,h:120,r:56,st:'intro',t:0,fl:0,face:-1,cd:0,lag:480};}
function stepMob(E){
  E.t++;if(E.fl>0)E.fl--;
  if(E.dead)return;
  const dx=P.x-E.x,dy=P.y-E.y,d=Math.hypot(dx,dy)||1;
  if(E.boss)return stepBoar(E,dx,dy,d);
  const s=SL[E.k];
  if(E.z>0||E.vz){E.z+=E.vz;E.vz-=0.28;if(E.z<=0){E.z=0;E.vz=E.vz<-3?-E.vz*0.3:0;if(E.vz<0.8)E.vz=0;}}
  const mv=(vx,vy)=>{const r=E.r*0.6;if(!blocked(E.x+vx,E.y,r))E.x+=vx;if(!blocked(E.x,E.y+vy,r))E.y+=vy;};
  if(E.st==='spawn'){if(E.t>=0){if(E.t===0){E.z=70;E.vz=0;}if(E.z===0&&E.t>4){E.st='chase';E.t=0;}}else E.z=999;return;}
  if(E.st==='hit'){mv(E.vx,E.vy);E.vx*=0.8;E.vy*=0.8;if(E.t>22&&E.z===0){E.st='chase';E.t=0;E.cd=Math.max(E.cd,40);}return;}
  if(Math.abs(dx)>4)E.face=dx>0?1:-1;
  if(E.cd>0)E.cd--;
  if(E.st!=='chase')E.hz=0;
  if(E.st==='chase'){const ph=E.t%34;E.hz=ph<18?Math.sin(ph/18*Math.PI)*8:0;if(ph<18&&d>58){mv(dx/d*s.sp,dy/d*s.sp*0.8);}
    if(d<95&&E.cd<=0&&ph===0){E.st='wind';E.t=0;}return;}
  if(E.st==='wind'){if(E.t>=34){E.st='leap';E.t=0;E.vx=dx/d*s.leap;E.vy=dy/d*s.leap;E.vz=3.6;}return;}

    txt('돌엄니'+(B.hp<B.maxHp*0.4?'  (분노)':'')+(B.st==='stun'?'  기절! 피해 1.5배':''),x,y-5,10,'#ffd0a0');}
  // banners
  const bn=G.banner;if(bn){const a=Math.min(1,bn.t/10,(150-bn.t)/20);ctx.globalAlpha=Math.max(0,a);
    if(bn.boss){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,VH*0.3,VW,52);txt(bn.big,VW/2,VH*0.3+28,24,'#ff6a50','center');txt(bn.small,VW/2,VH*0.3+45,11,'#ffd0a0','center');}
    else txt(bn.big,VW/2,VH*0.28,bn.clear?30:22,bn.clear?'#ffd34a':'#fff','center'),txt(bn.small,VW/2,VH*0.28+18,11,'#ddd','center');
    ctx.globalAlpha=1;}
}
